const wideLogo = () => shippedImage('logo-wide.png'), watermark = () => shippedImage('watermark.png');
const logoOrName = (g, logo) => { if (logo) g.drawImage(logo, 90, 52, 110 * logo.naturalWidth / logo.naturalHeight, 110); else { g.fillStyle = SLIP_C.navy; g.font = `700 46px ${SANS}`; g.fillText(S.company || 'Company', 90, 120); } };
const letterheadImage = () => brandImage('letterhead');
// keep the letterhead and stamp on the phone, so slips made offline still carry them
function warmLetterhead() { ['letterhead', 'stamp'].forEach(t => { const f = latestFile('settings', t); if (f && !f.pending) fileBlob(f.id).catch(() => {}); }); }

// The stamp's ink alone: the background colour (read from the corners: white paper, a black square, or already
// see-through) is made see-through, with soft edges, so the stamp sits on the page like real ink.
function cleanStamp(img) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, w, h), px = d.data;
  const at = (x, y) => (y * w + x) * 4, corners = [at(2, 2), at(w - 3, 2), at(2, h - 3), at(w - 3, h - 3)];
  if (corners.every(i => px[i + 3] < 20)) return c; // already see-through
  const bg = [0, 1, 2].map(k => corners.reduce((t, i) => t + px[i + k], 0) / 4);
  for (let i = 0; i < px.length; i += 4) {
    const dist = Math.max(Math.abs(px[i] - bg[0]), Math.abs(px[i + 1] - bg[1]), Math.abs(px[i + 2] - bg[2]));
    px[i + 3] = Math.round(px[i + 3] * Math.min(1, Math.max(0, (dist - 40) / 70)));
  }
  g.putImageData(d, 0, 0);
  return c;
}
// The stamp's ring: the box around its ink, so any photo or scan of it lines up.
function inkCircle(img) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const n = 240, k = n / Math.max(iw, ih), w = Math.round(iw * k), h = Math.round(ih * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
  const px = g.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (px[i + 3] > 60 && px[i] + px[i + 1] + px[i + 2] < 600) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  }
  if (x1 <= x0) return { cx: iw / 2, cy: ih / 2, R: Math.min(iw, ih) / 2 };
  return { cx: (x0 + x1 + 1) / 2 / k, cy: (y0 + y1 + 1) / 2 / k, R: Math.max(x1 - x0 + 1, y1 - y0 + 1) / 2 / k };
}
// The stamp, its ring `size` across and centred on (x, y), with the date written along its dotted line.
function drawStamp(g, img, x, y, size, dateText, place) {
  const ink = img.ink || (img.ink = cleanStamp(img)), c = img.circle || (img.circle = inkCircle(ink)), k = size / (2 * c.R), p = { ...STAMP_PLACE, ...(place || {}) };
  g.save();
  g.globalCompositeOperation = 'multiply'; // like real ink: the printing under it still shows
  g.drawImage(ink, x - c.cx * k, y - c.cy * k, ink.width * k, ink.height * k);
  g.globalCompositeOperation = 'source-over';
  const R = size / 2, r = p.r * R, fs = Math.max(8, p.s * R);
  g.font = `700 ${fs}px ${SANS}`; g.fillStyle = SLIP_C.stampInk; g.textAlign = 'center';
  const chars = [...dateText], ws = chars.map(ch => g.measureText(ch).width), gap = fs * 0.06;
  let ang = p.a * Math.PI / 180 + (ws.reduce((a, b) => a + b, 0) + gap * (chars.length - 1)) / 2 / r; // from the left end, going round
  chars.forEach((ch, i) => {
    ang -= ws[i] / 2 / r;
    g.save(); g.translate(x + r * Math.cos(ang), y + r * Math.sin(ang)); g.rotate(ang - Math.PI / 2); g.fillText(ch, 0, 0); g.restore();
    ang -= (ws[i] / 2 + gap) / r;
  });
  g.restore();
}

// The company's contacts (Settings → Letterhead), kept on the letterhead's record: the sheet sends that to every login,
// so every phone's PDFs carry them, and the numbers stay out of the app's (public) code.
const CONTACT_FIELDS = [['whatsapp', 'WhatsApp', 'e.g. @yourcompany', 'text'], ['phone', 'Phone', 'e.g. +211 900 000 000', 'tel'], ['web', 'Website', 'e.g. yourcompany.com', 'url'], ['email', 'Email', 'e.g. info@yourcompany.com', 'email']];
const companyContacts = () => { const c = (latestFile('settings', 'letterhead') || {}).contact || {}; return CONTACT_FIELDS.filter(([k]) => c[k]).map(([k, label]) => [label, String(c[k])]); };
// top right of every page, level with the logo: a thin accent line, then label and value on each row
function drawContacts(p, rows) {
  if (!rows.length) return;
  const R = SLIP_W - 90, lineH = 34, labW = 118, top = 122 - rows.length * lineH / 2;
  p.font = `500 22px ${SANS}`;
  const vals = rows.map(([, v]) => fitText(p, v, 400)), x = R - labW - Math.max(...vals.map(v => p.measureText(v).width));
  p.fillStyle = SLIP_C.accent; p.fillRect(x - 22, top + 2, 3, rows.length * lineH - 4);
  rows.forEach(([lab], i) => {
    const y = top + i * lineH + 25;
    p.fillStyle = SLIP_C.label; p.font = `600 15px ${SANS}`; spaced(p, lab.toUpperCase(), x, y - 1, 1.4);
    p.fillStyle = SLIP_C.navy; p.font = `500 22px ${SANS}`; p.fillText(vals[i], x + labW, y);
  });
}

/* s = { title, no, stampDate, party: [label, value], when: [label, value], forLabel, lines: [{ t, v, strong, muted }],
         amount, cur, extra: [[label, value]], signLabel, signName, sig: canvas, photo: image|null, preparedBy, ref } */
// A page is as tall as what it holds (A4 width). Only the letterhead's header (top LH_TOP) is used — its address strip is
// left off (the owner's choice); the company's contacts are printed at the top right instead. The company's "B"
// (watermark.png, cut from the letterhead by tools/make-icons.py) fills the room below the header: as on the printed
// letterhead on a full A4 page, shrunk to fit a shorter one. It is drawn with or without a letterhead.
const LH_TOP = 0.18, WM = { h: 1065, right: 1229, fill: 0.9 }; // its height and right edge on A4; the part of the room it may take
function drawLetterhead(p, lh, wm, H) {
  const topH = lh ? lh.naturalHeight * LH_TOP * SLIP_W / lh.naturalWidth : 180;
  if (lh) p.drawImage(lh, 0, 0, lh.naturalWidth, lh.naturalHeight * LH_TOP, 0, 0, SLIP_W, topH);
  drawContacts(p, companyContacts());
  if (!wm) return;
  const room = H - topH, dh = Math.min(WM.h, room * WM.fill), dw = dh * wm.naturalWidth / wm.naturalHeight;
  p.save(); p.globalCompositeOperation = 'multiply'; // its white paper doesn't cover anything
  p.drawImage(wm, WM.right - dw, topH + (room - dh) / 2, dw, dh); // kept to the right edge, as printed
  p.restore();
}
async function renderSlip(s) {
  const C = SLIP_C, L = 90, R = SLIP_W - 90, CX = L + 660;
  const [lh, stampImg, logo, wm] = await Promise.all([letterheadImage(), brandImage('stamp'), wideLogo(), watermark()]);
  const c = document.createElement('canvas'); // the form, on a see-through layer as tall as it needs
  c.width = SLIP_W; c.height = 2600;
  const g = c.getContext('2d');
  let y = lh ? 268 : 200;
  if (!lh) { logoOrName(g, logo); y = 220; }
  // title and number
  g.fillStyle = C.navy; g.font = `700 46px ${SANS}`; spaced(g, s.title, L, y + 46, 4);
  g.fillStyle = C.accent; g.fillRect(L, y + 66, 90, 5);
  if (s.badge) { g.font = `700 20px ${SANS}`; spaced(g, s.badge, L + 110, y + 75, 1.6); } // e.g. CORRECTED — REPLACES PV-…
  g.font = `600 18px ${SANS}`; g.fillStyle = C.label; spaced(g, 'NO.', R, y + 16, 1.6, 'right');
  g.fillStyle = C.accent; g.font = `700 36px ${SANS}`; g.textAlign = 'right'; g.fillText(s.no, R, y + 52); g.textAlign = 'left';
  if (s.check) { g.font = `600 16px ${SANS}`; g.fillStyle = C.label; spaced(g, `CHECK ${s.check}`, R, y + 80, 1.4, 'right'); }
  const seal = s.check ? `${s.no} · ${s.check}` : '';
  y += 110;
  const lineFont = 28, lineH = 46, h4 = 270;
  const lineFontOf = l => `${l.strong ? 700 : 500} ${l.muted ? lineFont - 4 : lineFont}px ${SANS}`;
  // each pay line wraps only where its own amount leaves no room
  const lines = s.lines.flatMap(l => { g.font = lineFontOf(l); const room = CX - L - 48 - (l.v ? g.measureText(l.v).width + 28 : 0); return wrapText(g, l.t, room).map((t, i) => ({ ...l, t, v: i ? '' : l.v })); });
  g.font = `700 32px ${SANS}`; const party = wrapText(g, s.party[1] || '—', CX - L - 50), h1 = 76 + party.length * 40;
  const h2 = Math.max(250, 70 + lines.length * lineH + 20);
  g.font = `italic 28px ${SANS}`; const words = wrapText(g, amountInWords(s.amount, s.cur), CX - L - 50);
  const h3 = Math.max(76 + words.length * 38, 70 + s.extra.length * 64);
  const top = y, cells = [];
  const row = (h, draw) => { cells.push([y, h]); draw(y, h); y += h; };
  // row 1: paid to | date
  row(h1, t => {
    slipLabel(g, s.party[0], L + 24, t + 34);
    g.fillStyle = C.ink; g.font = `700 32px ${SANS}`; party.forEach((p, i) => g.fillText(p, L + 24, t + 78 + i * 40));
    slipLabel(g, s.when[0], CX + 24, t + 34);
    g.fillStyle = C.ink; g.font = `700 30px ${SANS}`; wrapText(g, s.when[1], R - CX - 48).forEach((p, i) => g.fillText(p, CX + 24, t + 78 + i * 36));
  });
  // row 2: being payment for | amount in
  row(h2, t => {
    slipLabel(g, s.forLabel || 'Being payment for', L + 24, t + 34);
    lines.forEach((l, i) => {
      const ly = t + 82 + i * lineH;
      g.fillStyle = l.muted ? C.label : C.ink; g.font = lineFontOf(l);
      g.fillText(l.t, L + 24, ly);
      if (l.v) { g.textAlign = 'right'; g.fillText(l.v, CX - 24, ly); g.textAlign = 'left'; }
      if (l.strong) { g.fillStyle = C.rule; g.fillRect(L + 24, ly - 36, CX - L - 48, 1); }
    });
    slipLabel(g, 'Amount in', CX + 24, t + 34);
    ['SSP', 'USD'].forEach((cur, i) => {
      const bx = CX + 24 + i * 130, by = t + 52;
      g.strokeStyle = C.navy; g.lineWidth = 2; g.strokeRect(bx, by, 28, 28);
      if (cur === s.cur) { g.beginPath(); g.moveTo(bx + 6, by + 15); g.lineTo(bx + 12, by + 22); g.lineTo(bx + 23, by + 6); g.lineWidth = 4; g.stroke(); }
      g.fillStyle = C.ink; g.font = `700 24px ${SANS}`; g.fillText(cur, bx + 38, by + 24);
    });
    const ax = CX + 24, aw = R - CX - 48, ay = t + 104, ah = Math.min(140, Math.max(96, h2 - 130));
    boxPath(g, ax, ay, aw, ah); g.fillStyle = C.tint; g.fill(); g.strokeStyle = C.navy; g.lineWidth = 2.5; g.stroke();
    const text = slipMoney(s.amount, s.cur);
    let fs = 44; g.font = `700 ${fs}px ${SANS}`;
    while (g.measureText(text).width > aw - 36 && fs > 22) { fs -= 2; g.font = `700 ${fs}px ${SANS}`; }
    g.fillStyle = C.ink; g.textAlign = 'right'; g.fillText(text, ax + aw - 18, ay + ah / 2 + fs * 0.36); g.textAlign = 'left';
  });
  // row 3: amount in words | paid from (and the day's rate)
  row(h3, t => {
    slipLabel(g, 'Amount in words', L + 24, t + 34);
    g.fillStyle = C.ink; g.font = `italic 28px ${SANS}`; words.forEach((w, i) => g.fillText(w, L + 24, t + 76 + i * 38));
    s.extra.forEach(([lab, val], i) => {
      slipLabel(g, lab, CX + 24, t + 34 + i * 64);
      g.fillStyle = C.ink; g.font = `600 24px ${SANS}`; g.fillText(val, CX + 24, t + 64 + i * 64);
    });
  });
  // row 4: received by (signature on its line, the name under it) | photo
  const split = s.photo ? CX : R;
  row(h4, t => {
    const lineY = t + h4 - 52, lineW = Math.min(520, split - L - 48);
    slipLabel(g, s.signLabel, L + 24, t + 34);
    if (s.signNote) { // a correction: what was signed, and who approved the change (never the signature under new figures)
      let ny = t + 74;
      s.signNote.forEach((line, i) => { g.fillStyle = i >= 2 ? C.accent : C.ink; g.font = `${i === 3 ? 700 : 500} 22px ${SANS}`; wrapText(g, line, split - L - 48).forEach(w => { g.fillText(w, L + 24, ny); ny += 32; }); });
    } else {
      sealOver(g, placeSignature(g, s.receivedSign ? s.receivedSign.sig : s.sig, L + 24, lineY, lineW, lineY - t - 52), seal);
      g.fillStyle = C.ink; g.fillRect(L + 24, lineY, lineW, 1.5);
      g.font = `600 24px ${SANS}`; g.fillText(s.signName || '', L + 24, lineY + 30);
      g.fillStyle = C.label; g.font = `400 18px ${SANS}`; g.textAlign = 'right'; g.fillText(s.receivedSign ? `Digitally signed · ${s.receivedSign.date}` : 'Signature', L + 24 + lineW, lineY + 30); g.textAlign = 'left';
    }
    if (s.photo) photoInto(g, s.photo, CX + 14, t + 14, R - CX - 28, h4 - 28);
  });
  // the ruling: outer box, the column line and the lines between rows (see-through: the watermark shows behind)
  g.strokeStyle = C.navy; g.lineWidth = 2.5; g.strokeRect(L, top, R - L, y - top);
  g.fillStyle = C.navy;
  cells.slice(1).forEach(([cy]) => g.fillRect(L, cy - 0.75, R - L, 1.5));
  cells.forEach(([cy, ch], i) => { if (i < 3 || s.photo) g.fillRect(CX - 0.75, cy, 1.5, ch); });
  // prepared / checked / approved; the company stamp goes over "approved", the way it is stamped on paper
  y += 200;
  const colW = (R - L) / 3;
  if (stampImg) drawStamp(g, stampImg, R - 112, y - 82, 216, s.stampDate, stampImg.place);
  [['Prepared by', s.preparedBy || '', s.preparedSign], ['Checked by', s.checkedBy || '', null], ['Approved by', s.approvedBy || (s.approval ? s.approval.name : ''), s.approval]].forEach(([lab, name, sign], i) => {
    const x = L + i * colW;
    drawSigned(g, x, y, colW - 40, sign, seal);
    g.fillStyle = C.ink; g.font = `600 24px ${SANS}`; if (name) g.fillText(name, x, y - 14);
    g.fillRect(x, y, colW - 40, 1.5);
    slipLabel(g, lab, x, y + 30); // drawn after the stamp, so the words stay readable
  });
  g.fillStyle = C.label; g.font = `400 18px ${SANS}`;
  g.fillText(`Ref ${s.ref} · made in the company app on ${fmtAbs(stamp())}${s.check ? ` · check code ${s.check}` : ''}`, L, y + 76);
  // the page: exactly as tall as the slip, on the letterhead's header with the watermark behind the form
  const H = y + 104;
  const page = document.createElement('canvas');
  page.width = SLIP_W; page.height = H;
  const p = page.getContext('2d');
  p.fillStyle = '#fff'; p.fillRect(0, 0, SLIP_W, H);
  drawLetterhead(p, lh, wm, H);
  p.drawImage(c, 0, 0);
  const jpeg = new Uint8Array(await (await canvasJpeg(page, PDF_Q)).arrayBuffer());
  return new Blob([jpegToPdf(jpeg, SLIP_W, H)], { type: 'application/pdf' });
}

/* ---------- statements: every entry for one person or project, on as many pages as it takes ---------- */
/* st = { title, no, date, info: [[label, value]], sections: [{ title, cols: [{ h, w, right, wrap }], rows: [[cell]], total: [label, value] }],
          summary: [[label, value, strong]], verdict: { text, good } | null, notes: [[heading, [line]]] | null,
          sign: { label, name, sig, photo } | null, approvals: true (prepared/checked/approved and the stamp, no signature box),
          preparedBy, preparedSign, checkedBy, approval, stampDate, check, ref } */
const fitText = (g, t, w) => { t = String(t ?? ''); if (g.measureText(t).width <= w) return t; while (t && g.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; };
async function renderStatement(st) {
  const [lh, stampImg, logo, wm] = await Promise.all([letterheadImage(), (st.sign || st.approvals) && !st.noStamp ? brandImage('stamp') : null, wideLogo(), watermark()]);
  const C = SLIP_C, L = 90, R = SLIP_W - 90, W = R - L, top = lh ? 268 : 200, limit = SLIP_H - 80, pages = [];
  let g, y;
  const page = () => {
    const c = document.createElement('canvas');
    c.width = SLIP_W; c.height = SLIP_H; pages.push(c);
    g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, SLIP_W, SLIP_H);
    drawLetterhead(g, lh, wm, SLIP_H);
    if (!lh) logoOrName(g, logo);
    y = top;
    if (pages.length > 1) { g.fillStyle = C.navy; g.font = `700 28px ${SANS}`; spaced(g, `${st.title} — CONTINUED`, L, y + 30, 2); g.fillStyle = C.label; g.font = `600 22px ${SANS}`; g.textAlign = 'right'; g.fillText(st.no, R, y + 30); g.textAlign = 'left'; y += 64; }
  };
  page();
  g.fillStyle = C.navy; g.font = `700 44px ${SANS}`; spaced(g, st.title, L, y + 46, 3);
  g.fillStyle = C.accent; g.fillRect(L, y + 66, 90, 5);
  g.font = `600 18px ${SANS}`; g.fillStyle = C.label; spaced(g, 'NO.', R, y + 16, 1.6, 'right');
  g.fillStyle = C.accent; g.font = `700 34px ${SANS}`; g.textAlign = 'right'; g.fillText(st.no, R, y + 52);
  g.fillStyle = C.ink; g.font = `500 22px ${SANS}`; g.fillText(st.date, R, y + 84); g.textAlign = 'left';
  y += 112;
  // who it is about: a ruled box of label / value pairs, two to a row
  const rowsN = Math.ceil(st.info.length / 2), ih = 70;
  g.strokeStyle = C.navy; g.lineWidth = 2; g.strokeRect(L, y, W, rowsN * ih);
  st.info.forEach(([lab, val], i) => {
    const x = L + (i % 2) * (W / 2), ry = y + Math.floor(i / 2) * ih;
    if (i % 2) { g.fillStyle = C.rule; g.fillRect(x, ry, 1.5, ih); }
    if (i >= 2 && i % 2 === 0) { g.fillStyle = C.rule; g.fillRect(L, ry, W, 1.5); }
    slipLabel(g, lab, x + 20, ry + 28);
    g.fillStyle = C.ink; g.font = `700 26px ${SANS}`; g.fillText(fitText(g, val, W / 2 - 40), x + 20, ry + 58);
  });
  y += rowsN * ih + 30;
  // tables: a header band, rows with a light stripe, a total line; they carry on to the next page when full
  const colX = cols => { let x = L; return cols.map(c => { const at = x; x += c.w; return at; }); };
  for (const sec of st.sections) {
    const xs = colX(sec.cols);
    const headRow = () => {
      g.fillStyle = C.tint; g.fillRect(L, y, W, 44); g.fillStyle = C.navy; g.fillRect(L, y + 43, W, 1.5);
      sec.cols.forEach((c, i) => { g.fillStyle = C.label; g.font = `700 17px ${SANS}`; spaced(g, c.h.toUpperCase(), c.right ? xs[i] + c.w - 14 : xs[i] + 14, y + 28, 1.2, c.right ? 'right' : 'left'); });
      y += 44;
    };
    if (y + 250 + (sec.photos && sec.photos.length ? 166 : 0) > limit) page(); // a heading never sits alone at the foot of a page
    g.fillStyle = C.navy; g.font = `700 24px ${SANS}`; g.fillText(fitText(g, sec.title, W), L, y + 24); y += 40;
    if (sec.sub) { g.fillStyle = C.label; g.font = `500 20px ${SANS}`; g.fillText(fitText(g, sec.sub, W), L, y + 8); y += 30; }
    if (sec.photos && sec.photos.length) { // the item's photos, to compare against what is there
      sec.photos.slice(0, 5).forEach((img, i) => { const x = L + i * 212; g.strokeStyle = C.rule; g.lineWidth = 1.5; g.strokeRect(x, y, 200, 150); fitInto(g, img, x + 2, y + 2, 196, 146, false); });
      y += 166;
    }
    headRow();
    if (!sec.rows.length) { g.fillStyle = C.label; g.font = `italic 22px ${SANS}`; g.fillText('Nothing yet.', L + 14, y + 30); y += 44; }
    sec.rows.forEach((row, ri) => {
      // a wrap column takes as many lines as its text needs, and the row grows with it
      const cells = row.map((cell, i) => { const c = sec.cols[i]; g.font = `${c.right ? 600 : 500} 22px ${SANS}`; return c.box ? [''] : c.wrap ? wrapText(g, String(cell ?? ''), c.w - 28) : [fitText(g, cell, c.w - 28)]; });
      const rh = 40 + (Math.max(1, ...cells.map(c => c.length)) - 1) * 30;
      if (y + rh > limit - 60) { page(); headRow(); }
      if (ri % 2) { g.fillStyle = C.stripe; g.fillRect(L, y, W, rh); }
      cells.forEach((lines, i) => {
        const c = sec.cols[i];
        if (c.box) return tickBox(g, xs[i] + c.w / 2 - 13, y + 7, row[i]);
        g.fillStyle = C.ink; g.font = `${c.right ? 600 : 500} 22px ${SANS}`;
        lines.forEach((t, li) => { if (c.right) { g.textAlign = 'right'; g.fillText(t, xs[i] + c.w - 14, y + 27 + li * 30); g.textAlign = 'left'; } else g.fillText(t, xs[i] + 14, y + 27 + li * 30); });
      });
      y += rh;
    });
    if (sec.total) {
      g.fillStyle = C.navy; g.fillRect(L, y, W, 1.5);
      g.fillStyle = C.ink; g.font = `700 24px ${SANS}`; g.fillText(sec.total[0], L + 14, y + 34);
      g.textAlign = 'right'; g.fillText(sec.total[1], R - 14, y + 34); g.textAlign = 'left';
      y += 50;
    }
    y += 24;

/* ---------- logins ---------- */
// Each person signs in with their own username and password. The Google Sheet checks it and decides
// what they receive and may change; the app only hides what they can't use. Until the sheet has
// logins (or for a phone that hasn't signed in yet) everything works as before, with the company password.
// The sign-in lives in its own storage slot, so it never ends up in a backup file.
const SESSION_KEY = KEY + '-login';
const ROLES = { admin: 'Admin', manager: 'Office manager', store: 'Store keeper' };
const ROLE_HELP = { admin: 'Everything, including giving logins', manager: 'Staff and salaries · her own expenses only, no company money · edits wait for an admin', store: 'Adds expenses · sees only their own, no company money' };
const RIGHTS = {
  admin: ['add', 'edit', 'delete', 'date', 'money', 'projects', 'settings', 'import', 'backup', 'restore', 'logins', 'phones', 'staff'],
  manager: ['add', 'suggest', 'date', 'backup', 'staff'], // suggest = edits and deletes wait for an admin's approval; no money (balances)
  store: ['add'],
};

// { token, user: { id, name, username, role }, check: { salt, hash } } — or { out: true, why } once signed out
let session = loadSession();
let usersCache = [];
function loadSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; } }
function saveSession(s) {
  session = s;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) { alert('⚠️ Could not save the sign-in: ' + e.message); }
}
const signedIn = () => !!(session && session.token);
const myName = () => (signedIn() ? session.user.name : '');
const can = what => !signedIn() || RIGHTS[session.user.role].includes(what);
const mustSignIn = () => !!(S && S.link && session && session.out);
const signInBanner = () => (S.link?.logins && !signedIn() ? `<div class="banner new"><span>👤 Everyone can now have their own login. Sign in with yours.</span><button class="btn small" data-act="signIn">Sign in</button></div>` : '');

// The phone's own check of a login password (for "unlock" without internet): PBKDF2 with many rounds,
// so a copy taken from the phone is slow to crack.
async function slowHash(pw, salt) {
  const enc = new TextEncoder(), key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: 200000 }, key, 256);
  return [...new Uint8Array(bits)].map(x => x.toString(16).padStart(2, '0')).join('');
}
// only the entries this phone hasn't sent yet (they must never be lost)
const onlyUnsent = () => { const d = new Set(S.dirty); return Object.fromEntries(Object.keys(SYNC_KEYS).map(key => [key, S[key].filter(r => d.has(recId(key, r)))])); };

// Signed in: remember who, and a check of the password so "unlock" works offline.
// The company code is removed from this phone, so a closed login can't fall back to it.
async function signedInAs(res, password) {
  const salt = randHex();
  saveSession({ token: res.token, user: res.me, check: { salt, hash: await slowHash(password, salt) } });
  // reload the company settings as this person may see them (only admins get the company password);
  // a store keeper sees only their own entries: drop everything else this phone held (it's all on the sheet)
  const clear = { settingsU: 0, ...(res.me.role === 'admin' ? {} : { pass: null }), ...(res.me.role === 'store' ? onlyUnsent() : {}) };
  if (res.me.role === 'store') dropFileCopies();
  S = { ...S, ...clear, link: { ...S.link, k: '', since: 0, logins: true }, lastBy: res.me.name };
  save();
}
// The sheet ended this sign-in (password reset, login disabled, or logins now required).
function signedOutByServer(why) {
  saveSession({ out: true, why });
  // nothing stays on a phone that lost access — except changes it hasn't sent yet
  S = { ...S, ...onlyUnsent(), pass: null, link: { ...S.link, since: 0 } }; // signing in again brings back what this login may see
  dropFileCopies();
  save(); closeAll(); render();
}
async function signOut() {
  const n = S.dirty.length + outbox.length;
  if (n) return alert(`This phone has ${n} change${n === 1 ? '' : 's'} or file${n === 1 ? '' : 's'} not sent to the Google Sheet yet.\n\nConnect to the internet and wait until it says "Up to date", then sign out.`);
  if (!confirm('Sign out of this phone?\n\nThe company records leave this phone. They come back when someone signs in.')) return;
  const token = session.token;
  saveSession({ out: true }); // the sign-in screen shows at once, so nothing new can be added meanwhile
  closeAll(); render(); dropFileCopies();
  try { await callServer(S.link, { op: 'logout', token }); } catch { /* already signed out on the sheet: fine */ }
  if (!S.dirty.length) { S = { ...S, ...noRecords(), link: { ...S.link, since: 0 } }; save(); } // never drop anything unsent
  render();
}

/* ---------- edits waiting for approval ---------- */
// An office manager's edit doesn't change the entry: it becomes a change request (kind C) that an admin
// approves or rejects. Until then the entry and every total keep the old values.
const canChange = () => can('edit') || can('suggest');
const saveLabel = () => (can('edit') ? 'Save changes' : 'Send for approval');
const approvalNote = old => (old && !can('edit') ? '<p class="note">An admin approves this change first. Until then the entry and the totals stay as they are.</p>' : '');
const waiting = () => (S.changes || []).filter(c => c.status === 'waiting');
const waitingFor = id => waiting().filter(c => c.target === id);
const recordsOf = kind => S[KIND_KEY[kind]] || [];
const targetOf = c => recordsOf(c.kind).find(x => x.id === c.target);
// the fields an edit may change, per kind (the Google Sheet checks the same list)
const EDITABLE = {
  E: ['cur', 'amount', 'paidTo', 'reason', 'location', 'project', 'mode', 'at', 'manualDate', 'rate'],
  R: ['cur', 'amount', 'project', 'mode', 'note', 'at', 'manualDate', 'rate'],
  T: ['cur', 'amount', 'from', 'to', 'note', 'at', 'manualDate'],
  P: ['name', 'value', 'valueCur'],
  W: ['name', 'phone', 'job', 'site', 'wage', 'cur', 'start', 'idNo', 'status', 'left', 'openingAmount', 'openingNote', 'clearedTo'],
  A: ['date', 'note'],
};
const editPart = c => (c.action ? {} : Object.fromEntries(Object.entries(c.after || {}).filter(([f]) => (EDITABLE[c.kind] || []).includes(f))));
// (records without a date and amount are named by what they are: a sync error must never fail on them)
const NAMED = { G: r => `Regular payment: ${r.name}`, B: r => `Bank account: ${r.bank}`, V: r => `Document: ${r.title}`, K: r => `Client: ${r.name}`, I: r => `${r.type === 'quote' ? 'Quotation' : 'Invoice'} ${r.no}`,
  N: r => `Buying list: ${r.t}`, U: r => `Supplier: ${r.name}`, J: r => `Trip: ${r.to}`, X: r => `Change to SSP: ${money(r.usd, 'USD')} → ${money(r.ssp, 'SSP')}` };
const whatIs = (kind, r) => (kind === 'P' ? `Project "${r.name}"` : kind === 'W' ? `Employee ${r.name}`
  : kind === 'A' ? `Day not worked: ${(workerOf(r.worker) || {}).name || r.worker}, ${fmtDate(r.date)}${r.note ? ` (${r.note})` : ''}` : NAMED[kind] ? NAMED[kind](r) : describe(kind, r));
// what approving would really change, worked out from the entry itself — never from the text sent with the request
function changeLines(c, r) {
  if (!r) return [];
  if (c.action === 'delete') return [`Delete it: ${whatIs(c.kind, r)}`];
  if (c.action === 'advance') return [`Give an advance of ${money(+c.after.amount, c.after.cur)} — more than the $${ADVANCE_LIMIT_USD} a month limit`];
  const next = { ...r, ...editPart(c) };
  if (c.kind !== 'P') return diff(r, next);
  const vc = x => x.valueCur || 'USD';
  return [r.name !== next.name && `Name: ${r.name} → ${next.name}`,
    (Number(r.value || 0) !== Number(next.value || 0) || vc(r) !== vc(next)) && `Project value: ${money(+r.value || 0, vc(r))} → ${money(+next.value || 0, vc(next))}`].filter(Boolean);
}
const waitingNote = id => waitingFor(id).map(c => `<p class="note">✏️ <b>Change waiting for approval</b> — ${esc(changeLines(c, targetOf(c)).join(' ; ') || 'no real change')} · asked by ${esc(c.by)}, ${esc(fmtAbs(c.at))}</p>`).join('');

function requestChange(kind, old, rec, changes, by) {
  const [[id], seq] = nextIds('C', 1, S.seq);
  const before = Object.fromEntries(Object.keys(rec).map(f => [f, old[f] ?? '']));

}

  const mine = waiting().filter(c => c.by === myName()).length;

function approvalsSheet() {

function changeCard(c) {
  const r = targetOf(c);

  // the entry was changed by someone else after this request: show it so the admin looks first
  const moved = r && Object.keys(c.before || {}).some(f => String(r[f] ?? '') !== String(c.before[f] ?? ''));
  return `<section class="card pad" style="margin-bottom:12px">
    <p style="margin:0 0 6px"><b>${esc(r ? whatIs(c.kind, r) : c.target)}</b></p>

    <p class="muted" style="margin:0 0 10px">Asked by ${esc(c.by)} · ${esc(fmtAbs(c.at))}</p>
    ${gone ? '<p class="note">This entry was deleted — the change can only be rejected.</p>' : moved ? '<p class="note">⚠️ This entry was changed after the request. Check it before approving.</p>' : ''}
    <div class="two"><button class="btn danger" data-act="decide" data-id="${esc(c.id)}" data-ok="">Reject</button><button class="btn in" data-act="decide" data-id="${esc(c.id)}" data-ok="1" ${gone ? 'disabled' : ''}>Approve</button></div>
  </section>`;
}
async function decide(id, ok) {
  if (!await unlock('Enter the password to approve or reject changes.')) return;
  const c = S.changes.find(x => x.id === id);
  if (!c || c.status !== 'waiting') return approvalsSheet();
  const me = myName() || S.lastBy || 'Admin', key = KIND_KEY[c.kind];
  const r = targetOf(c), next = r && { ...r, ...editPart(c) };
  if (ok && (!r || r.deleted || !VALID[c.kind](next))) return alert("This change can't be applied: the entry is gone or the new values aren't valid. Reject it instead.");
  if (ok && c.action === 'delete' && c.kind === 'P' && [...live(S.expenses), ...live(S.credits)].some(x => x.project === c.target)) return alert('This project still has entries. Move or delete them first, or reject this.');
  const what = changeLines(c, r).join(' ; ') || 'no real change';
  const patch = {
    changes: S.changes.map(x => (x.id === id ? { ...x, status: ok ? 'approved' : 'rejected', decidedBy: me, decidedAt: stampSec() } : x)),
    log: logWith([[ok ? 'Approved' : 'Rejected', c.target, `${what} — asked by ${c.by}`]], me),
  };
  // an approved advance changes nothing yet: whoever hands over the money then records it against this approval
  if (ok && c.action === 'delete') patch[key] = S[key].map(x => (x.id === c.target ? { ...x, deleted: stampSec(), deletedBy: `${c.by} (approved by ${me})` } : x));
  if (ok && !c.action) patch[key] = S[key].map(x => (x.id === c.target ? { ...next, editedAt: stampSec(), editedBy: `${c.by} (approved by ${me})` } : x));
  update(patch);
  render(); approvalsSheet(); toast(!ok ? 'Rejected — the entry stays as it was' : c.action === 'delete' ? 'Approved ✓ The entry is deleted' : c.action === 'advance' ? 'Approved ✓ The advance can be given now' : 'Approved ✓ The entry is changed');
}

async function askDelete(k, id) {

/* ---------- the 4-digit code: opening the app, showing balances, unlocking edits ---------- */
// The code and the Face ID key live only in this phone's sign-in slot (never in backups). The code is checked like
// the password (slow hash); after 5 wrong codes only the password works. Face ID is a key made on this phone for this
// address; the phone's own check (the "user verified" flag) is what counts. iPhone home-screen apps sometimes fumble
// Face ID, so the code always works too.
const PIN_LEN = 4, QUICK_TRIES = 5;
const quick = () => (signedIn() && session.quick && session.quick.len === PIN_LEN && session.quick.tries < QUICK_TRIES ? session.quick : null);
const rndBytes = n => crypto.getRandomValues(new Uint8Array(n));
const bytesB64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function bioAvailable() {
  try { return !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch { return false; }
}
async function bioCheck() {
  const q = session && session.quick;
  if (!q || !q.cred) return false;
  try {
    const a = await navigator.credentials.get({ publicKey: { challenge: rndBytes(32), allowCredentials: [{ type: 'public-key', id: b64uBytes(q.cred) }], userVerification: 'required', timeout: 60000 } });
    return !!(new Uint8Array(a.response.authenticatorData)[32] & 4); // the phone checked the face or finger, not just a tap
  } catch { return false; }
}
// Face ID is turned on from a tap (phones only allow it then); some phones never answer, so give up after a minute.
async function bioOn() {
  try {
    const make = navigator.credentials.create({ publicKey: {
      challenge: rndBytes(32), rp: { name: 'Brookfield' }, user: { id: rndBytes(16), name: session.user.username, displayName: session.user.name },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
    const c = await Promise.race([make, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 65000))]);
    saveSession({ ...session, quick: { ...session.quick, cred: bytesB64u(c.rawId) } });
    toast('Face ID / Touch ID is on ✓');
  } catch { alert('Face ID / Touch ID could not be turned on. Your 4-digit code still works.'); }
  reopenHere();
}
function bioOff() { saveSession({ ...session, quick: { ...session.quick, cred: null } }); toast('Face ID / Touch ID is off'); reopenHere(); }

// The pad. mode: 'check' (type the code), 'new' then 'confirm' (choose a code), 'pass' (the password instead).
// mandatory = it can't be closed (opening the app). Resolves true once unlocked or a code is chosen.
let pin = null;
function pinPrompt({ why, mode = 'check', mandatory = false }) {
  if (pin) pin.resolve(false); // a newer prompt replaces an older one
  return new Promise(resolve => {
    pin = { why, mode: mode === 'check' && !quick() ? 'pass' : mode, mandatory, typed: '', first: '', err: '', busy: false, resolve };
    const d = $('#lock');
    pinDraw();
    if (!d.open) d.showModal();
    if (pin.mode === 'check' && quick().cred) bioTry(false); // straight to Face ID; the pad is right there if it fails
  });
}
function pinDraw() {
  const p = pin, q = quick();
  const title = { check: 'Enter your code', new: 'Choose a 4-digit code', confirm: 'Type the code again', pass: 'Enter your password' }[p.mode];
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-pin="${n}">${n}</button>`).join('');
  $('#lockIn').innerHTML = `${WIDE_LOGO}<h2>${title}</h2><p class="lk-why">${esc(p.why)}</p>
    ${p.mode === 'pass' ? `<form id="lkPwForm"><input type="password" id="lkPw" autocomplete="current-password" placeholder="Your password" required><p class="err">${esc(p.err)}</p><button class="btn primary">Unlock</button></form>`
      : `<div class="dots${p.err ? ' shake' : ''}">${Array.from({ length: PIN_LEN }, (_, i) => `<i class="${i < p.typed.length ? 'on' : ''}"></i>`).join('')}</div>
      <p class="err">${esc(p.busy ? 'Checking…' : p.err)}</p>
      <div class="keypad">${keys}${p.mode === 'check' && q && q.cred ? '<button type="button" class="ghostkey" data-pin="bio" aria-label="Use Face ID">🙂</button>' : '<span></span>'}<button type="button" data-pin="0">0</button><button type="button" class="ghostkey" data-pin="del" aria-label="Delete">⌫</button></div>`}
    <div class="lk-foot">${p.mode === 'check' ? '<button type="button" class="link" data-pin="pass">Use my password</button>' : ''}${p.mode === 'pass' && q ? '<button type="button" class="link" data-pin="code">Use my code</button>' : ''}${p.mandatory ? '' : '<button type="button" class="link" data-pin="cancel">Cancel</button>'}</div>`;
  if (p.mode === 'pass') $('#lkPw').focus();
}
function pinDone(ok) {
  const p = pin;
  pin = null;
  if (ok && session.quick && session.quick.tries) saveSession({ ...session, quick: { ...session.quick, tries: 0 } });
  $('#lock').close();
  p.resolve(ok);
}
async function bioTry(say) {
  if (await bioCheck()) { if (pin) pinDone(true); }
  else if (say && pin) { pin.err = 'Face ID did not work. Type your code.'; pinDraw(); }
}
async function pinKey(k) {
  const p = pin;
  if (!p || p.busy) return;
  if (k === 'cancel') return pinDone(false);
  if (k === 'bio') return bioTry(true);
  if (k === 'pass' || k === 'code') { p.mode = k === 'pass' ? 'pass' : 'check'; p.err = ''; p.typed = ''; return pinDraw(); }
  if (k === 'del') { p.typed = p.typed.slice(0, -1); return pinDraw(); }
  if (p.typed.length >= PIN_LEN) return;
  p.typed += k; p.err = '';
  pinDraw();
  if (p.typed.length < PIN_LEN) return;
  if (p.mode === 'new') { p.first = p.typed; p.typed = ''; p.mode = 'confirm'; return pinDraw(); }
  if (p.mode === 'confirm') {
    if (p.typed !== p.first) { p.mode = 'new'; p.typed = ''; p.err = "The two codes didn't match. Choose again."; return pinDraw(); }
    p.busy = true; pinDraw();
    const salt = randHex();
    saveSession({ ...session, quick: { salt, hash: await slowHash(p.typed, salt), len: PIN_LEN, cred: (session.quick && session.quick.cred) || null, tries: 0 } });
    return pinDone(true);
  }
  // check: let the dots fill, then the slow check
  p.busy = true; pinDraw();
  const q = session.quick, good = await slowHash(p.typed, q.salt) === q.hash;
  p.busy = false;
  if (good) return pinDone(true);
  const tries = (q.tries || 0) + 1;
  saveSession({ ...session, quick: { ...q, tries } });
  p.typed = '';
  if (tries >= QUICK_TRIES) { p.mode = 'pass'; p.err = 'Too many wrong codes. Type your password.'; }
  else p.err = `Wrong code. ${QUICK_TRIES - tries} ${QUICK_TRIES - tries === 1 ? 'try' : 'tries'} left.`;
  pinDraw();
}
async function pinPassword(e) {
  e.preventDefault();
  const p = pin, pw = $('#lkPw').value;
  if (!p) return;
  if (await slowHash(pw, session.check.salt) === session.check.hash) return pinDone(true);
  p.err = 'Wrong password. Try again.'; pinDraw();
}

// Started on an old date: was the salary paid up to the end of last month, up to today, or only partly?
function refreshOld(f) {
  const box = $('.oldpay', f);
  if (!box) return;
  const start = f.elements.start.value, t = today(), monthEnd = lastMonthEnd();
  box.hidden = !(DATE_RE.test(start) && start < t);
  if (box.hidden) return;
  const canMonth = start <= monthEnd;
  $('.opt-month', f).hidden = !canMonth;
  if (!canMonth && f.elements.cleared.value === 'month') $('[name=cleared][value=part]', f).checked = true; // started this month: usually not paid yet
  $('.lm', f).textContent = `${monthName(monthEnd.slice(0, 7))} and before are paid; wages count from 1 ${MONTHS[+t.slice(5, 7) - 1]}`;
  const choice = f.elements.cleared.value, wage = parseAmount(f.elements.wage.value) || 0, cur = formCur(f);
  $('.paidpart', f).hidden = choice !== 'part';
  const w = { id: 'new', wage, cur, start, status: 'active', ...(choice === 'month' ? { clearedTo: monthEnd } : choice === 'today' ? { clearedTo: t } : {}) };
  const earned = workerLedger(w, [], t).earned, paid = choice === 'part' ? parseAmount(f.elements.paidSoFar.value) || 0 : 0;
  $('.oldinfo', f).innerHTML = !wage ? 'Type the monthly wage to see what is owed.'
    : choice === 'part' ? `Earned since ${fmtDate(start)}: <b>${money(earned, cur)}</b><br>Already paid: <b>${money(paid, cur)}</b><br>Still to pay now: <b>${money(minus(earned, paid), cur)}</b>`
    : choice === 'month' ? `Still to pay now (this month so far): <b>${money(earned, cur)}</b>` : 'Nothing is owed today. Wages count again from tomorrow.';
}
async function saveWorker(f) {
  const v = Object.fromEntries(new FormData(f));
  const old = workerOf(f.dataset.id);
  const wage = parseAmount(v.wage), opening = String(v.openingAmount || '').replace(/[,\s$]/g, '');
  const rec = { name: clean(v.name), job: clean(v.job), phone: clean(v.phone), wage, cur: formCur(f), start: v.start, idNo: clean(v.idNo) };
  if (!rec.name) return formErr(f, 'name', 'Type their name');
  if (!rec.job) return formErr(f, 'job', 'Type their job');
  if (wage === null) return formErr(f, 'wage', 'Type the monthly wage, like 300');
  if (!DATE_RE.test(rec.start) || rec.start > today()) return formErr(f, 'start', 'Pick the day they started');
  if (old) {
    rec.openingAmount = opening ? Math.round(Number(opening) * 100) / 100 : 0;
    rec.clearedTo = DATE_RE.test(v.clearedTo || '') ? v.clearedTo : undefined;
    if (!Number.isFinite(rec.openingAmount)) return formErr(f, 'openingAmount', 'Type a number, like 150 or −50');
  } else {
    if (!f.elements.idphoto.files[0]) return formErr(f, 'idphoto', 'Add a photo of their national ID or passport');
    const choice = $('.oldpay', f).hidden ? '' : v.cleared;
    if (choice === 'month') rec.clearedTo = lastMonthEnd();
    if (choice === 'today') rec.clearedTo = today();
    if (choice === 'part') {
      const paid = String(v.paidSoFar || '').trim() ? parseAmount(v.paidSoFar) : 0;
      if (paid === null) return formErr(f, 'paidSoFar', 'Type what has been paid, like 200 — or 0');
      if (paid) Object.assign(rec, { openingAmount: -paid, openingNote: 'Paid before the app' });
    }
  }
  const by = clean(v.by);
  if (!by) return formErr(f, 'by', 'Type your name');
  if (old) {
    const changes = diff(old, rec);
    if (!changes.length) { closeSheet(); return toast('Nothing changed'); }
    if (!can('edit')) return requestChange('W', old, rec, changes, by);
    update({ workers: S.workers.map(x => x.id === old.id ? { ...x, ...rec, editedAt: stampSec(), editedBy: by } : x), log: logWith([['Edited', old.id, changes.join(' ; ')]], by), lastBy: by });
    closeSheet(); render(); return toast('Changes saved ✓');
  }
  const [[id], seq] = nextIds('W', 1, S.seq);
  const extra = [rec.clearedTo && `salary cleared up to ${fmtDate(rec.clearedTo)}`, rec.openingAmount && beforeText(rec.openingAmount, rec.cur)].filter(Boolean).join(' · ');
  update({ workers: [...S.workers, { id, ...rec, status: 'active', by, createdAt: stampSec() }], seq, lastBy: by,
    log: logWith([['Employee', id, `${rec.name} added · ${rec.job} · ${money(wage, rec.cur)} a month from ${fmtDate(rec.start)}${extra ? ' · ' + extra : ''}`]], by) });
  for (const type of ['idphoto', 'profile']) {
    const file = f.elements[type].files[0];
    if (!file) continue;
    try { const p = await prepareFile(file); await keepFile({ for: id, type, name: p.name, mime: p.mime }, p.data); }
    catch (e) { alert(`${FILE_NAME[type]}: ${e.message}`); }
  }
  render(); workerDetail(id); toast(`${rec.name} added ✓`);
}

// the dates from one day to another (both included)
function datesBetween(a, b) { const out = []; for (let d = a; d <= b && out.length < 62; d = dayAfter(d)) out.push(d); return out; }
// Record days not worked for someone; days already recorded are skipped. Returns how many were added, or an error.
function addAbsences(w, from, to, note, by) {
  if (!DATE_RE.test(from) || from < w.start || from > today()) return 'Pick a day between their start and today';
  if (to && (!DATE_RE.test(to) || to < from || to > today())) return 'The last day must be after the first, and not after today';
  const days = datesBetween(from, to || from);
  if (days.length > 31) return 'At most 31 days at once';
  if (w.left && days.some(d => d > w.left)) return `They left on ${fmtDate(w.left)}`;
  if (w.clearedTo && from <= w.clearedTo) return `Their salary is cleared up to ${fmtDate(w.clearedTo)}: days before that don't change the pay`;
  const have = new Set(absencesOf(w.id).map(a => a.date)), fresh = days.filter(d => !have.has(d));
  if (!fresh.length) return 'Already recorded';
  const [ids, seq] = nextIds('A', fresh.length, S.seq), at = stampSec();
  const span = fresh.length === 1 ? fmtDate(fresh[0]) : `${fmtDate(fresh[0])} – ${fmtDate(fresh[fresh.length - 1])} (${fresh.length} days)`;
  update({ absences: [...S.absences, ...fresh.map((date, i) => ({ id: ids[i], worker: w.id, date, note, by, createdAt: at }))], seq, lastBy: by,
    log: logWith([['Days not worked', w.id, `${w.name}: ${span}${note ? ' · ' + note : ''}`]], by) });
  return fresh.length;
}
function saveAbsence(f) {
  const w = workerOf(f.dataset.id), v = Object.fromEntries(new FormData(f)), by = clean(v.by);
  if (!by) return formErr(f, 'by', 'Type your name');
  const n = addAbsences(w, v.from, v.to, clean(v.note), by);
  if (typeof n === 'string') return formErr(f, 'from', n);
  closeSheet(); render(); toast(`✓ ${n} day${n === 1 ? '' : 's'} not worked recorded for ${w.name}`);
}

// Everything about one employee: wages month by month, every payment with its voucher number, and the balance.
// docs = voucher numbers not saved yet (the settlement slip being made right now)
function workerStatementSpec(w, { final = false, no, sig = null, photo = null, date = today(), docs = {} } = {}) {
  const l = ledgerOf(w), M = n => slipMoney(n, w.cur), end = w.status === 'left' && w.left ? w.left : today();
  const pays = live(S.expenses).filter(e => e.worker === w.id).sort(byAt);
  const settled = Math.abs(l.balance) < 0.005;
  return {
    title: final ? 'FINAL SETTLEMENT' : 'STATEMENT OF ACCOUNT', no, date: fmtDate(date), stampDate: date.split('-').reverse().join('-'),
    info: [['Employee', `${w.name}${w.job ? ` · ${w.job}` : ''}`], ['Employee no.', w.id], ['Started', fmtDate(w.start)], [w.status === 'left' ? 'Last day of work' : 'Up to', fmtDate(end)],
      ['Monthly wage', `${M(w.wage)} (30-day month)`], w.clearedTo ? ['Salary cleared up to', fmtDate(w.clearedTo)] : ['ID / passport no.', w.idNo || '—']],
    sections: [
      { title: 'Wages earned', cols: [{ h: 'Month', w: 330 }, { h: 'Days worked', w: 480 }, { h: 'Earned', w: 250, right: true }],
        rows: l.months.map(m => { const offs = dayList(absencesOf(w.id, m.month)); return [monthName(m.month), `${m.days - m.daysOff} of ${m.days}${m.daysOff ? ` (${m.daysOff} not worked${offs ? `: ${offs}` : ''})` : ''}`, M(m.earned)]; }), total: ['Total earned', M(l.earned)] },
      { title: 'Payments', cols: [{ h: 'Date', w: 170 }, { h: 'Voucher / ref', w: 200 }, { h: 'Details', w: 440 }, { h: 'Paid', w: 250, right: true }],
        rows: pays.map(e => { const c = inWage(e, w.cur); return [fmtDate(e.at.slice(0, 10)), docs[e.id] || docNo(e.id) || e.id, `${e.reason}${e.cur !== w.cur ? ` · ${slipMoney(e.amount, e.cur)}${e.rate ? ` at ${plain(e.rate)}` : ''}` : ''}`, c === null ? 'no rate' : M(c / 100)]; }),
        total: ['Total paid', M(l.paid)] },

/* paying an employee: salary for a month, an advance, or the final settlement */

// What a salary slip shows: how the amount due was reached, from the payment and the employee's account.
function payslipSpec(r) {
  const w = workerOf(r.worker) || { id: r.worker || '', name: r.paidTo, wage: 0, cur: r.cur, start: r.at.slice(0, 10) };
  const M = n => slipMoney(n, w.cur), round2 = n => Math.round(n * 100) / 100, lines = [];
  const paidNow = inWage(r, w.cur); // this payment in the wage's currency (cents), or null without a rate
  // the account up to the end of the month paid (salary), the last day (settlement) or today (advance), this payment included
  const end = r.pay === 'salary' && r.month ? [today(), `${r.month}-31`].sort()[0] : r.pay === 'settlement' && w.left ? w.left : today();
  const upTo = ledgerOf(w, end), due = paidNow === null ? null : round2(upTo.balance + paidNow / 100);
  const after = { t: upTo.balance >= 0 ? 'Balance after this payment' : 'Paid ahead after this payment', v: M(Math.abs(upTo.balance)), muted: true };
  if (r.pay === 'salary' && r.month) {
    const m = upTo.months.find(x => x.month === r.month) || { days: 0, daysOff: 0, earned: 0 };
    lines.push({ t: 'Monthly wage (30-day month)', v: M(w.wage) });
    if (m.days < 30) lines.push({ t: `Pay for ${m.days} days (wage ÷ 30 × ${m.days})`, v: M(round2(w.wage * m.days / 30)) });
    const offs = dayList(absencesOf(w.id, r.month));
    if (m.daysOff) lines.push({ t: `Less ${m.daysOff} day${m.daysOff === 1 ? '' : 's'} not worked${offs ? `: ${offs}` : ''}`, v: `−${M(round2(w.wage * m.days / 30) - m.earned)}` });
    lines.push({ t: `Earned for ${monthName(r.month)}`, v: M(m.earned), strong: true });
    const other = due === null ? 0 : round2(due - m.earned);
    if (other) lines.push({ t: other > 0 ? 'Earlier months still unpaid' : 'Less advances and earlier payments', v: `${other > 0 ? '+' : '−'}${M(Math.abs(other))}` });
    if (due !== null) lines.push({ t: `Total due to end of ${MON[+r.month.slice(5, 7) - 1]} ${r.month.slice(0, 4)}`, v: M(due), strong: true });
  } else if (r.pay === 'advance') lines.push({ t: 'Advance on salary', v: slipMoney(r.amount, r.cur) });
  else if (due !== null) lines.push({ t: `Total due up to the last day of work${w.left ? `, ${fmtDate(w.left)}` : ''}`, v: M(due), strong: true });
  lines.push(after);
  const salary = r.pay === 'salary';
  return { title: SLIP_TITLE[r.pay] || SLIP_TITLE.voucher, party: ['Employee', `${w.name}${w.job ? ` · ${w.job}` : ''}`], when: [salary ? 'Pay period' : 'Date', salary ? monthName(r.month) : slipDay(r)],
    forLabel: salary ? 'Pay details' : 'Being payment for', lines,
    extra: [...(salary ? [['Paid on', slipDay(r)]] : []), ['Paid from', accountOf(r.mode)], ...rateRow(r), ['Employee no.', w.id]], signLabel: 'Received by', signName: w.name };
}

/* ---------- regular payments: rent, internet, licence fees ---------- */

  if (old) {
    const changes = diff(old, rec);
    if (!changes.length) { closeSheet(); return toast('Nothing changed'); }
    update({ regulars: S.regulars.map(g => (g.id === old.id ? { ...g, ...rec, editedAt: stampSec(), editedBy: by } : g)), log: logWith([['Edited', old.id, changes.join(' ; ')]], by) });
    toast('Changes saved ✓');
    return closeSheet();
  }
  const [[id], seq] = nextIds('G', 1, S.seq), sugg = f.dataset.sugg && regularHints().find(s => s.key === f.dataset.sugg);
  // a suggestion's payments are linked, each to the due date (and how many periods) it paid, counted from this first date
  const links = new Map(sugg ? sugg.pays.map(p => [p.id, p]) : []);
  // one payment for several months pays from the first due date, as many periods as its money covers at the amount set
  const ahead = e => ({ period: rec.first, periods: Math.min(MAX_AHEAD, Math.max(1, Math.round(e.amount / amount))) });
  const linked = links.size ? S.expenses.map(e => { const p = links.get(e.id); return p ? { ...e, regular: id, ...(sugg.ahead ? ahead(e) : { period: dueOn(rec.first, every, Math.max(0, stretchOf({ first: rec.first, every }, p.period))), ...(p.periods ? { periods: p.periods } : {}) }) } : e; }) : null;
  update({ regulars: [...S.regulars, { id, ...rec, by, createdAt: stampSec() }], seq, ...(linked ? { expenses: linked } : {}),
    log: logWith([['Added', id, `Regular payment: ${rec.name} — ${money(amount, rec.cur)} to ${rec.paidTo}, ${EVERY[every].toLowerCase()} from ${fmtDate(rec.first)}${links.size ? ` (${links.size} past payments linked)` : ''}`]], by) });
  toast(links.size ? `Regular payment added ✓ — ${links.size} past payments linked` : 'Regular payment added ✓');
  render(); regularsSheet();
}
async function deleteRegular(id) {
  const g = regularOf(id);
  if (!g || !await unlock('Enter the password to delete this regular payment.')) return;
  const by = confirmBy(`Delete the regular payment "${g.name}"?\n\nWhat was already paid stays in the accounts. It just stops reminding you.`);
  if (!by) return;
  update({ regulars: S.regulars.map(x => (x.id === id ? { ...x, deleted: stampSec(), deletedBy: by } : x)), log: logWith([['Deleted', id, `Regular payment: ${g.name}`]], by) });

const bankOf = id => S.banks.find(b => b.id === id && !b.deleted);

// the text that is copied or sent: what a client types into their bank to pay. Accounts at the same bank, branch and name
// (one in SSP, one in USD) are one block with each number and its currency.
function bankText(list) {
  const groups = [];
  list.forEach(b => { const k = [b.bank, b.accName, b.branch, b.swift].join('|'), g = groups.find(x => x.k === k); if (g) g.list.push(b); else groups.push({ k, list: [b] }); });
  const no = b => `${b.number}${b.cur ? ` (${b.cur})` : ''}${b.note ? ` — ${b.note}` : ''}`;

/* ---------- the documents vault: licences, vehicle papers, passports — and when they expire ---------- */
// A document (kind V) is its details; its scan is a file of type 'document' (kept in Drive under 05 DOCUMENTS). Renewing
// one puts a new scan in place (the old one goes to CHANGES) and moves the dates. Company and vehicle papers are for
// admins and the office manager; personal ones (IDs, passports) for admins only — the sheet never sends them to anyone
// else (owner, 11 Oct 2026). The office manager may add papers; only admins change, renew or delete them.
const DOC_KIND = { company: ['🏢', 'Company documents', 'Licences, certificates, contracts'], vehicle: ['🚚', 'Vehicle documents', 'Registration, insurance, road licence'], personal: ['🪪', 'Personal documents', 'Shareholders’ and staff IDs and passports — admins only'] };
const DOC_OWNER = { company: ['Belongs to', 'e.g. the company, the Lologo warehouse'], vehicle: ['Vehicle', 'Number plate and type, e.g. KAA 123B truck'], personal: ['Person', 'Whose document is it?'] };
const docOf = id => S.docs.find(v => v.id === id && !v.deleted);
const docKinds = () => Object.keys(DOC_KIND).filter(k => k !== 'personal' || can('settings'));
const remindOf = v => (Number.isFinite(v.remind) ? v.remind : 30);
// how a document stands: expired, expiring within its reminder days, valid, or no expiry date
function docState(v) {
  if (!v.expires) return { tag: '', text: 'No expiry date', soon: false };
  const n = daysTo(v.expires);
  if (n < 0) return { tag: '<i class="tag bad">Expired</i>', text: `Expired ${fmtDate(v.expires)}`, soon: true };
  if (n <= remindOf(v)) return { tag: '<i class="tag warn">Expires soon</i>', text: n === 0 ? 'Expires today' : `Expires in ${n} day${n === 1 ? '' : 's'} — ${fmtDate(v.expires)}`, soon: true };
  return { tag: '', text: `Valid until ${fmtDate(v.expires)}`, soon: false };
}
const scanOf = id => filesFor(id, 'document').filter(f => !isOldVersion(f)).pop();

// on the first page: what has expired or will within its reminder days, and a word about payments due
function docBanners() {
  if (!can('staff')) return '';
  const due = live(S.docs).filter(v => docState(v).soon).sort((a, b) => a.expires.localeCompare(b.expires));
  const pays = dueList().filter(([, d]) => isDueSoon(d)).length;
  return due.slice(0, 3).map(v => `<div class="banner${daysTo(v.expires) < 0 ? '' : ' new'}"><span>${DOC_KIND[v.kind][0]} <b>${esc(v.title)}</b>${v.owner ? ` · ${esc(v.owner)}` : ''} — ${esc(docState(v).text)}</span><button class="btn small" data-act="openDoc" data-id="${esc(v.id)}">Open</button></div>`).join('')
    + (due.length > 3 ? `<div class="banner"><span>📄 ${due.length - 3} more documents expire soon.</span><button class="btn small" data-act="docs">See all</button></div>` : '')
    + (pays ? `<div class="banner new"><span>🔁 ${pays} regular payment${pays === 1 ? ' is' : 's are'} due or late.</span><button class="btn small" data-act="tab" data-tab="home">See</button></div>` : '');
}

function refreshDocKind(f) {
  const k = f.elements.kind.value, [label, ph] = DOC_OWNER[k] || DOC_OWNER.company;

function docFields(f) {
  const v = Object.fromEntries(new FormData(f)), remind = v.remind === '' ? 30 : Number(v.remind);
  const rec = { kind: v.kind, title: clean(v.title), owner: clean(v.owner), docNo: clean(v.docNo), issued: v.issued || '', expires: v.expires || '', remind, note: clean(v.note) };
  if (!DOC_KIND[rec.kind] || (rec.kind === 'personal' && !can('settings'))) return [null, 'Choose what kind of document it is'];
  if (!rec.title) return [null, 'What is the document called?', 'title'];
  if (!Number.isInteger(remind) || remind < 0 || remind > 365) return [null, 'Type the number of days, like 30', 'remind'];
  if (rec.issued && rec.expires && rec.expires < rec.issued) return [null, 'It cannot expire before it was issued', 'expires'];
  return [rec];
}
async function saveDoc(f) {
  const old = docOf(f.dataset.id), [rec, err, field] = docFields(f);
  if (!rec) return formErr(f, field || null, err);
  const by = myName() || S.lastBy || '';
  if (old) {
    const changes = diff(old, rec);
    if (!changes.length) { closeSheet(); return toast('Nothing changed'); }
    update({ docs: S.docs.map(v => (v.id === old.id ? { ...v, ...rec, editedAt: stampSec(), editedBy: by } : v)), log: logWith([['Edited', old.id, changes.join(' ; ')]], by) });
    toast('Changes saved ✓');
    return closeSheet();
  }
  const file = f.elements.scan.files[0];
  if (!file) return formErr(f, 'scan', 'Choose the photo or PDF of the document');
  $('.err', f).textContent = 'Saving…';
  let p;
  try { p = await prepareFile(file); } catch (e) { return formErr(f, 'scan', e.message); }
  const [[id], seq] = nextIds('V', 1, S.seq);
  update({ docs: [...S.docs, { id, ...rec, by, createdAt: stampSec() }], seq, log: logWith([['Added', id, `Document: ${rec.title}${rec.owner ? ` (${rec.owner})` : ''}${rec.expires ? `, expires ${fmtDate(rec.expires)}` : ''}`]], by) });
  await keepFile({ for: id, type: 'document', name: p.name, mime: p.mime }, p.data);
  toast('Document added ✓');
  docDetail(id);
}
function renewForm(id) {
  const v = docOf(id);
  if (!v) return;
  openSheet(`${head(`Renew ${v.title}`, '', id)}
    <p class="hint">The new document takes the old one's place. The old one is kept in Drive (folder CHANGES).</p>

async function saveRenew(f) {
  const v = docOf(f.dataset.id), file = f.elements.scan.files[0], issued = f.elements.issued.value, expires = f.elements.expires.value;
  if (!v) return;
  if (!file) return formErr(f, 'scan', 'Choose the photo or PDF of the new document');
  if (v.expires && expires <= v.expires) return formErr(f, 'expires', `The new one should expire after ${fmtDate(v.expires)}`);
  $('.err', f).textContent = 'Saving…';
  let p;
  try { p = await prepareFile(file); } catch (e) { return formErr(f, 'scan', e.message); }
  const old = scanOf(v.id), by = myName() || S.lastBy || '', rec = { issued: issued || '', expires: expires || '' };
  update({ docs: S.docs.map(x => (x.id === v.id ? { ...x, ...rec, editedAt: stampSec(), editedBy: by } : x)),
    log: logWith([['Renewed', v.id, `${v.title}: ${v.expires ? `expired ${fmtDate(v.expires)} → ` : ''}${expires ? `expires ${fmtDate(expires)}` : 'no expiry date'}`]], by) });
  await keepFile({ for: v.id, type: 'document', name: p.name, mime: p.mime, ...(old ? { replaces: old.id } : {}) }, p.data);
  if (old) await setAside(old, 'replaced');
  toast('Renewed ✓ — the old one is kept');
  docDetail(v.id);
}

}

function invoiceLines(f) {

}

async function saveInvoice(f) {

  if (!DATE_RE.test(v.date)) return formErr(f, 'date', 'Choose the date');

/* ---------- the inspection: ticked on the phone at the factory ---------- */
// What is ticked is kept on this phone while the screen is open (a photo taken in between redraws it); Save writes only the
// items changed on it, so an item inspected on an earlier day keeps its date and inspector.
let inspDraft = {};
const okRow = (name, label, val, na, fid) => `<div class="okrow"><span>${esc(label)}${fid ? `<button type="button" class="spec-thumb" data-act="showFile" data-id="${esc(fid)}" aria-label="Open the photo"><img alt="" data-thumb="${esc(fid)}"></button>` : ''}</span><div class="okbad">
  <label><input type="radio" name="${name}" value="ok" ${val === 'ok' ? 'checked' : ''}><span aria-label="OK">✓</span></label><label class="no"><input type="radio" name="${name}" value="bad" ${val === 'bad' ? 'checked' : ''}><span aria-label="Not OK">✗</span></label>
  ${na ? `<label><input type="radio" name="${name}" value="na" ${val === 'na' ? 'checked' : ''}><span>n/a</span></label>` : ''}</div></div>`;
// the results so far for one item: the draft, else its last inspection, else nothing ticked
const inspOf = n => inspDraft[n.id] || { inc: true, specs: (n.insp && n.insp.specs) || [], std: (n.insp && n.insp.std) || {}, counted: n.insp && n.insp.counted !== undefined ? String(n.insp.counted) : '', note: (n.insp && n.insp.note) || '' };
function inspCard(n) {
  const r = inspOf(n), id = n.id;
  return `<section class="insp card pad">
    <label class="fld check"><input type="checkbox" name="i|${esc(id)}" ${r.inc ? 'checked' : ''}> <b>${esc(n.t)}</b></label>
    <p class="muted">${esc([`${plain(n.order.qty)} ${n.unit || ''} ordered ${fmtDate(n.order.date)}`, n.project && projName(n.project), n.area].filter(Boolean).join(' · '))}${n.insp ? ` · last check ${esc(fmtDate(n.insp.date))}: ${n.insp.result === 'fail' ? '<b>NOT OK</b>' : INSP_TEXT[n.insp.result]}` : ''}</p>
    ${photoStrip(id)}
    <div class="checks">${(n.specs || []).map(([k, v, fid], i) => okRow(`c|${id}|s|${i}`, `${k}: ${v}`, r.specs[i], false, fid)).join('')}
      ${STD_CHECKS.map(([k, label]) => okRow(`c|${id}|d|${k}`, label, r.std[k], true)).join('')}</div>
    <div class="two"><label class="fld"><span>Counted</span><input name="n|${esc(id)}" inputmode="decimal" value="${esc(r.counted)}" placeholder="${esc(plain(n.order.qty))}" autocomplete="off"></label><div></div></div>
    <label class="fld"><span>Note <em>(what is wrong, what was agreed)</em></span><textarea class="plain" name="t|${esc(id)}" rows="2" maxlength="600">${esc(r.note)}</textarea></label>
    ${attachButton(id, '📷 Photo of what you see', 'attachment', 'image/*')}
  </section>`;
}
function inspectSheet(supId) {
  const u = supOf(supId), items = toInspect(supId);
  if (!u) return;
  openSheet(`${head(`Inspection — ${u.name}`, 'out', [u.market, u.city, u.country].filter(Boolean).join(', '))}
    ${items.length ? `<p class="hint">At the factory, tick each line ✓ OK or ✗ not OK, count what is there and add photos. Untick an item to leave it out. The checklist PDF can be printed before; the report has the results.</p>
    <div class="two"><button class="btn ghost" data-act="inspPdf" data-id="${esc(supId)}" data-blank="1">📄 Checklist to print</button><button class="btn ghost" data-act="inspPdf" data-id="${esc(supId)}">📄 Report with results</button></div>
    <form data-form="inspect" data-id="${esc(supId)}" style="margin-top:14px">
      ${items.map(inspCard).join('')}
      <label class="fld"><span>Inspected by</span><input name="by" value="${esc(myName() || S.lastBy || '')}" maxlength="60" autocomplete="off" required></label>
      <p class="err"></p>
      <button class="btn out">Save the inspection</button>
    </form>` : empty('Nothing to inspect', 'Items ordered from this supplier show here until they are loaded.')}`);
  paintThumbs();
  comeBack(() => inspectSheet(supId));
}
// what the form says now, item by item
function readInspection(f) {
  const out = {};
  toInspect(f.dataset.id).forEach(n => {
    const val = name => { const el = f.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ''; };
    out[n.id] = { inc: !!f.elements[`i|${n.id}`]?.checked, specs: (n.specs || []).map((_, i) => val(`c|${n.id}|s|${i}`)), std: Object.fromEntries(STD_CHECKS.map(([k]) => [k, val(`c|${n.id}|d|${k}`)]).filter(([, x]) => x)),
      counted: (f.elements[`n|${n.id}`]?.value || '').trim(), note: (f.elements[`t|${n.id}`]?.value || '').trim() };
  });
  return out;
}
// the item a changed field belongs to (its name is "c|N-…|s|0", "n|N-…" …)
function keepInspDraft(f, field) {
  const id = String(field && field.name || '').split('|')[1];
  if (!id) return;
  const r = readInspection(f)[id];
  if (r) inspDraft = { ...inspDraft, [id]: r };
}
// how many were counted: a number ("1,200" too), 0, or null when nothing (or nonsense) was typed
const countOf = r => (r.counted === '' ? null : /^0+([.,]0*)?$/.test(r.counted) ? 0 : parseAmount(r.counted));
// fail: a line not OK, or fewer counted than ordered; pass: every line ticked OK (or n/a) and none short; else checked in part
function inspResult(r, n) {
  const c = countOf(r);
  if (r.specs.includes('bad') || Object.values(r.std).includes('bad') || (c !== null && c < n.order.qty)) return 'fail';
  return (n.specs || []).every((_, i) => r.specs[i]) && STD_CHECKS.every(([k]) => r.std[k]) ? 'pass' : 'open';
}
const INSP_TEXT = { pass: 'all good', fail: 'NOT OK', open: 'checked in part' };
const inspTouched = r => r.specs.some(Boolean) || Object.keys(r.std).length || r.counted !== '' || r.note;
function saveInspection(f) {
  const res = readInspection(f), by = clean(f.elements.by.value), items = toInspect(f.dataset.id).filter(n => res[n.id].inc && inspDraft[n.id] && inspTouched(res[n.id]));
  if (!by) return formErr(f, 'by', 'Who inspected?');
  if (!items.length) return formErr(f, null, 'Tick at least one line of an item first.');
  const bad = items.find(n => res[n.id].counted !== '' && countOf(res[n.id]) === null);
  if (bad) return formErr(f, `n|${bad.id}`, 'Type how many were counted, like 2');
  const at = stampSec(), day = today(), lines = [];
  const done = new Map(items.map(n => {
    const r = res[n.id], result = inspResult(r, n);
    lines.push(['Edited', n.id, `${n.t}: inspected at ${supOf(n.order.sup).name} — ${INSP_TEXT[result]}`]);
    return [n.id, { date: day, by, specs: r.specs, std: r.std, ...(countOf(r) !== null ? { counted: countOf(r) } : {}), note: r.note.slice(0, 600), result }];
  }));
  update({ needs: S.needs.map(x => { const i = done.get(x.id); return i ? { ...x, insp: i, status: i.result === 'pass' ? 'inspected' : 'ordered', steps: { ...(x.steps || {}), ...(i.result === 'pass' ? { inspected: day } : {}) }, editedAt: at, editedBy: by } : x; }),
    log: logWith(lines, by), lastBy: by });
  items.forEach(n => { delete inspDraft[n.id]; });
  const fails = [...done.values()].filter(i => i.result === 'fail').length, open = [...done.values()].filter(i => i.result === 'open').length;
  toast(fails ? `Saved — ${fails} item${fails === 1 ? '' : 's'} NOT OK` : open ? `Saved — ${open} not fully checked yet` : 'Saved ✓ — all OK');
  inspectSheet(f.dataset.id);
}

// One entry per line: Date | Currency | Amount | Paid to | Reason | Location | Project | Paid from | Entered by
// "Paid from" is Cash or Bank. Writing "Cash → Bank" (or "Bank → Cash") there makes the line a move
// between cash and bank instead of an expense. Columns may be separated by tabs or "|"; a header line is skipped.
const IMPORT_COLS = ['Date', 'Currency', 'Amount', 'Paid to', 'Reason', 'Location', 'Project', 'Paid from', 'Entered by'];
const IMPORT_TIME = '12:00'; // old lists have no time of day

function parseDay(text) {
  const t = clean(text);
  let y, m, d, hit;
  if ((hit = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, m, d] = hit.map(Number);
  else if ((hit = t.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2}|\d{4})$/))) { [, d, m, y] = hit.map(Number); if (y < 100) y += 2000; }
  else return null;

  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d ? `${y}-${pad(m)}-${pad(d)}` : null;
}
function parseImport(text) {
  const rows = [], errors = [];
  String(text || '').split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim().replace(/^\||\|$/g, '');
    if (!line.trim() || /^[\s|:-]+$/.test(line)) return; // blank or a "|---|" divider
    const cells = (line.includes('\t') ? line.split('\t') : line.split('|')).map(clean);
    if (/^date$/i.test(cells[0])) return; // header
    const [date, cur = '', amount = '', paidTo = '', reason = '', location = '', project = '', mode = '', by = ''] = cells;
    const day = parseDay(date);
    const c = /^(usd|\$|us\$)$/i.test(cur) ? 'USD' : /^ssp$/i.test(cur) ? 'SSP' : null;
    const a = parseAmount(amount);
    const move = mode.match(MOVE_RE);
    const isMove = !!move && move[1].toLowerCase() !== move[2].toLowerCase();
    const problem = !day ? `date "${date}" not understood (use day/month/year)`
      : !c ? `currency "${cur}" must be USD or SSP`
      : a === null ? `amount "${amount}" not understood`
      : isMove ? ''

    if (problem) { errors.push(`Line ${i + 1}: ${problem}`); return; }
    const at = `${day}T${IMPORT_TIME}`;

  const bad = live(S.expenses).map(e => ({ e, m: clean(e.mode).match(MOVE_RE) }))
    .filter(({ m }) => m && m[1].toLowerCase() !== m[2].toLowerCase());
  if (!bad.length) return 0;
  const have = new Set(live(S.transfers).map(moveKey));
  const moves = [];
  bad.forEach(({ e, m }) => {
    const mv = { id: `${e.id}-MOVE`, cur: e.cur, amount: e.amount, from: cap(m[1]), to: cap(m[2]), note: e.reason, at: e.at, manualDate: !!e.manualDate, by: e.by, createdAt: e.createdAt };
    if (!have.has(moveKey(mv))) { have.add(moveKey(mv)); moves.push(mv); } // already imported properly: just drop the expense
  });
  const badIds = new Set(bad.map(({ e }) => e.id));
  update({
    expenses: S.expenses.map(e => (badIds.has(e.id) ? { ...e, deleted: stampSec(), deletedBy: 'App repair' } : e)),
    transfers: [...S.transfers, ...moves],
    log: [...S.log, ...bad.map(({ e }) => ({ lid: `L-repair-${e.id}`, at: stampSec(), action: 'Repaired', id: e.id, by: 'App',
      text: `${money(e.amount, e.cur)} on ${fmtDate(e.at.slice(0, 10))} was imported as an expense by mistake. It is a ${clean(e.mode)} move, so it is now recorded as a move and no longer counted as spending.` }))],
  });
  return bad.length;
}
// An expense with the same day, currency and amount as a cash/bank move, that talks about a deposit
// or the bank, is probably the same money counted twice.
function lookalikeExpenses() {
  const moves = new Set(live(S.transfers).map(t => [t.at.slice(0, 10), t.cur, cents(t.amount)].join('|')));
  return live(S.expenses).filter(e => moves.has([e.at.slice(0, 10), e.cur, cents(e.amount)].join('|')) && /deposit|bank|withdraw|transfer/i.test(`${e.reason} ${e.paidTo}`));
}
function lookalikeBanner() {
  const e = can('delete') && lookalikeExpenses()[0];
  if (!e) return '';
  return `<div class="banner"><span>⚠️ The ${money(e.amount, e.cur)} expense on ${fmtDate(e.at.slice(0, 10))} (“${esc(e.reason)}”) looks like the same money as a cash ↔ bank move. If it is the deposit, delete this expense so it isn't counted as spending.</span><button class="btn small" data-act="open" data-kind="E" data-id="${esc(e.id)}">Show it</button></div>`;
}

/* ---------- app updates ---------- */
// GitHub Pages lets phones keep the app files for 10 minutes, so the app asks for version.json
// (never cached) to learn about a newer version, and "Update now" fetches a completely fresh copy.
// The app's address can also change (to the company's own domain): version.json then names the new home, and
// a phone still on the old address is asked to move — only once its waiting changes have reached the sheet,
// because the old address's storage stays behind.
let newerVersion = '', movedTo = '';
const CACHE_PREFIX = 'accounts-'; // same as in sw.js
async function latestInfo() {
  const res = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('version check failed');
  return res.json();
}
const elsewhere = home => typeof home === 'string' && /^https:\/\//.test(home) && !location.href.startsWith(home);
async function checkForUpdate() {
  if (location.protocol === 'file:') return;
  let info;
  try { info = await latestInfo(); } catch { return; } // offline: check again later
  const was = newerVersion + movedTo;
  movedTo = elsewhere(info.home) ? info.home : '';
  newerVersion = !movedTo && info.version && info.version !== APP_VERSION ? info.version : '';
  if (newerVersion + movedTo !== was && S && !typing()) render();
}
function moveBanner() {
  if (!movedTo) return '';
  const host = esc(new URL(movedTo).host), n = S ? S.dirty.length : 0;
  if (n) return `<div class="banner"><span>🏠 This app is moving to <b>${host}</b>. First connect to the internet so your ${n} waiting change${n === 1 ? '' : 's'} reach${n === 1 ? 'es' : ''} the Google Sheet.</span><button class="btn small" data-act="syncNow">Sync now</button></div>`;
  return `<div class="banner new"><span>🏠 This app now lives at <b>${host}</b>. Open it there, add it to your home screen and sign in once — everything is in the Google Sheet.</span><button class="btn small" data-act="moveApp">Open</button></div>`;
}
function moveApp() {
  if (S && S.dirty.length) return alert('Your waiting changes must reach the Google Sheet first. Connect to the internet and tap Sync now.');
  location.href = movedTo + (S && S.link ? `#join=${inviteCode()}` : '');
}
async function updateApp() {
  let v;
  try { const info = await latestInfo(); if (elsewhere(info.home)) { movedTo = info.home; render(); return moveApp(); } v = info.version; }
  catch { return alert('No internet. Connect to the internet to update the app.'); }
  if (v === APP_VERSION) { newerVersion = ''; render(); return toast(`You have the newest version ✓ (${APP_VERSION.slice(0, 7)})`); }
  toast('Updating the app…');
  // only this app's saved files are removed — your records are stored separately and stay
  try {
    await Promise.all((await caches.keys()).filter(k => k.startsWith(CACHE_PREFIX)).map(k => caches.delete(k)));
    const reg = await navigator.serviceWorker.getRegistration(); // the one for this page only
    if (reg) await reg.unregister();
  } catch (e) { console.warn('Could not clear the old app files:', e.message); }
  location.replace(`${location.pathname}?v=${v}`); // a new address, so no stored copy can be used
}
const updateBanner = () => (newerVersion ? `<div class="banner new"><span>🆕 A new version of the app is ready.</span><button class="btn small" data-act="updateApp">Update now</button></div>` : '');

/* ---------- installing the app on Android: one tap instead of Chrome's ⋮ menu ---------- */
// Chrome tells the page when the app can be installed (beforeinstallprompt); its install box may only open from a tap,
// so an Install banner shows above every page until it is installed (owner, 12 Oct 2026: a POCO phone whose menu had no
// "Add to Home screen"). iPhones have no such box: Safari's Share → Add to Home Screen stays the way.
let installEvent = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; paintInstall(); });
addEventListener('appinstalled', () => { installEvent = null; paintInstall(); toast('Installed ✓ — open Brookfield from your home screen'); });

// browsers never offer): then the button explains the steps instead.

function paintInstall() {
  const slot = document.getElementById('installSlot');
  if (slot) slot.innerHTML = (installEvent || isAndroid()) && !isInstalled() ? `<div class="banner new"><span>📲 <b>Install Brookfield</b> on this phone: it opens from your home screen like any app, even without internet.</span><button class="btn small primary" data-act="installApp">Install</button></div>` : '';
