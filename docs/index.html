/* ---------- the 4-digit code: opening the app, showing balances, unlocking edits ---------- */
// The code and the Face ID key live only in this phone's sign-in slot (never in backups). The code is checked like
// the password (slow hash); after 5 wrong codes only the password works. Face ID is a key made on this phone for this
// address; the phone's own check (the "user verified" flag) is what counts. iPhone home-screen apps sometimes fumble
// Face ID, so the code always works too.
const PIN_LEN = 4, QUICK_TRIES = 5;
const quick = () => (signedIn() && session.quick && session.quick.len === PIN_LEN && session.quick.tries < QUICK_TRIES ? session.quick : null);
const rndBytes = n => crypto.getRandomValues(new Uint8Array(n));
const bytesB64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function bioAvailable() {
  try { return !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch { return false; }
}
async function bioCheck() {
  const q = session && session.quick;
  if (!q || !q.cred) return false;
  try {
    const a = await navigator.credentials.get({ publicKey: { challenge: rndBytes(32), allowCredentials: [{ type: 'public-key', id: b64uBytes(q.cred) }], userVerification: 'required', timeout: 60000 } });
    return !!(new Uint8Array(a.response.authenticatorData)[32] & 4); // the phone checked the face or finger, not just a tap
  } catch { return false; }
}
// Face ID is turned on from a tap (phones only allow it then); some phones never answer, so give up after a minute.
async function bioOn() {
  try {
    const make = navigator.credentials.create({ publicKey: {
      challenge: rndBytes(32), rp: { name: 'Brookfield' }, user: { id: rndBytes(16), name: session.user.username, displayName: session.user.name },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' }, timeout: 60000 } });
    const c = await Promise.race([make, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 65000))]);
    saveSession({ ...session, quick: { ...session.quick, cred: bytesB64u(c.rawId) } });
    toast('Face ID / Touch ID is on ✓');
  } catch { alert('Face ID / Touch ID could not be turned on. Your 4-digit code still works.'); }
  reopenHere();
}
function bioOff() { saveSession({ ...session, quick: { ...session.quick, cred: null } }); toast('Face ID / Touch ID is off'); reopenHere(); }

// The pad. mode: 'check' (type the code), 'new' then 'confirm' (choose a code), 'pass' (the password instead).
// mandatory = it can't be closed (opening the app). Resolves true once unlocked or a code is chosen.
let pin = null;
function pinPrompt({ why, mode = 'check', mandatory = false }) {
  if (pin) pin.resolve(false); // a newer prompt replaces an older one
  return new Promise(resolve => {
    pin = { why, mode: mode === 'check' && !quick() ? 'pass' : mode, mandatory, typed: '', first: '', err: '', busy: false, resolve };
    const d = $('#lock');
    pinDraw();
    if (!d.open) d.showModal();
    if (pin.mode === 'check' && quick().cred) bioTry(false); // straight to Face ID; the pad is right there if it fails
  });
}
function pinDraw() {
  const p = pin, q = quick();
  const title = { check: 'Enter your code', new: 'Choose a 4-digit code', confirm: 'Type the code again', pass: 'Enter your password' }[p.mode];
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-pin="${n}">${n}</button>`).join('');
  $('#lockIn').innerHTML = `${WIDE_LOGO}<h2>${title}</h2><p class="lk-why">${esc(p.why)}</p>
    ${p.mode === 'pass' ? `<form id="lkPwForm"><input type="password" id="lkPw" autocomplete="current-password" placeholder="Your password" required><p class="err">${esc(p.err)}</p><button class="btn primary">Unlock</button></form>`
      : `<div class="dots${p.err ? ' shake' : ''}">${Array.from({ length: PIN_LEN }, (_, i) => `<i class="${i < p.typed.length ? 'on' : ''}"></i>`).join('')}</div>
      <p class="err">${esc(p.busy ? 'Checking…' : p.err)}</p>
      <div class="keypad">${keys}${p.mode === 'check' && q && q.cred ? '<button type="button" class="ghostkey" data-pin="bio" aria-label="Use Face ID">🙂</button>' : '<span></span>'}<button type="button" data-pin="0">0</button><button type="button" class="ghostkey" data-pin="del" aria-label="Delete">⌫</button></div>`}
    <div class="lk-foot">${p.mode === 'check' ? '<button type="button" class="link" data-pin="pass">Use my password</button>' : ''}${p.mode === 'pass' && q ? '<button type="button" class="link" data-pin="code">Use my code</button>' : ''}${p.mandatory ? '' : '<button type="button" class="link" data-pin="cancel">Cancel</button>'}</div>`;
  if (p.mode === 'pass') $('#lkPw').focus();
}
function pinDone(ok) {
  const p = pin;
  pin = null;
  if (ok && session.quick && session.quick.tries) saveSession({ ...session, quick: { ...session.quick, tries: 0 } });
  $('#lock').close();
  p.resolve(ok);
}
async function bioTry(say) {
  if (await bioCheck()) { if (pin) pinDone(true); }
  else if (say && pin) { pin.err = 'Face ID did not work. Type your code.'; pinDraw(); }
}
async function pinKey(k) {
  const p = pin;
  if (!p || p.busy) return;
  if (k === 'cancel') return pinDone(false);
  if (k === 'bio') return bioTry(true);
  if (k === 'pass' || k === 'code') { p.mode = k === 'pass' ? 'pass' : 'check'; p.err = ''; p.typed = ''; return pinDraw(); }
  if (k === 'del') { p.typed = p.typed.slice(0, -1); return pinDraw(); }
  if (p.typed.length >= PIN_LEN) return;
  p.typed += k; p.err = '';
  pinDraw();
  if (p.typed.length < PIN_LEN) return;
  if (p.mode === 'new') { p.first = p.typed; p.typed = ''; p.mode = 'confirm'; return pinDraw(); }
  if (p.mode === 'confirm') {
    if (p.typed !== p.first) { p.mode = 'new'; p.typed = ''; p.err = "The two codes didn't match. Choose again."; return pinDraw(); }
    p.busy = true; pinDraw();
    const salt = randHex();
    saveSession({ ...session, quick: { salt, hash: await slowHash(p.typed, salt), len: PIN_LEN, cred: (session.quick && session.quick.cred) || null, tries: 0 } });
    return pinDone(true);
  }
  // check: let the dots fill, then the slow check
  p.busy = true; pinDraw();
  const q = session.quick, good = await slowHash(p.typed, q.salt) === q.hash;
  p.busy = false;
  if (good) return pinDone(true);
  const tries = (q.tries || 0) + 1;
  saveSession({ ...session, quick: { ...q, tries } });
  p.typed = '';
  if (tries >= QUICK_TRIES) { p.mode = 'pass'; p.err = 'Too many wrong codes. Type your password.'; }
  else p.err = `Wrong code. ${QUICK_TRIES - tries} ${QUICK_TRIES - tries === 1 ? 'try' : 'tries'} left.`;
  pinDraw();
}
async function pinPassword(e) {
  e.preventDefault();
  const p = pin, pw = $('#lkPw').value;
  if (!p) return;
  if (await slowHash(pw, session.check.salt) === session.check.hash) return pinDone(true);
  p.err = 'Wrong password. Try again.'; pinDraw();
}

// Started on an old date: was the salary paid up to the end of last month, up to today, or only partly?
function refreshOld(f) {
  const box = $('.oldpay', f);
  if (!box) return;
  const start = f.elements.start.value, t = today(), monthEnd = lastMonthEnd();
  box.hidden = !(DATE_RE.test(start) && start < t);

  const canMonth = start <= monthEnd;
  $('.opt-month', f).hidden = !canMonth;
  if (!canMonth && f.elements.cleared.value === 'month') $('[name=cleared][value=part]', f).checked = true; // started this month: usually not paid yet
  $('.lm', f).textContent = `${monthName(monthEnd.slice(0, 7))} and before are paid; wages count from 1 ${MONTHS[+t.slice(5, 7) - 1]}`;
  const choice = f.elements.cleared.value, wage = parseAmount(f.elements.wage.value) || 0, cur = formCur(f);
  $('.paidpart', f).hidden = choice !== 'part';
  const w = { id: 'new', wage, cur, start, status: 'active', ...(choice === 'month' ? { clearedTo: monthEnd } : choice === 'today' ? { clearedTo: t } : {}) };
  const earned = workerLedger(w, [], t).earned, paid = choice === 'part' ? parseAmount(f.elements.paidSoFar.value) || 0 : 0;
  $('.oldinfo', f).innerHTML = !wage ? 'Type the monthly wage to see what is owed.'
    : choice === 'part' ? `Earned since ${fmtDate(start)}: <b>${money(earned, cur)}</b><br>Already paid: <b>${money(paid, cur)}</b><br>Still to pay now: <b>${money(minus(earned, paid), cur)}</b>`
    : choice === 'month' ? `Still to pay now (this month so far): <b>${money(earned, cur)}</b>` : 'Nothing is owed today. Wages count again from tomorrow.';
}
async function saveWorker(f) {
  const v = Object.fromEntries(new FormData(f));
  const old = workerOf(f.dataset.id);
  const wage = parseAmount(v.wage), opening = String(v.openingAmount || '').replace(/[,\s$]/g, '');
  const rec = { name: clean(v.name), job: clean(v.job), phone: clean(v.phone), wage, cur: formCur(f), start: v.start, idNo: clean(v.idNo) };
  if (!rec.name) return formErr(f, 'name', 'Type their name');
  if (!rec.job) return formErr(f, 'job', 'Type their job');
  if (wage === null) return formErr(f, 'wage', 'Type the monthly wage, like 300');
  if (!DATE_RE.test(rec.start) || rec.start > today()) return formErr(f, 'start', 'Pick the day they started');
  if (old) {
    rec.openingAmount = opening ? Math.round(Number(opening) * 100) / 100 : 0;
    rec.clearedTo = DATE_RE.test(v.clearedTo || '') ? v.clearedTo : undefined;
    if (!Number.isFinite(rec.openingAmount)) return formErr(f, 'openingAmount', 'Type a number, like 150 or −50');
  } else {
    if (!f.elements.idphoto.files[0]) return formErr(f, 'idphoto', 'Add a photo of their national ID or passport');
    const choice = $('.oldpay', f).hidden ? '' : v.cleared;
    if (choice === 'month') rec.clearedTo = lastMonthEnd();
    if (choice === 'today') rec.clearedTo = today();
    if (choice === 'part') {
      const paid = String(v.paidSoFar || '').trim() ? parseAmount(v.paidSoFar) : 0;
      if (paid === null) return formErr(f, 'paidSoFar', 'Type what has been paid, like 200 — or 0');
      if (paid) Object.assign(rec, { openingAmount: -paid, openingNote: 'Paid before the app' });
    }
  }
  const by = clean(v.by);
  if (!by) return formErr(f, 'by', 'Type your name');
  if (old) {
    const changes = diff(old, rec);
    if (!changes.length) { closeSheet(); return toast('Nothing changed'); }
    if (!can('edit')) return requestChange('W', old, rec, changes, by);
    update({ workers: S.workers.map(x => x.id === old.id ? { ...x, ...rec, editedAt: stampSec(), editedBy: by } : x), log: logWith([['Edited', old.id, changes.join(' ; ')]], by), lastBy: by });
    closeSheet(); render(); return toast('Changes saved ✓');
  }
  const [[id], seq] = nextIds('W', 1, S.seq);
  const extra = [rec.clearedTo && `salary cleared up to ${fmtDate(rec.clearedTo)}`, rec.openingAmount && beforeText(rec.openingAmount, rec.cur)].filter(Boolean).join(' · ');
  update({ workers: [...S.workers, { id, ...rec, status: 'active', by, createdAt: stampSec() }], seq, lastBy: by,
    log: logWith([['Employee', id, `${rec.name} added · ${rec.job} · ${money(wage, rec.cur)} a month from ${fmtDate(rec.start)}${extra ? ' · ' + extra : ''}`]], by) });
  for (const type of ['idphoto', 'profile']) {
    const file = f.elements[type].files[0];
    if (!file) continue;
    try { const p = await prepareFile(file); await keepFile({ for: id, type, name: p.name, mime: p.mime }, p.data); }
    catch (e) { alert(`${FILE_NAME[type]}: ${e.message}`); }
  }
  render(); workerDetail(id); toast(`${rec.name} added ✓`);
}

// the dates from one day to another (both included)
function datesBetween(a, b) { const out = []; for (let d = a; d <= b && out.length < 62; d = dayAfter(d)) out.push(d); return out; }
// Record days not worked for someone; days already recorded are skipped. Returns how many were added, or an error.
function addAbsences(w, from, to, note, by) {
  if (!DATE_RE.test(from) || from < w.start || from > today()) return 'Pick a day between their start and today';
  if (to && (!DATE_RE.test(to) || to < from || to > today())) return 'The last day must be after the first, and not after today';
  const days = datesBetween(from, to || from);
  if (days.length > 31) return 'At most 31 days at once';
  if (w.left && days.some(d => d > w.left)) return `They left on ${fmtDate(w.left)}`;
  if (w.clearedTo && from <= w.clearedTo) return `Their salary is cleared up to ${fmtDate(w.clearedTo)}: days before that don't change the pay`;
  const have = new Set(absencesOf(w.id).map(a => a.date)), fresh = days.filter(d => !have.has(d));
  if (!fresh.length) return 'Already recorded';
  const [ids, seq] = nextIds('A', fresh.length, S.seq), at = stampSec();
  const span = fresh.length === 1 ? fmtDate(fresh[0]) : `${fmtDate(fresh[0])} – ${fmtDate(fresh[fresh.length - 1])} (${fresh.length} days)`;
  update({ absences: [...S.absences, ...fresh.map((date, i) => ({ id: ids[i], worker: w.id, date, note, by, createdAt: at }))], seq, lastBy: by,
    log: logWith([['Days not worked', w.id, `${w.name}: ${span}${note ? ' · ' + note : ''}`]], by) });
  return fresh.length;
}
function saveAbsence(f) {
  const w = workerOf(f.dataset.id), v = Object.fromEntries(new FormData(f)), by = clean(v.by);
  if (!by) return formErr(f, 'by', 'Type your name');
  const n = addAbsences(w, v.from, v.to, clean(v.note), by);
  if (typeof n === 'string') return formErr(f, 'from', n);
  closeSheet(); render(); toast(`✓ ${n} day${n === 1 ? '' : 's'} not worked recorded for ${w.name}`);
}

// Everything about one employee: wages month by month, every payment with its voucher number, and the balance.
// docs = voucher numbers not saved yet (the settlement slip being made right now)
function workerStatementSpec(w, { final = false, no, sig = null, photo = null, date = today(), docs = {} } = {}) {
  const l = ledgerOf(w), M = n => slipMoney(n, w.cur), end = w.status === 'left' && w.left ? w.left : today();
  const pays = live(S.expenses).filter(e => e.worker === w.id).sort(byAt);

    info: [['Employee', `${w.name}${w.job ? ` · ${w.job}` : ''}`], ['Employee no.', w.id], ['Started', fmtDate(w.start)], [w.status === 'left' ? 'Last day of work' : 'Up to', fmtDate(end)],
      ['Monthly wage', `${M(w.wage)} (30-day month)`], w.clearedTo ? ['Salary cleared up to', fmtDate(w.clearedTo)] : ['ID / passport no.', w.idNo || '—']],
    sections: [
      { title: 'Wages earned', cols: [{ h: 'Month', w: 330 }, { h: 'Days worked', w: 480 }, { h: 'Earned', w: 250, right: true }],
        rows: l.months.map(m => { const offs = dayList(absencesOf(w.id, m.month)); return [monthName(m.month), `${m.days - m.daysOff} of ${m.days}${m.daysOff ? ` (${m.daysOff} not worked${offs ? `: ${offs}` : ''})` : ''}`, M(m.earned)]; }), total: ['Total earned', M(l.earned)] },
      { title: 'Payments', cols: [{ h: 'Date', w: 170 }, { h: 'Voucher / ref', w: 200 }, { h: 'Details', w: 440 }, { h: 'Paid', w: 250, right: true }],
        rows: pays.map(e => { const c = inWage(e, w.cur); return [fmtDate(e.at.slice(0, 10)), docs[e.id] || docNo(e.id) || e.id, `${e.reason}${e.cur !== w.cur ? ` · ${slipMoney(e.amount, e.cur)}${e.rate ? ` at ${plain(e.rate)}` : ''}` : ''}`, c === null ? 'no rate' : M(c / 100)]; }),
        total: ['Total paid', M(l.paid)] },

    // the tables already total what was earned and paid: here only what is outside them, and the balance

// What a salary slip shows: how the amount due was reached, from the payment and the employee's account.
function payslipSpec(r) {
  const w = workerOf(r.worker) || { id: r.worker || '', name: r.paidTo, wage: 0, cur: r.cur, start: r.at.slice(0, 10) };
  const M = n => slipMoney(n, w.cur), round2 = n => Math.round(n * 100) / 100, lines = [];
  const paidNow = inWage(r, w.cur); // this payment in the wage's currency (cents), or null without a rate
  // the account up to the end of the month paid (salary), the last day (settlement) or today (advance), this payment included
  const end = r.pay === 'salary' && r.month ? [today(), `${r.month}-31`].sort()[0] : r.pay === 'settlement' && w.left ? w.left : today();
  const upTo = ledgerOf(w, end), due = paidNow === null ? null : round2(upTo.balance + paidNow / 100);
  const after = { t: upTo.balance >= 0 ? 'Balance after this payment' : 'Paid ahead after this payment', v: M(Math.abs(upTo.balance)), muted: true };
  if (r.pay === 'salary' && r.month) {
    const m = upTo.months.find(x => x.month === r.month) || { days: 0, daysOff: 0, earned: 0 };
    lines.push({ t: 'Monthly wage (30-day month)', v: M(w.wage) });
    if (m.days < 30) lines.push({ t: `Pay for ${m.days} days (wage ÷ 30 × ${m.days})`, v: M(round2(w.wage * m.days / 30)) });
    const offs = dayList(absencesOf(w.id, r.month));
    if (m.daysOff) lines.push({ t: `Less ${m.daysOff} day${m.daysOff === 1 ? '' : 's'} not worked${offs ? `: ${offs}` : ''}`, v: `−${M(round2(w.wage * m.days / 30) - m.earned)}` });
    lines.push({ t: `Earned for ${monthName(r.month)}`, v: M(m.earned), strong: true });
    const other = due === null ? 0 : round2(due - m.earned);
    if (other) lines.push({ t: other > 0 ? 'Earlier months still unpaid' : 'Less advances and earlier payments', v: `${other > 0 ? '+' : '−'}${M(Math.abs(other))}` });
    if (due !== null) lines.push({ t: `Total due to end of ${MON[+r.month.slice(5, 7) - 1]} ${r.month.slice(0, 4)}`, v: M(due), strong: true });
  } else if (r.pay === 'advance') lines.push({ t: 'Advance on salary', v: slipMoney(r.amount, r.cur) });
  else if (due !== null) lines.push({ t: `Total due up to the last day of work${w.left ? `, ${fmtDate(w.left)}` : ''}`, v: M(due), strong: true });
  lines.push(after);
  const salary = r.pay === 'salary';
  return { title: SLIP_TITLE[r.pay] || SLIP_TITLE.voucher, party: ['Employee', `${w.name}${w.job ? ` · ${w.job}` : ''}`], when: [salary ? 'Pay period' : 'Date', salary ? monthName(r.month) : slipDay(r)],
    forLabel: salary ? 'Pay details' : 'Being payment for', lines,
    extra: [...(salary ? [['Paid on', slipDay(r)]] : []), ['Paid from', accountOf(r.mode)], ...rateRow(r), ['Employee no.', w.id]], signLabel: 'Received by', signName: w.name };
}

/* ---------- import old entries (paste rows from a list or sheet) ---------- */
// One entry per line: Date | Currency | Amount | Paid to | Reason | Location | Project | Paid from | Entered by
// "Paid from" is Cash or Bank. Writing "Cash → Bank" (or "Bank → Cash") there makes the line a move
// between cash and bank instead of an expense. Columns may be separated by tabs or "|"; a header line is skipped.
const IMPORT_COLS = ['Date', 'Currency', 'Amount', 'Paid to', 'Reason', 'Location', 'Project', 'Paid from', 'Entered by'];
const IMPORT_TIME = '12:00'; // old lists have no time of day
const MAX_SHOWN_ERRORS = 8;

function parseDay(text) {
  const t = clean(text);
  let y, m, d, hit;
  if ((hit = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, m, d] = hit.map(Number);
  else if ((hit = t.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2}|\d{4})$/))) { [, d, m, y] = hit.map(Number); if (y < 100) y += 2000; }
  else return null;
  const dt = new Date(y, m - 1, d); // rejects 31/02 and month 13
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d ? `${y}-${pad(m)}-${pad(d)}` : null;
}
function parseImport(text) {
  const rows = [], errors = [];
  String(text || '').split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim().replace(/^\||\|$/g, '');
    if (!line.trim() || /^[\s|:-]+$/.test(line)) return; // blank or a "|---|" divider
    const cells = (line.includes('\t') ? line.split('\t') : line.split('|')).map(clean);
    if (/^date$/i.test(cells[0])) return; // header
    const [date, cur = '', amount = '', paidTo = '', reason = '', location = '', project = '', mode = '', by = ''] = cells;
    const day = parseDay(date);
    const c = /^(usd|\$|us\$)$/i.test(cur) ? 'USD' : /^ssp$/i.test(cur) ? 'SSP' : null;
    const a = parseAmount(amount);
    const move = mode.match(MOVE_RE);
    const isMove = !!move && move[1].toLowerCase() !== move[2].toLowerCase();
    const problem = !day ? `date "${date}" not understood (use day/month/year)`
      : !c ? `currency "${cur}" must be USD or SSP`
      : a === null ? `amount "${amount}" not understood`
      : isMove ? ''
      : !paidTo ? '"Paid to" is empty' : !reason ? '"Reason" is empty' : '';
    if (problem) { errors.push(`Line ${i + 1}: ${problem}`); return; }
    const at = `${day}T${IMPORT_TIME}`;
    if (isMove) rows.push({ kind: 'T', at, cur: c, amount: a, from: cap(move[1]), to: cap(move[2]), note: reason || paidTo, by });
    else rows.push({ kind: 'E', at, cur: c, amount: a, paidTo, reason, location, project, mode: accountOf(mode), by });
  });
  return { rows, errors };
}

const importKey = x => (x.kind === 'T'

  : ['E', x.at.slice(0, 10), x.cur, cents(x.amount), clean(x.reason).toLowerCase()]).join('|');
function importPlan(text) {
  const { rows, errors } = parseImport(text);
  const have = new Set([...live(S.expenses).map(e => importKey({ ...e, kind: 'E' })), ...live(S.transfers).map(t => importKey({ ...t, kind: 'T' }))]);
  const fresh = rows.filter(r => !have.has(importKey(r)));

async function importSheet() {

    <form data-form="import">

/* ---------- repairs ---------- */
const moveKey = x => [x.at.slice(0, 10), x.cur, cents(x.amount), x.from].join('|');
// The importer before cash/bank moves saved "Cash → Bank" lines as expenses. Turn each into the move
// it was meant to be. Ids are made from the expense id, so every device repairs to the same records.
function repairImportedMoves() {
  if (!S || !can('delete')) return 0; // the repair deletes expenses, so only admins (or phones without logins) run it
  const bad = live(S.expenses).map(e => ({ e, m: clean(e.mode).match(MOVE_RE) }))
    .filter(({ m }) => m && m[1].toLowerCase() !== m[2].toLowerCase());
  if (!bad.length) return 0;
  const have = new Set(live(S.transfers).map(moveKey));
  const moves = [];
  bad.forEach(({ e, m }) => {
    const mv = { id: `${e.id}-MOVE`, cur: e.cur, amount: e.amount, from: cap(m[1]), to: cap(m[2]), note: e.reason, at: e.at, manualDate: !!e.manualDate, by: e.by, createdAt: e.createdAt };
    if (!have.has(moveKey(mv))) { have.add(moveKey(mv)); moves.push(mv); } // already imported properly: just drop the expense
  });
  const badIds = new Set(bad.map(({ e }) => e.id));
  update({
    expenses: S.expenses.map(e => (badIds.has(e.id) ? { ...e, deleted: stampSec(), deletedBy: 'App repair' } : e)),
    transfers: [...S.transfers, ...moves],
    log: [...S.log, ...bad.map(({ e }) => ({ lid: `L-repair-${e.id}`, at: stampSec(), action: 'Repaired', id: e.id, by: 'App',
      text: `${money(e.amount, e.cur)} on ${fmtDate(e.at.slice(0, 10))} was imported as an expense by mistake. It is a ${clean(e.mode)} move, so it is now recorded as a move and no longer counted as spending.` }))],
  });

}

function lookalikeExpenses() {

  return live(S.expenses).filter(e => moves.has([e.at.slice(0, 10), e.cur, cents(e.amount)].join('|')) && /deposit|bank|withdraw|transfer/i.test(`${e.reason} ${e.paidTo}`));
}
function lookalikeBanner() {
  const e = can('delete') && lookalikeExpenses()[0];
  if (!e) return '';
  return `<div class="banner"><span>⚠️ The ${money(e.amount, e.cur)} expense on ${fmtDate(e.at.slice(0, 10))} (“${esc(e.reason)}”) looks like the same money as a cash ↔ bank move. If it is the deposit, delete this expense so it isn't counted as spending.</span><button class="btn small" data-act="open" data-kind="E" data-id="${esc(e.id)}">Show it</button></div>`;
}

/* ---------- app updates ---------- */
// GitHub Pages lets phones keep the app files for 10 minutes, so the app asks for version.json
// (never cached) to learn about a newer version, and "Update now" fetches a completely fresh copy.
// The app's address can also change (to the company's own domain): version.json then names the new home, and
// a phone still on the old address is asked to move — only once its waiting changes have reached the sheet,

  const res = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('version check failed');
  return res.json();
}

  if (location.protocol === 'file:') return;
  let info;
  try { info = await latestInfo(); } catch { return; } // offline: check again later
  const was = newerVersion + movedTo;
  movedTo = elsewhere(info.home) ? info.home : '';
  newerVersion = !movedTo && info.version && info.version !== APP_VERSION ? info.version : '';
  if (newerVersion + movedTo !== was && S && !typing()) render();
}

  if (n) return `<div class="banner"><span>🏠 This app is moving to <b>${host}</b>. First connect to the internet so your ${n} waiting change${n === 1 ? '' : 's'} reach${n === 1 ? 'es' : ''} the Google Sheet.</span><button class="btn small" data-act="syncNow">Sync now</button></div>`;
  return `<div class="banner new"><span>🏠 This app now lives at <b>${host}</b>. Open it there, add it to your home screen and sign in once — everything is in the Google Sheet.</span><button class="btn small" data-act="moveApp">Open</button></div>`;
}
function moveApp() {
  if (S && S.dirty.length) return alert('Your waiting changes must reach the Google Sheet first. Connect to the internet and tap Sync now.');
  location.href = movedTo + (S && S.link ? `#join=${inviteCode()}` : '');
}
async function updateApp() {
  let v;
  try { const info = await latestInfo(); if (elsewhere(info.home)) { movedTo = info.home; render(); return moveApp(); } v = info.version; }
  catch { return alert('No internet. Connect to the internet to update the app.'); }
  if (v === APP_VERSION) { newerVersion = ''; render(); return toast(`You have the newest version ✓ (${APP_VERSION.slice(0, 7)})`); }
  toast('Updating the app…');
  // only this app's saved files are removed — your records are stored separately and stay
  try {
    await Promise.all((await caches.keys()).filter(k => k.startsWith(CACHE_PREFIX)).map(k => caches.delete(k)));
    const reg = await navigator.serviceWorker.getRegistration(); // the one for this page only
    if (reg) await reg.unregister();
  } catch (e) { console.warn('Could not clear the old app files:', e.message); }
  location.replace(`${location.pathname}?v=${v}`); // a new address, so no stored copy can be used
}
const updateBanner = () => (newerVersion ? `<div class="banner new"><span>🆕 A new version of the app is ready.</span><button class="btn small" data-act="updateApp">Update now</button></div>` : '');

/* ---------- events ---------- */
const ACTIONS = {
  tab: b => { tab = b.dataset.tab; render(); scrollTo(0, 0); },
  close: closeSheet,
  setupMode: b => { setupMode = b.dataset.mode; render(); const jf = $('form[data-form=join]'); if (jf) inviteHint(jf); },
  addExpense: () => expenseForm(),
  addBulk: () => bulkForm(),
  addCredit: b => creditForm(null, b.dataset.project),
  addProject: () => projectForm(),
  addMove: () => moveForm(),
  open: b => detail(b.dataset.kind, b.dataset.id),
  openProject: b => projectDetail(b.dataset.id),
  edit: async b => {
    const k = b.dataset.kind, r = S[COLL[k]].find(x => x.id === b.dataset.id);
    if (await unlock('Enter the password to edit this entry.')) ({ E: expenseForm, R: creditForm, T: moveForm })[k](r);
  },
  del: b => deleteRecord(b.dataset.kind, b.dataset.id),
  editProject: async b => { if (await unlock('Enter the password to edit this project.')) projectForm(S.projects.find(p => p.id === b.dataset.id)); },
  delProject: b => deleteProject(b.dataset.id),
  unlockDate: async b => {
    if (!await unlock('Enter the password to use a different date.')) return;
    b.closest('.fld').outerHTML = whenField(stamp(), true);
  },
  addRow: () => { const rows = $('.brows'); rows.insertAdjacentHTML('beforeend', bulkRow()); $('.brow:last-child input', rows).focus(); },
  delRow: b => { const rows = $('.brows'); if (rows.children.length > 1) b.closest('.brow').remove(); else $$('input', b.closest('.brow')).forEach(i => (i.value = '')); updateBulk(rows.closest('form')); },
  hist: b => { histKind = b.dataset.k; histMonth = ''; render(); },
  backup: () => doBackup(),
  restore: () => $('#restoreFile').click(),
  settings: async () => { if (await unlock('Enter the password to change settings.')) settingsForm(); },
  lock: () => { unlockedUntil = 0; renderLock(); toast('Locked 🔒'); },
  connect: async () => { if (await unlock('Enter the password to connect this device to the Google Sheet.')) connectForm(); },
  syncNow: () => syncNow(),
  invite: () => inviteSheet(),
  copyInvite: () => navigator.clipboard.writeText($('#inviteLink').value).then(() => toast('Link copied ✓'), () => { $('#inviteLink').select(); toast('Select the link and copy it'); }),
  // the link goes inside the text: some apps (WhatsApp on iPhone) drop a separate url
  shareInvite: () => navigator.share({ text: `Join ${S.company} accounts: ${$('#inviteLink').value}` }).catch(() => {}),
  disconnect: () => disconnect(),
  importOld: () => importSheet(),
  howUpdate: () => howUpdateSheet(),
  updateApp: () => updateApp(),
  assignPick: b => assignSheet(b.dataset.id),
  pickAll: b => { const f = b.closest('form'); $$('.pick:not([hidden]) input', f).forEach(i => (i.checked = true)); updatePick(f); },
  pickNone: b => { const f = b.closest('form'); $$('input[name=pick]', f).forEach(i => (i.checked = false)); updatePick(f); },
  signIn: () => signInSheet(),
  setupLogins: () => setupLoginsSheet(),
  users: () => usersSheet(),
  userForm: b => userForm(b.dataset.id),
  requireLogins: b => requireLogins(!!b.dataset.on),
  account: () => accountSheet(),
  signOut: () => signOut(),
  approvals: () => approvalsSheet(),
  moveApp: () => moveApp(),
  decide: b => decide(b.dataset.id, !!b.dataset.ok),
  askDelete: b => askDelete(b.dataset.kind, b.dataset.id),
  slip: b => slipSheet(b.dataset.kind, b.dataset.id),
  sigClear: b => sigPad($('canvas.sig', b.closest('.fld'))),
  showFile: b => showFile(b.dataset.id),
  shareShown: () => shareShown(),
  letterhead: async () => { if (await unlock('Enter the password to change the letterhead.')) letterheadSheet(); },
  stamp: async () => { if (await unlock('Enter the password to change the company stamp.')) stampSheet(); },
  nudge: b => nudgeStamp(b.dataset.k, b.dataset.d),
  stampSave: () => saveStampPlace(),
  correctPaper: b => correctPaper(b.dataset.kind, b.dataset.id),
  mySig: async () => { if (await unlock('Enter your code to change your signature.')) mySigSheet(); },
  mySigRemove: () => removeMySig(),
  removeFile: b => removeFile(b.dataset.id),
  changeCode: () => changeCode(),
  bioOn: () => bioOn(),
  bioOff: () => bioOff(),
  reveal: async () => { if (await pinPrompt({ why: 'Enter your code to see the balances' })) { showMoney = true; render(); } },
  conceal: () => { showMoney = false; render(); },
  addWorker: () => workerForm(),
  openWorker: b => workerDetail(b.dataset.id),
  editWorker: async b => { if (await unlock('Enter the password to change this employee.')) workerForm(workerOf(b.dataset.id)); },
  markLeft: async b => { if (await unlock('Enter the password to record that this employee has left.')) leftForm(b.dataset.id); },
  payWorker: b => payForm(b.dataset.id, b.dataset.pay, b.dataset.approval),
  settle: b => settleWorker(b.dataset.id),
  addAbsence: b => absenceForm(b.dataset.id),
  openAbsence: b => absenceSheet(b.dataset.id),
  addOffHere: b => addOffHere(b),
  workerStatement: b => workerStatement(b.dataset.id),
  projectStatement: b => projectStatement(b.dataset.id),
  payeeStatement: b => payeeStatement(b.dataset.name),
};
const FORMS = { expense: saveExpense, credit: saveCredit, move: saveMove, assign: saveAssign, bulk: saveBulk, project: saveProject, settings: saveSettings, setup: doSetup, join: doJoin, connect: doConnect, import: doImport,
  signin: doSignIn, setupLogins: doSetupLogins, user: saveUserForm, password: doChangePassword, slip: saveSlip, worker: saveWorker, left: saveLeft, pay: savePay, final: saveFinal, absence: saveAbsence, contacts: saveContacts };

function refreshAmount(input) {
  const n = parseAmount(input.value);
  input.closest('.fld').querySelector('.amt-preview').textContent = n === null ? '' : money(n, formCur(input.form));
  refreshRate(input.form);
}
// "≈ $55.56" under the SSP rate, so a mistyped rate shows at once
function refreshRate(f) {
  const out = f && $('.rate-usd', f);
  if (!out) return;
  const rate = parseAmount(f.elements.rate.value), amt = f.elements.amount ? parseAmount(f.elements.amount.value) : null;
  out.textContent = rate === null ? '' : amt === null ? `1 USD = ${plain(rate)} SSP` : `${money(amt, 'SSP')} is about ${money(Math.round(amt / rate * 100) / 100, 'USD')}`;
}
document.addEventListener('click', e => {
  const k = e.target.closest('[data-pin]');
  if (k) return pinKey(k.dataset.pin);
  const b = e.target.closest('[data-act]');
  if (b && ACTIONS[b.dataset.act]) ACTIONS[b.dataset.act](b);
});
document.addEventListener('submit', e => {
  if (e.target.id === 'lkPwForm') return pinPassword(e);
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form](f);
});
document.addEventListener('input', e => {
  const t = e.target;
  t.classList.remove('bad');
  if (t.closest('.brows')) updateBulk(t.form);
  if (t.closest('.amt-in')) refreshAmount(t);
  if (t.name === 'rate' && t.form) refreshRate(t.form);
  if (t.name === 'zoom' && t.form && t.form._frame) zoomFramer(t.form, +t.value);
  if (t.form && t.form.dataset.form === 'pay') { if (t.name === 'amount') t.form.dataset.typed = '1'; refreshPay(t.form, t); }
  if (t.form && t.form.dataset.form === 'worker') refreshOld(t.form);
  if (t.name === 'rows' && t.form && t.form.dataset.form === 'import') previewImport(t.form);
  if (t.name === 'invite' && t.form) inviteHint(t.form);
  if (t.id === 'q') { histQuery = t.value; $('#histRes').innerHTML = histResults(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'cur' && t.form) {
    $$('.cur-sym', t.form).forEach(s => (s.textContent = SYM[t.value].trim()));
    $$('.amt-in input', t.form).forEach(refreshAmount);
    if ($('.brows', t.form)) updateBulk(t.form);
    $$('.ratef', t.form).forEach(l => { l.hidden = t.value !== 'SSP'; $('input', l).required = !l.hidden; });
    refreshRate(t.form);
  }
  if (t.dataset.attach !== undefined) attachPicked(t);
  if (t.dataset.mysig !== undefined) saveMySig(t);
  if (t.dataset.replace !== undefined) replaceFile(t);
  if (t.name === 'photo' && t.type === 'file' && t.form) startFramer(t);
  if (t.form && t.form.dataset.form === 'pay' && t.name === 'month') refreshPay(t.form, t);
  if (t.form && t.form.dataset.form === 'worker') refreshOld(t.form);
  if (t.name === 'pick' && t.form) updatePick(t.form);
  if (t.name === 'others' && t.form) { $$('.pick[data-other="1"]', t.form).forEach(row => { row.hidden = !t.checked; if (!t.checked) $('input', row).checked = false; }); updatePick(t.form); }
  if (t.name === 'project' && t.form) { const np = $('.newp', t.form); if (np) { np.hidden = t.value !== '__new'; if (!np.hidden) $('input', np).focus(); } }
  if (t.id === 'month') { histMonth = t.value; $('#histRes').innerHTML = histResults(); }
  if (t.id === 'restoreFile') { doRestore(t.files[0]); t.value = ''; }
});
// pasting an invite replaces the box (it may already hold the link) instead of adding to it
document.addEventListener('paste', e => {
  const t = e.target;
  if (t.name !== 'invite' || !e.clipboardData) return;
  e.preventDefault();
  t.value = e.clipboardData.getData('text').trim();
  t.dispatchEvent(new Event('input', { bubbles: true }));
});
// another tab of this app saved something: pick it up so neither tab overwrites the other
addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } if (e.key === SESSION_KEY) { session = loadSession(); render(); } });
// sync as soon as the internet comes back, when the app is reopened, and every few minutes
addEventListener('online', () => scheduleSync(0));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { scheduleSync(0); checkForUpdate(); } });

/* the code pad: typing on a keyboard works too; opening the app can't be skipped */
document.addEventListener('keydown', e => {
  if (!pin || pin.mode === 'pass' || !$('#lock').open) return;
  if (/^\d$/.test(e.key)) { e.preventDefault(); pinKey(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); pinKey('del'); }
});
$('#lock').addEventListener('cancel', e => { if (pin && pin.mandatory) e.preventDefault(); else if (pin) { e.preventDefault(); pinKey('cancel'); } });
$('#lock').addEventListener('close', () => { if (pin && pin.mandatory) $('#lock').showModal(); }); // closed by the browser anyway: open again
// Leaving the app locks it: coming back asks for the code. Not when the app itself sent you away for a moment
// (the camera, choosing a file, the share sheet) — that is consumed by the next return.
// ponytail: a picker that was cancelled without leaving keeps the pass until the next return within 5 minutes
let leftAt = 0, pickerAt = 0;
document.addEventListener('click', e => {
  const t = e.target;
  if ((t.type === 'file') || t.closest('label')?.querySelector('input[type=file]') || t.closest('[data-act=shareShown], [data-act=shareInvite]')) pickerAt = Date.now();
}, true);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { leftAt = Date.now(); return; }
  const mine = pickerAt && Date.now() - pickerAt < 5 * 60e3;
  pickerAt = 0;
  if (leftAt && !mine) lockApp();
});
setInterval(() => { if (!document.hidden) syncNow(); }, SYNC_EVERY_MS);
setInterval(renderLock, 10000);

if (S) { S = migrate(S); save(); repairImportedMoves(); }
loadOutbox().then(() => { if (outbox.length) uploadFiles(); });
if (S && location.hash) history.replaceState(null, '', location.pathname);
if (location.search) history.replaceState(null, '', location.pathname + location.hash); // drop ?v= left by an update
render();
lockApp(); // opening the app asks for the code (a phone signed in before codes existed chooses one now)
checkForUpdate();
if ($('form[data-form=join]')) inviteHint($('form[data-form=join]'));
scheduleSync(0);
// offline support: the service worker keeps a copy of the app on the device
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // a new version was installed in the background: switch to it now, not on the next open
  const hadCopy = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadCopy || reloading) return; // very first install: this page is already the newest
    const go = () => { reloading = true; location.reload(); };
    const busy = [$('#sheet'), $('#pw')].find(d => d.open);
    if (!busy) return go();
    toast('A new version is ready — it opens when you close this window');
    busy.addEventListener('close', go, { once: true });
  });
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline copy not installed:', e.message));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
  });
}
</script>
