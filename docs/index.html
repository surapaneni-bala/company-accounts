<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3EFE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brookfield">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Brookfield</title>
<style>
:root {
  --paper: #F3EFE7; --card: #FFFFFF; --field: #FBFAF7;
  --ink: #1B2232; --muted: #6A6458; --line: #E7E1D4;
  --in: #0E7C57; --in-soft: #E2F3EA;
  --out: #CF4527; --out-soft: #FCE9E3;
  --warn: #8A5A00; --warn-soft: #FFF3D6;
  --r-lg: 28px; --r-md: 20px; --r-sm: 14px;
  --shadow: 0 1px 0 rgba(27,34,50,.04), 0 10px 28px -16px rgba(27,34,50,.28);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; /* the phone's own plain font, not a rounded one */
  --ease: cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; }
html { touch-action: manipulation; } /* no double-tap zoom on phones */
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid #3B5BDB; outline-offset: 2px; }
.app { max-width: 720px; margin: 0 auto; padding: 12px 16px 120px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px 16px; }
.co { font-weight: 800; font-size: 21px; letter-spacing: -.01em; }
.today-date { color: var(--muted); font-size: 14px; }
.top-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.chip { border: 0; cursor: pointer; font-size: 13px; font-weight: 800; color: var(--in); background: var(--in-soft); padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
.chip.wait { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--out); background: var(--out-soft); }
.chip.who { color: var(--ink); background: #E8ECF6; }
.lockpill { border: 0; background: var(--warn-soft); color: var(--warn); font-weight: 800; font-size: 14px; padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }

/* balance */
.balance { position: relative; overflow: hidden; background: var(--ink); color: #fff; border-radius: var(--r-lg); padding: 22px 22px 18px; box-shadow: 0 24px 50px -28px rgba(27,34,50,.8);
  background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.045) 31px 32px); }
.balance::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(46,204,140,.28), transparent 70%); }
.balance.neg::after { background: radial-gradient(circle, rgba(255,110,80,.35), transparent 70%); }
.balance .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; opacity: .7; font-weight: 700; }
.balance .big { font-size: clamp(24px, 7vw, 48px); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: break-word; min-width: 0; }
.bal { display: flex; align-items: center; gap: 12px; margin-top: 8px; position: relative; z-index: 1; }
.cur-tag { font-size: 12px; font-weight: 800; letter-spacing: .08em; background: rgba(255,255,255,.14); padding: 4px 8px; border-radius: 8px; flex: none; }
.bal.neg .big { color: #FFB4A2; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.split div { background: rgba(255,255,255,.08); border-radius: var(--r-sm); padding: 10px 14px; }
.split small { display: block; font-size: 13px; opacity: .72; }
.split b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 480px) { .split { grid-template-columns: 1fr; } .split b { display: inline-block; margin-right: 16px; } }
.split .i b { color: #8BE3BE; } .split .o b { color: #FFB4A2; }

/* big action tiles */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 12px; }
.tile { border: 0; cursor: pointer; text-align: left; border-radius: var(--r-md); padding: 18px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; transition: transform .2s var(--ease), box-shadow .2s var(--ease); box-shadow: var(--shadow); }
.tile:hover { transform: translateY(-2px); }
.tile:active { transform: scale(.97); }
.tile.out { background: var(--out); } .tile.in { background: var(--in); }
.tile .ic { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-size: 30px; font-weight: 800; line-height: 1; }
.tile b { display: block; font-size: 20px; margin-top: 12px; }
.tile small { opacity: .88; font-size: 14px; }
.tile.bulk { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; background: var(--card); color: var(--ink); border: 2px dashed #D6CEBD; box-shadow: none; padding: 14px 18px; }
.tile.bulk .ic { background: var(--out-soft); color: var(--out); font-size: 22px; }
.tile.bulk b { margin: 0; font-size: 18px; }
.tile.bulk small { display: block; color: var(--muted); opacity: 1; }

.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { background: var(--card); border-radius: var(--r-sm); padding: 12px 16px; box-shadow: var(--shadow); }
.mini small { display: block; color: var(--muted); font-size: 13px; font-weight: 700; }
.mini b { display: block; font-size: clamp(15px, 4.4vw, 19px); color: var(--out); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { min-width: 0; overflow-x: auto; }

.sec { font-size: 15px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 26px 4px 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
.sec-head .sec { margin: 0 4px; }

/* lists */
.card { background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow); }
.pad { padding: 20px; }
.list { overflow: hidden; }
.row { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; transition: background .15s; }
.row:first-child { border-top: 0; }
.row:hover { background: #FAF8F3; }
.dot { width: 40px; height: 40px; flex: none; border-radius: 13px; display: grid; place-items: center; font-weight: 800; font-size: 22px; }
.row.out .dot { background: var(--out-soft); color: var(--out); }
.row.in .dot { background: var(--in-soft); color: var(--in); }
.main { flex: 1; min-width: 0; }
.t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-weight: 700; line-height: 1.3; }
/* long reasons and names wrap onto more lines instead of being cut off */
.tt { overflow-wrap: anywhere; }
.s { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; margin-top: 3px; overflow-wrap: anywhere; }
.amt { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 1px; }
.row.out .amt { color: var(--out); } .row.in .amt { color: var(--in); }
.tag { font-style: normal; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: var(--paper); color: var(--muted); flex: none; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--out-soft); color: var(--out); }
.day { display: flex; justify-content: space-between; padding: 18px 6px 8px; color: var(--muted); font-weight: 800; font-size: 14px; }
.empty { text-align: center; padding: 36px 20px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

/* history filters */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: #E8E2D5; border-radius: 16px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { border: 0; background: none; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.filters { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.filters input, .filters select { font: inherit; font-size: 16px; padding: 12px 14px; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--card); min-width: 0; }
.sumline { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 6px 0; font-weight: 700; color: var(--muted); }
.sumline b { font-size: 22px; } .out-c { color: var(--out); } .in-c { color: var(--in); }

/* projects */
.proj { display: block; width: 100%; border: 0; text-align: left; cursor: pointer; padding: 18px; margin-bottom: 12px; transition: transform .2s var(--ease); }
.proj:hover { transform: translateY(-2px); }
.ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; font-size: 19px; margin-bottom: 12px; }
.ph b:first-child { overflow-wrap: anywhere; } /* the name may wrap anywhere; amounts only between parts, never inside a number */
.ph b.out { text-align: right; font-variant-numeric: tabular-nums; }
.chev { color: var(--muted); font-size: 26px; line-height: 1; }
.bar { height: 10px; border-radius: 99px; background: var(--paper); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--in); border-radius: inherit; }
.pv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin: 6px 0 14px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--paper); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.stats small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
.stats b { display: block; font-variant-numeric: tabular-nums; font-size: 15px; overflow-wrap: anywhere; }
.stats .in b { color: var(--in); } .stats .out b { color: var(--out); }
b.in { color: var(--in); } b.out { color: var(--out); }

/* sheet page */
.card h3 { margin: 0 0 6px; }
a.btn { display: block; text-align: center; text-decoration: none; }
.sub { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.fld textarea { width: 100%; min-height: 170px; font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 12px; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--field); color: var(--ink); resize: vertical; }
.fld textarea:focus { outline: none; border-color: var(--ink); background: #fff; }
.note.cols { font-size: 13px; font-weight: 800; word-spacing: 2px; }
.ok-line { color: var(--in); margin: 0 0 6px; }
.err-list { color: var(--out); background: var(--out-soft); border-radius: var(--r-sm); padding: 10px 14px; font-size: 14px; margin: 6px 0; }
.err-list ul { margin: 6px 0 0; padding-left: 18px; }
.invite-hint { min-height: 1.2em; margin: -6px 0 10px; font-weight: 800; font-size: 14px; }
.invite-hint.good { color: var(--in); } .invite-hint.bad { color: var(--out); }
details.manual { margin: 4px 0 12px; } details.manual summary { cursor: pointer; font-weight: 800; color: var(--muted); padding: 6px 0 10px; }
.balrow { position: relative; z-index: 1; padding: 10px 0; }
.balrow + .balrow { border-top: 1px solid rgba(255,255,255,.12); }
.balhead { display: flex; align-items: baseline; gap: 10px; }
.balhead .cur-tag { align-self: center; }
.baltot { font-size: clamp(26px, 7.5vw, 42px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.balhead small { opacity: .65; font-weight: 700; }
.balparts { display: flex; flex-wrap: wrap; gap: 2px 20px; margin-top: 4px; font-size: 15px; }
.balparts span { opacity: .92; white-space: nowrap; }
.balparts b { font-variant-numeric: tabular-nums; }
.baltot.neg, .balparts b.neg { color: #FFB4A2; }
.tile.move .ic { background: #E8ECF6; color: var(--ink); }
.row.move .dot { background: #E8ECF6; color: var(--ink); }
.row.move .amt { color: var(--ink); }
.picklist { display: grid; gap: 6px; margin: 10px 0 14px; }
.pick { display: grid; grid-template-columns: 22px 74px 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 15px; }
.pick:has(input:checked) { border-color: var(--ink); background: #F6F4EF; }
.pick input { width: 20px; height: 20px; margin: 0; }
.pick .pd { color: var(--muted); font-size: 13px; font-weight: 700; }
.pick .pr { min-width: 0; overflow-wrap: anywhere; }
.pick small { display: block; color: var(--muted); font-size: 12px; }
.pick b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.fld.check { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.fld.check input { width: 20px; height: 20px; padding: 0; margin: 0; flex: none; }
.steps { margin: 0 0 16px; padding-left: 22px; display: grid; gap: 8px; }
.muted { color: var(--muted); font-size: 15px; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.stack { display: grid; gap: 14px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 700; padding: 12px 14px; border-radius: var(--r-sm); margin-bottom: 14px; font-size: 15px; }
.banner .btn { background: var(--warn); color: #fff; }
.banner.new { background: #E8ECF6; color: var(--ink); }
.banner.new .btn { background: var(--ink); }

/* buttons */
.btn { border: 0; cursor: pointer; width: 100%; font-weight: 800; font-size: 18px; padding: 16px 20px; border-radius: 16px; transition: transform .15s var(--ease), filter .15s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: #fff; }
.btn.out { background: var(--out); color: #fff; }
.btn.in { background: var(--in); color: #fff; }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.btn.danger { background: var(--out-soft); color: var(--out); }
.btn.small { width: auto; font-size: 15px; padding: 10px 14px; border-radius: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { border: 0; background: none; color: var(--ink); text-decoration: underline; cursor: pointer; font-weight: 700; padding: 8px; }

/* bottom tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.93); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 5; }
nav.tabs .wrap { max-width: 720px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
nav.tabs button { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 14px; color: var(--muted); font-size: 13px; font-weight: 800; }
nav.tabs button.on { color: var(--ink); background: var(--paper); }
nav.tabs svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* sheets (dialogs) */
dialog.sheet { border: 0; padding: 0; width: min(640px, calc(100% - 32px)); max-height: 92vh; overflow: auto; border-radius: 26px; background: var(--card); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(27,34,50,.5); backdrop-filter: blur(3px); }
.sin { padding: 20px 20px 24px; }
.sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.sh-head h2 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; }
.sh-head h2::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--tone, var(--ink)); flex: none; }
.sh-head small { color: var(--muted); font-weight: 700; }
.close { border: 0; background: var(--paper); width: 42px; height: 42px; border-radius: 50%; font-size: 26px; line-height: 1; cursor: pointer; flex: none; }
.tone-out { --tone: var(--out); } .tone-in { --tone: var(--in); }
@media (max-width: 640px) {
  dialog.sheet:not(.pwbox) { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 26px 26px 0 0; max-height: 94vh; }
}
@media (prefers-reduced-motion: no-preference) {
  dialog[open] { animation: up .35s var(--ease); }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
}

/* form fields */
.fld { display: block; margin: 0 0 14px; border: 0; padding: 0; }
.fld > span { display: block; font-weight: 800; font-size: 15px; margin: 0 0 6px; }
.fld em { font-style: normal; color: var(--muted); font-weight: 600; }
.fld input, .fld select, #pwIn { width: 100%; font: inherit; font-size: 18px; padding: 14px 16px; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--field); color: var(--ink); }
.fld input:focus, .fld select:focus, #pwIn:focus, .brow input:focus { outline: none; border-color: var(--ink); background: #fff; }
.amt-in { display: flex; align-items: center; gap: 6px; border: 2px solid var(--line); border-radius: 18px; padding: 4px 16px; background: var(--field); }
.amt-in:focus-within { border-color: var(--ink); background: #fff; }
.amt-in b { font-size: 30px; color: var(--muted); }
.fld .amt-in input { border: 0; background: transparent; font-size: 38px; font-weight: 800; padding: 8px 0; font-variant-numeric: tabular-nums; }
.amt-preview { display: block; color: var(--muted); font-weight: 700; font-size: 14px; min-height: 1.3em; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--line); font-weight: 800; font-size: 16px; }
.chips input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
.chips input:focus-visible + span { outline: 3px solid #3B5BDB; outline-offset: 2px; }
.curseg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.curseg label { position: relative; }
.curseg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.curseg span { display: block; border: 2px solid var(--line); border-radius: var(--r-sm); padding: 10px 14px; }
.curseg b { display: block; font-size: 20px; }
.curseg small { color: var(--muted); font-weight: 700; font-size: 13px; }
.curseg input:checked + span { background: var(--ink); border-color: var(--ink); color: #fff; }
.curseg input:checked + span small { color: rgba(255,255,255,.75); }
.curseg input:focus-visible + span { outline: 3px solid #3B5BDB; outline-offset: 2px; }
.curseg.roles { grid-template-columns: 1fr; }
.curseg.roles b { font-size: 18px; }
.when { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--paper); border-radius: var(--r-sm); padding: 12px 14px; }
.when small { display: block; color: var(--muted); font-size: 13px; font-weight: 700; }
.err { color: var(--out); font-weight: 800; min-height: 1.2em; margin: 4px 0 10px; }
.bad { border-color: var(--out) !important; background: var(--out-soft) !important; }
.hint { color: var(--muted); margin: -8px 0 14px; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: var(--r-sm); padding: 12px 14px; font-size: 15px; }

/* bulk */
.brows { counter-reset: r; display: grid; gap: 8px; margin-bottom: 10px; }
.brow { display: grid; grid-template-columns: 26px 130px 1fr 1fr 40px; gap: 8px; align-items: center; }
.brow .n::before { counter-increment: r; content: counter(r); font-weight: 800; color: var(--muted); }
.brow input { width: 100%; min-width: 0; font: inherit; font-size: 16px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--field); }
.brow input[name=amount] { font-weight: 800; }
.brow .x { border: 0; background: var(--paper); border-radius: 10px; height: 44px; font-size: 22px; cursor: pointer; color: var(--muted); }
.shared { background: var(--paper); border-radius: var(--r-md); padding: 16px 16px 4px; margin: 16px 0 0; }
.shared h3 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.shared .fld input, .shared .fld select { background: #fff; }
.shared .when { background: #fff; }
.foot { position: sticky; bottom: 0; background: var(--card); padding: 12px 0 4px; margin-top: 8px; border-top: 1px solid var(--line); }
.btotal { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; margin-bottom: 4px; }
.btotal b { font-size: 26px; color: var(--out); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .brow { grid-template-columns: 22px 1fr 44px; grid-template-areas: "n a x" "n p p" "n r r"; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .brow .n { grid-area: n; align-self: start; padding-top: 12px; }
  .brow [name=amount] { grid-area: a; } .brow [name=paidTo] { grid-area: p; } .brow [name=reason] { grid-area: r; } .brow .x { grid-area: x; }
}

<script>
'use strict';
const APP_VERSION = '109de932dd'; // filled in by tools/build.js
const KEY = 'company-accounts-v1';
const UNLOCK_MS = 5 * 60 * 1000;
const BACKUP_NAG_DAYS = 7;
// Money is in one of two places: cash in hand or the bank.
const ACCOUNTS = ['Cash', 'Bank'];
const ACCOUNT_ICON = { Cash: '💵', Bank: '🏦' };
// entries saved by older versions may say Card, Cheque or Mobile money
const accountOf = mode => (/^(bank|card|cheque|check)/i.test(String(mode || '')) ? 'Bank' : 'Cash');
const COLL = { E: 'expenses', R: 'credits', T: 'transfers' };
// Two separate money accounts. They are never added together: the rate moves too much.
const CURS = ['USD', 'SSP'];
const CUR_NAME = { USD: 'US Dollar', SSP: 'S. Sudan Pound' };
const SYM = { USD: '$', SSP: 'SSP ' };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const AT_RE = /^\d{4}-\d\d-\d\dT\d\d:\d\d$/;

let S = load();
// 'menu' = the first page after signing in (Accounts, Employees); the bottom bar belongs to Accounts
let tab = 'menu', histKind = 'E', histQuery = '', histMonth = '';
const ACC_TABS = ['home', 'hist', 'proj', 'sheet'];
const WELCOME = 'Welcome';
let unlockedUntil = 0;

/* ---------- storage ---------- */
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert('⚠️ Could not save!\nYour browser storage may be full or blocked.\nOpen the Sheet tab and save a backup now.\n\n' + e.message); }
}
// Every change goes through here. Changed records get a fresh time stamp (u); when this device
// is connected to the Google Sheet they are also queued (dirty) for the next sync.
const SYNC_KEYS = { expenses: 'E', credits: 'R', projects: 'P', log: 'L', transfers: 'T', changes: 'C', workers: 'W', absences: 'A', files: 'F' };
const recId = (key, r) => key === 'log' ? r.lid : r.id;
// A new record made by a signed-in person also carries their login (uid); edits keep the original one.
function update(patch) {
  const now = Date.now(), dirty = new Set(S.dirty || []), stamped = {};
  const uid = signedIn() ? { uid: session.user.id } : {};
  for (const key of Object.keys(SYNC_KEYS)) {
    if (!patch[key]) continue;
    const before = new Set(S[key]), known = new Set(S[key].map(r => recId(key, r)));
    stamped[key] = patch[key].map(r => {
      if (before.has(r)) return r;
      dirty.add(recId(key, r));
      return { ...r, ...(known.has(recId(key, r)) ? {} : uid), u: now };
    });
  }
  if ('company' in patch || 'pass' in patch) { dirty.add('settings'); stamped.settingsU = now; }
  const was = S;
  S = { ...S, ...patch, ...stamped, dirty: S.link ? [...dirty] : [] };
  save(); scheduleSync();
  if (patch.expenses || patch.credits) cancelSigned(was); // an entry changed after its voucher was signed (files.js)
}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const stamp = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
// seconds keep same-minute entries in the order they were made
const stampSec = (d = new Date()) => `${stamp(d)}:${pad(d.getSeconds())}`;
const clean = v => String(v ?? '').trim().replace(/\s+/g, ' ');
const live = a => a.filter(x => !x.deleted);
// money is summed in whole cents so 0.1 + 0.2 never drifts
const cents = n => Math.round(Number(n || 0) * 100);
const total = a => a.reduce((t, x) => t + cents(x.amount), 0) / 100;
const minus = (a, b) => (cents(a) - cents(b)) / 100;
const byCur = items => Object.fromEntries(CURS.map(c => [c, total(items.filter(x => x.cur === c))]));
const byAt = (a, b) => a.at.localeCompare(b.at) || (a.createdAt || '').localeCompare(b.createdAt || '') || a.id.localeCompare(b.id);
const projName = id => id ? (S.projects.find(p => p.id === id)?.name || 'Unknown project') : 'General (no project)';
const fileSafe = s => s.replace(/[\\/:*?"<>|]+/g, '').trim() || 'Company';
const randHex = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
const defCur = () => S.lastCur || 'USD';

function money(n, cur) {
  const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return (n < 0 ? '−' : '') + SYM[cur] + s;
}
// "$1,200 · SSP 50,000" — only the currencies that have money in them
function sumText(items) {
  const parts = Object.entries(byCur(items)).filter(([, v]) => v).map(([c, v]) => money(v, c));
  return parts.length ? parts.join(' · ') : money(0, defCur());
}
function parseAmount(v) {
  const n = Number(String(v ?? '').replace(/[,\s$]/g, '').replace(/^SSP/i, ''));
  return Number.isFinite(n) && n > 0 && n < 1e12 ? Math.round(n * 100) / 100 : null;
}
function fmtTime(at) { const [h, m] = at.slice(11, 16).split(':').map(Number); return `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; }
function fmtDate(date) { const [y, m, d] = date.split('-').map(Number); return `${d} ${MON[m - 1]} ${y}`; }
function fmtDay(date) {
  if (date === stamp().slice(0, 10)) return 'Today';
  if (date === stamp(new Date(Date.now() - 864e5)).slice(0, 10)) return 'Yesterday';
  const [y, m, d] = date.split('-').map(Number);
  return `${DAYS[new Date(y, m - 1, d).getDay()]}, ${fmtDate(date)}`;
}
const fmtWhen = at => `${fmtDay(at.slice(0, 10))}, ${fmtTime(at)}`;
const fmtAbs = at => `${fmtDate(at.slice(0, 10))}, ${fmtTime(at)}`;
const monthName = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;

function nextIds(prefix, n, seq) {
  const start = seq[prefix] || 0;
  // the device code keeps ids unique when several phones add entries offline
  const list = Array.from({ length: n }, (_, i) => `${prefix}-${S.dev}-${String(start + i + 1).padStart(4, '0')}`);
  return [list, { ...seq, [prefix]: start + n }];
}
const logWith = (entries, by = S.lastBy || '') => [...S.log, ...entries.map(([action, id, text], i) => ({ lid: `L-${S.dev}-${Date.now().toString(36)}${i}`, at: stampSec(), action, id, text, by }))];

const LABELS = { cur: 'Money type', amount: 'Amount', paidTo: 'Paid to', reason: 'Reason', location: 'Location', project: 'Project', mode: 'Cash or bank', note: 'Note', at: 'Date', from: 'Moved', rate: 'SSP for 1 USD',
  to: 'Moved to', manualDate: 'Date set by hand', name: 'Name', phone: 'Phone', job: 'Job', site: 'Site', wage: 'Monthly wage', start: 'Started', idNo: 'ID number', status: 'Status', left: 'Left on', openingAmount: 'Before the app', openingNote: 'Note', clearedTo: 'Salary cleared up to' };
function showVal(k, r) {
  const v = r[k];
  if (['amount', 'wage', 'openingAmount'].includes(k)) return v === undefined || v === '' ? '(empty)' : money(+v, r.cur);
  if (['start', 'left', 'clearedTo'].includes(k)) return v ? fmtDate(v) : '(empty)';
  return k === 'project' ? projName(v) : k === 'at' ? fmtAbs(v) : k === 'mode' ? accountOf(v) : k === 'from' ? `${v} → ${v === 'Cash' ? 'Bank' : 'Cash'}` : k === 'rate' ? (v ? plain(+v) : '(empty)') : k === 'status' ? (v === 'left' ? 'Left' : 'Working') : k === 'manualDate' ? (v ? 'yes' : 'no') : (v || '(empty)');
}
function diff(a, b) { return Object.keys(LABELS).filter(k => k in b && String(a[k] ?? '') !== String(b[k] ?? '')).map(k => `${LABELS[k]}: ${showVal(k, a)} → ${showVal(k, b)}`); }
function describe(k, r) {
  if (k === 'T') return `${money(r.amount, r.cur)} moved from ${r.from} to ${r.to}${r.note ? ' · ' + r.note : ''} · dated ${fmtAbs(r.at)}`;
  return k === 'E'
    ? `${money(r.amount, r.cur)} paid to ${r.paidTo} for ${r.reason}${r.location ? ' at ' + r.location : ''} · from ${accountOf(r.mode)} · ${projName(r.project)} · dated ${fmtAbs(r.at)}`
    : `${money(r.amount, r.cur)} received for ${projName(r.project)} · into ${accountOf(r.mode)}${r.note ? ' · ' + r.note : ''} · dated ${fmtAbs(r.at)}`;
}
function projStats(id) {
  const p = S.projects.find(x => x.id === id) || {};
  const recv = byCur(live(S.credits).filter(c => c.project === id));
  const spent = byCur(live(S.expenses).filter(e => e.project === id));
  const bal = Object.fromEntries(CURS.map(c => [c, minus(recv[c], spent[c])]));
  const value = p.value || 0, vc = p.valueCur || 'USD';
  const curs = CURS.filter(c => recv[c] || spent[c] || (value && c === vc));
  return { recv, spent, bal, value, vc, curs: curs.length ? curs : [vc], pending: value ? Math.max(0, minus(value, recv[vc])) : 0, pct: value ? Math.min(100, recv[vc] / value * 100) : 0 };
}

/* ---------- password ---------- */
async function hashPw(pw, salt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + '|' + pw));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const isUnlocked = () => Date.now() < unlockedUntil;
// fresh = ask for the password itself even if unlocked a moment ago (e.g. before choosing a new code).
// Signed in with a code: the code pad (or Face ID); otherwise your password, or the company password before logins.
function unlock(why, fresh) {
  if (isUnlocked() && !fresh) return Promise.resolve(true);
  const opened = () => { unlockedUntil = Date.now() + UNLOCK_MS; renderLock(); return true; };
  if (!fresh && quick()) return pinPrompt({ why: why.replace('Enter the password', 'Enter your code') }).then(ok => ok && opened());
  return new Promise(resolve => {
    const d = $('#pw'), pass = signedIn() ? session.check : S.pass;
    $('#pwWhy').textContent = signedIn() ? why.replace('the password', 'your password') : why;
    $('#pwIn').value = ''; $('#pwErr').textContent = ''; $('#pwIn').placeholder = signedIn() ? 'Your password' : 'Password';
    d.returnValue = '';
    d.showModal(); $('#pwIn').focus();
    $('#pwCancel').onclick = () => d.close();
    $('#pwForm').onsubmit = async e => {
      e.preventDefault();
      if (pass && await (signedIn() ? slowHash : hashPw)($('#pwIn').value, pass.salt) === pass.hash) { d.close('ok'); resolve(opened()); }
      else {
        $('#pwErr').textContent = 'Wrong password. Try again.';
        $('#pwIn').select(); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
      }
    };
    d.onclose = () => { if (d.returnValue !== 'ok') resolve(false); };
  });
}

// Cash and bank balance for each currency. A move between them changes both, never the total.
function balances() {
  const b = Object.fromEntries(CURS.map(c => [c, { Cash: 0, Bank: 0 }]));
  live(S.credits).forEach(x => { b[x.cur][accountOf(x.mode)] += cents(x.amount); });
  live(S.expenses).forEach(x => { b[x.cur][accountOf(x.mode)] -= cents(x.amount); });
  live(S.transfers).forEach(x => { b[x.cur][x.from] -= cents(x.amount); b[x.cur][x.to] += cents(x.amount); });
  return Object.fromEntries(CURS.map(c => [c, { Cash: b[c].Cash / 100, Bank: b[c].Bank / 100, Total: (b[c].Cash + b[c].Bank) / 100 }]));
}

function backupBanner() {
  if (S.link || (!S.expenses.length && !S.credits.length)) return '';

  if (days !== null && days < BACKUP_NAG_DAYS) return '';
  return `<div class="banner"><span>💾 ${days === null ? 'No backup saved yet.' : `Last backup was ${days} days ago.`}</span><button class="btn small" data-act="backup">Save backup</button></div>`;
}

  const isE = k === 'E';

function histResults() {

  return `<div class="sumline"><span>${items.length} ${items.length === 1 ? 'entry' : 'entries'}</span><b class="${{ E: 'out-c', R: 'in-c', T: '' }[histKind]}">${sumText(items)}</b></div>` +
    [...groups].map(([d, xs]) => `<div class="day"><span>${fmtDay(d)}</span><span>${sumText(xs)}</span></div><div class="card list">${xs.map(x => itemRow(x, histKind, false)).join('')}</div>`).join('');

  const facts = {

    R: () => [['Money type', CUR_NAME[r.cur]], ...rateFact(r), ['Project', projName(r.project)], ['Received into', `${ACCOUNT_ICON[accountOf(r.mode)]} ${accountOf(r.mode)}`], ['Note', r.note], ...common],

  here = () => detail(k, id);
}

/* ---------- saving ---------- */
function dateFrom(v, old) {
  const at = v.at && AT_RE.test(v.at) ? v.at : (old ? old.at : stamp());
  const manualDate = old ? (old.manualDate || at !== old.at) : !!v.at && at.slice(0, 10) !== stamp().slice(0, 10);
  return { at, manualDate };
}
function saveExpense(f) {
  const v = Object.fromEntries(new FormData(f));
  const old = S.expenses.find(x => x.id === f.dataset.id);
  const amount = parseAmount(v.amount);
  if (amount === null) return formErr(f, 'amount', 'Type a correct amount, like 500');
  const cur = formCur(f), rate = rateFrom(f, cur);
  if (rate === null) return formErr(f, 'rate', RATE_ERR);
  const rec = { cur, amount, rate, paidTo: clean(v.paidTo), reason: clean(v.reason), location: clean(v.location), project: v.project || '', mode: v.mode || 'Cash', ...dateFrom(v, old) };
  if (!rec.paidTo) return formErr(f, 'paidTo', 'Who did you pay?');
  if (!rec.reason) return formErr(f, 'reason', 'What was it for?');
  const by = clean(v.by);
  if (!by) return formErr(f, 'by', 'Type your name');
  if (old) {
    const changes = diff(old, rec);
    if (!changes.length) { closeSheet(); return toast('Nothing changed'); }
    if (!can('edit')) return requestChange('E', old, rec, changes, by);
    update({ expenses: S.expenses.map(x => x.id === old.id ? { ...x, ...rec, editedAt: stampSec(), editedBy: by } : x), log: logWith([['Edited', old.id, changes.join(' ; ')]], by), lastBy: by });
    toast('Changes saved ✓');
    if (needsNewPaper(old.id)) { render(); return slipSheet('E', old.id); } // its signed paper was cancelled: make the new one now
  } else {
    const [[id], seq] = nextIds('E', 1, S.seq);
    update({
      expenses: [...S.expenses, { id, ...rec, by, createdAt: stampSec(), batch: null }], seq,
      log: rec.manualDate ? logWith([['Old date', id, `Added with date ${fmtAbs(rec.at)} (password used) — ${describe('E', rec)}`]], by) : S.log,
      lastLoc: rec.location, lastMode: rec.mode, lastExpProject: rec.project, lastBy: by, lastCur: rec.cur, ...(rate ? { lastRate: rate } : {}),
    });
    toast(`Saved ✓ ${money(amount, rec.cur)} to ${rec.paidTo}`);
    if (v.sign) { render(); return slipSheet('E', id); }
  }
  closeSheet(); render();
}
function saveMove(f) {
  const v = Object.fromEntries(new FormData(f));
  const old = S.transfers.find(x => x.id === f.dataset.id);
  const amount = parseAmount(v.amount);
  if (amount === null) return formErr(f, 'amount', 'Type a correct amount, like 5000');
  const by = clean(v.by);
  if (!by) return formErr(f, 'by', 'Type your name');
  const from = v.from === 'Bank' ? 'Bank' : 'Cash';
  const rec = { cur: formCur(f), amount, from, to: from === 'Cash' ? 'Bank' : 'Cash', note: clean(v.note), ...dateFrom(v, old) };
  if (old) {
    const changes = diff(old, rec);
    if (!changes.length) { closeSheet(); return toast('Nothing changed'); }
    if (!can('edit')) return requestChange('T', old, rec, changes, by);
    update({ transfers: S.transfers.map(x => x.id === old.id ? { ...x, ...rec, editedAt: stampSec(), editedBy: by } : x), log: logWith([['Edited', old.id, changes.join(' ; ')]], by), lastBy: by });
    toast('Changes saved ✓');
  } else {
    const [[id], seq] = nextIds('T', 1, S.seq);
    update({
      transfers: [...S.transfers, { id, ...rec, by, createdAt: stampSec() }], seq, lastBy: by, lastCur: rec.cur,
      log: rec.manualDate ? logWith([['Old date', id, `Added with date ${fmtAbs(rec.at)} (password used) — ${describe('T', rec)}`]], by) : S.log,
    });
    toast(`Saved ✓ ${money(amount, rec.cur)} moved ${from} → ${rec.to}`);
  }
  closeSheet(); render();
}

function projectFromForm(v) {
  if (v.project !== '__new') return [v.project, S.projects, S.seq];
  const name = clean(v.newProject);
  if (!name) return [null];
  const same = S.projects.find(p => !p.deleted && p.name.toLowerCase() === name.toLowerCase());
  if (same) return [same.id, S.projects, S.seq];
  const [[id], seq] = nextIds('P', 1, S.seq);
  return [id, [...S.projects, { id, name, value: 0, valueCur: v.cur || 'USD', by: clean(v.by), createdAt: stampSec() }], seq];
}
function saveCredit(f) {
  const v = Object.fromEntries(new FormData(f));
  const old = S.credits.find(x => x.id === f.dataset.id);
  const amount = parseAmount(v.amount);
  if (amount === null) return formErr(f, 'amount', 'Type a correct amount, like 50000');
  const by = clean(v.by);
  const [project, projects, seq0] = projectFromForm(v);
  if (!project) return formErr(f, 'newProject', 'Type the new project name');
  if (!by) return formErr(f, 'by', 'Type your name');
  const cur = formCur(f), rate = rateFrom(f, cur);
  if (rate === null) return formErr(f, 'rate', RATE_ERR);
  const rec = { cur, amount, rate, project, mode: v.mode || 'Bank', note: clean(v.note), ...dateFrom(v, old) };
  if (projects !== S.projects) update({ projects, seq: seq0 }); // a new project must exist before describe()/log
  if (old) {

// Phones get the share sheet (Save to Files, WhatsApp, email…); computers get a normal download.
async function download(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (isPhone() && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------- pay maths, amounts in words, one-page PDF ---------- */
// No screen code here: tools/test-calc.js checks all of it in Node.

// Days paid in a month, on a 30-day month (the owner's rule): joining and leaving days both count, and the
// 31st counts as the 30th. start/end are 'YYYY-MM-DD'; end is the leaving day, or today.
function payDays(month, start, end) {
  if (start.slice(0, 7) > month || end.slice(0, 7) < month) return 0;
  const first = start.slice(0, 7) === month ? Math.min(+start.slice(8, 10), 30) : 1;
  const last = end.slice(0, 7) === month ? Math.min(+end.slice(8, 10), 30) : 30;
  return Math.max(0, last - first + 1);
}
const nextMonth = m => { const y = +m.slice(0, 4), mo = +m.slice(5, 7); return mo === 12 ? `${y + 1}-01` : `${y}-${String(mo + 1).padStart(2, '0')}`; };

// A payment in the wage's currency, in cents; null when it can't be converted (another currency, no rate).
// rate = SSP for 1 USD, saved on every SSP entry.
function inWage(p, cur) {
  if (p.cur === cur) return Math.round(p.amount * 100);
  if (!(p.rate > 0)) return null;
  return Math.round((cur === 'USD' ? p.amount / p.rate : p.amount * p.rate) * 100);
}

const dayAfter = d => { const [y, m, dd] = d.split('-').map(Number), t = new Date(Date.UTC(y, m - 1, dd + 1)); return t.toISOString().slice(0, 10); };

// An employee's account: wage earned month by month (less days not worked: the dated ones recorded for them, plus
// the number older salary payments carried),
// minus everything paid to them (salary, advances, final settlement), plus the balance from before the app
// (openingAmount: owed to them, or negative = already paid). clearedTo = salary already settled up to that day.
function workerLedger(w, pays, today, absences = []) {
  const end = w.status === 'left' && w.left && w.left < today ? w.left : today;
  const from = w.clearedTo && w.clearedTo >= w.start ? dayAfter(w.clearedTo) : w.start;
  const mine = pays.filter(p => p.worker === w.id && !p.deleted);
  const off = {};
  mine.forEach(p => { if (p.pay === 'salary' && p.month && p.daysOff) off[p.month] = (off[p.month] || 0) + p.daysOff; });
  absences.forEach(a => { if (a.worker === w.id && !a.deleted && a.date >= from && a.date <= end) off[a.date.slice(0, 7)] = (off[a.date.slice(0, 7)] || 0) + 1; });
  const months = [];
  let earned = 0;
  if (from <= end) {
    for (let m = from.slice(0, 7); m <= end.slice(0, 7); m = nextMonth(m)) {
      const days = payDays(m, from, end), daysOff = Math.min(off[m] || 0, days);
      const cents = Math.round(w.wage * 100 * (days - daysOff) / 30);
      months.push({ month: m, days, daysOff, earned: cents / 100 });
      earned += cents;
    }
  }
  let paid = 0;
  const unconverted = [];
  mine.forEach(p => { const c = inWage(p, w.cur); if (c === null) unconverted.push(p.id); else paid += c; });
  const opening = Math.round((w.openingAmount || 0) * 100);
  return { cur: w.cur, months, earned: earned / 100, paid: paid / 100, opening: opening / 100, balance: (opening + earned - paid) / 100, unconverted };
}

// Advances given in a month, in US dollars (the monthly limit is in dollars).
function advancesUsd(pays, month) {
  const cents = pays.filter(p => p.pay === 'advance' && !p.deleted && p.at.slice(0, 7) === month)
    .reduce((t, p) => t + (p.cur === 'USD' ? Math.round(p.amount * 100) : p.rate > 0 ? Math.round(p.amount / p.rate * 100) : 0), 0);
  return cents / 100;
}

// "Two hundred fifty US dollars only" — printed on every slip so a figure can't be quietly changed.
const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
const BIG = [[1e12, 'trillion'], [1e9, 'billion'], [1e6, 'million'], [1e3, 'thousand']];
const UNITS = { USD: ['US dollar', 'US dollars', 'cent', 'cents'], SSP: ['South Sudanese pound', 'South Sudanese pounds', 'piaster', 'piasters'] };
function words(n) {
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
  if (n < 1000) return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + words(n % 100) : '');
  const [size, name] = BIG.find(([s]) => n >= s);
  return words(Math.floor(n / size)) + ' ' + name + (n % size ? ' ' + words(n % size) : '');
}
function amountInWords(amount, cur) {
  const c = Math.round(amount * 100), whole = Math.floor(c / 100), part = c % 100;
  const [one, many, sub, subs] = UNITS[cur];
  const s = `${words(whole)} ${whole === 1 ? one : many}${part ? ` and ${words(part)} ${part === 1 ? sub : subs}` : ''} only`;
  return s[0].toUpperCase() + s.slice(1);
}

// An A4 PDF with one JPEG per page (slips and statements are drawn as pictures): no PDF library needed.
// pages = [{ data: JPEG bytes, w, h }]; each page is objects 3+3i (page), 4+3i (drawing), 5+3i (picture).
function pdfPages(pages) {
  const enc = new TextEncoder(), parts = [], offsets = [];
  let size = 0;
  const add = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); size += b.length; };
  const obj = (n, body) => { offsets[n] = size; add(`${n} 0 obj\n${body}\nendobj\n`); };
  const W = 595.28; // A4 width in points; each page is as tall as its picture (an A4 page, or a slip as tall as it needs)
  add('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Kids [${pages.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] /Count ${pages.length} >>`);
  pages.forEach((p, i) => {
    const n = 3 + 3 * i, H = Math.round(W * p.h / p.w * 100) / 100, draw = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(n, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${n + 2} 0 R >> >> /Contents ${n + 1} 0 R >>`);
    obj(n + 1, `<< /Length ${draw.length} >>\nstream\n${draw}\nendstream`);
    offsets[n + 2] = size;
    add(`${n + 2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.data.length} >>\nstream\n`);
    add(p.data);
    add('\nendstream\nendobj\n');
  });
  const count = 3 + 3 * pages.length, xref = size;
  add(`xref\n0 ${count}\n0000000000 65535 f \n${offsets.slice(1).map(o => `${String(o).padStart(10, '0')} 00000 n \n`).join('')}trailer\n<< /Size ${count} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out = new Uint8Array(size);
  let at = 0;
  parts.forEach(b => { out.set(b, at); at += b.length; });
  return out;
}
const jpegToPdf = (jpeg, w, h) => pdfPages([{ data: jpeg, w, h }]);

/* ---------- files: photos, PDFs, signatures and slips ---------- */
// A file is kept on this phone first (IndexedDB: localStorage is far too small), then uploaded to the company
// Google Drive through the sheet script. Its record (kind F) is made only once the upload worked, so the sheet
// never holds a record whose file it can't give back. Uploaded files stay on the phone as an offline copy.
const FILE_MIMES = ['image/jpeg', 'image/png', 'application/pdf'];
const MAX_FILE = 8 * 1024 * 1024; // the sheet script refuses bigger files
const PHOTO_SIDE = 1600; // photos are shrunk on the phone: quicker to upload, still sharp on a slip
const PDF_Q = 0.8; // slips and statements: side by side at 2× it looks the same as 0.9, and is a quarter smaller (quicker to upload)
const TAKEN_PHOTO = [1280, 0.8]; // the payment photo as taken: a person and money, not small print — a third smaller than other photos
const FILE_ICON = { voucher: '🧾', receipt: '🧾', slip: '🧾', photo: '📷', attachment: '📎', profile: '🙂', idphoto: '🪪', letterhead: '📄', stamp: '🔵', statement: '📑' };
const FILE_NAME = { voucher: 'Payment voucher', receipt: 'Receipt', slip: 'Salary slip', photo: 'Photo', attachment: 'Attachment', profile: 'Profile photo', idphoto: 'ID photo', letterhead: 'Letterhead', stamp: 'Company stamp', statement: 'Statement' };
let outbox = [];          // files waiting to upload (their details; the bytes stay in IndexedDB)
let uploading = false, uploadErr = '';
let shown = null;         // the file on screen, kept in memory so "Send" opens the share sheet straight from the tap

/* IndexedDB: one store per app copy (the test copy has its own KEY) */
function idb(mode, fn) {
  return new Promise((ok, no) => {
    const open = indexedDB.open(KEY + '-files', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('files', { keyPath: 'id' });
    open.onerror = () => no(open.error);
    open.onsuccess = () => {
      const db = open.result, tx = db.transaction('files', mode), req = fn(tx.objectStore('files'));
      tx.oncomplete = () => { db.close(); ok(req.result); };
      tx.onerror = tx.onabort = () => { db.close(); no(tx.error || new Error('Could not keep the file on this phone')); };
    };
  });
}
const fileGet = id => idb('readonly', s => s.get(id));
const filePut = rec => idb('readwrite', s => s.put(rec));
const fileDel = id => idb('readwrite', s => s.delete(id));
const fileAll = () => idb('readonly', s => s.getAll());
async function loadOutbox() {
  try { outbox = (await fileAll()).filter(f => f.pending).map(({ data, ...meta }) => meta); }
  catch { outbox = []; } // storage blocked (private browsing): nothing can be waiting
}
// a phone that lost access keeps only what it hasn't uploaded yet
async function dropFileCopies() {
  try { await idb('readwrite', s => { const req = s.openCursor(); req.onsuccess = () => { const c = req.result; if (!c) return; if (!c.value.pending) c.delete(); c.continue(); }; return req; }); }
  catch { /* nothing kept */ }
}

const toB64 = buf => { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const imgFrom = blob => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('This picture could not be read.')); i.src = URL.createObjectURL(blob); });
const canvasJpeg = (c, q) => new Promise(ok => c.toBlob(ok, 'image/jpeg', q));

// A picked or photographed file → { data, mime, name }: photos become a smaller JPEG, PDFs pass as they are.
async function prepareFile(file, side = PHOTO_SIDE, quality = 0.82, png = false) {
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (isPdf) {
    if (file.size > MAX_FILE) throw new Error('This PDF is bigger than 8 MB.');
    return { data: await file.arrayBuffer(), mime: 'application/pdf', name: file.name };
  }
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|heic|webp)$/i.test(file.name)) throw new Error('Only photos and PDF files can be added.');
  const img = await imgFrom(file);
  const k = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d');
  if (png) { g.drawImage(img, 0, 0, c.width, c.height); const b = await new Promise(ok => c.toBlob(ok, 'image/png')); return { data: await b.arrayBuffer(), mime: 'image/png', name: (file.name || 'stamp').replace(/\.\w+$/, '') + '.png' }; }
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); // a see-through part turns white, not black
  g.drawImage(img, 0, 0, c.width, c.height);
  const blob = await canvasJpeg(c, quality);
  return { data: await blob.arrayBuffer(), mime: 'image/jpeg', name: (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg' };
}

// Keep a file for a record ('for' = its id, or 'settings' for the letterhead). Returns the file's id.
async function keepFile(meta, data) {
  const [[id], seq] = nextIds('F', 1, S.seq);
  const rec = { id, ...meta, by: myName() || S.lastBy || '', createdAt: stampSec() };
  await filePut({ ...rec, data, pending: true });
  update({ seq });
  outbox = [...outbox, rec];
  uploadFiles();
  return id;
}

// Why files are still only on this phone, in plain words (shown wherever a waiting file is).
function uploadWhy() {

    const text = slipMoney(s.amount, s.cur);

/* ---------- statements: every entry for one person or project, on as many pages as it takes ---------- */
/* st = { title, no, date, info: [[label, value]], sections: [{ title, cols: [{ h, w, right }], rows: [[cell]], total: [label, value] }],
          summary: [[label, value, strong]], verdict: { text, good } | null, sign: { label, name, sig, photo } | null, preparedBy, ref } */
const fitText = (g, t, w) => { t = String(t ?? ''); if (g.measureText(t).width <= w) return t; while (t && g.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; };
async function renderStatement(st) {
  const [lh, stampImg, logo, wm] = await Promise.all([letterheadImage(), st.sign ? brandImage('stamp') : null, wideLogo(), watermark()]);
  const C = SLIP_C, L = 90, R = SLIP_W - 90, W = R - L, top = lh ? 268 : 200, limit = SLIP_H - 80, pages = [];
  let g, y;
  const page = () => {
    const c = document.createElement('canvas');
    c.width = SLIP_W; c.height = SLIP_H; pages.push(c);
    g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, SLIP_W, SLIP_H);
    drawLetterhead(g, lh, wm, SLIP_H);
    if (!lh) logoOrName(g, logo);
    y = top;
    if (pages.length > 1) { g.fillStyle = C.navy; g.font = `700 28px ${SANS}`; spaced(g, `${st.title} — CONTINUED`, L, y + 30, 2); g.fillStyle = C.label; g.font = `600 22px ${SANS}`; g.textAlign = 'right'; g.fillText(st.no, R, y + 30); g.textAlign = 'left'; y += 64; }
  };
  page();
  g.fillStyle = C.navy; g.font = `700 44px ${SANS}`; spaced(g, st.title, L, y + 46, 3);
  g.fillStyle = C.accent; g.fillRect(L, y + 66, 90, 5);
  g.font = `600 18px ${SANS}`; g.fillStyle = C.label; spaced(g, 'NO.', R, y + 16, 1.6, 'right');
  g.fillStyle = C.accent; g.font = `700 34px ${SANS}`; g.textAlign = 'right'; g.fillText(st.no, R, y + 52);
  g.fillStyle = C.ink; g.font = `500 22px ${SANS}`; g.fillText(st.date, R, y + 84); g.textAlign = 'left';
  y += 112;
  // who it is about: a ruled box of label / value pairs, two to a row
  const rowsN = Math.ceil(st.info.length / 2), ih = 70;
  g.strokeStyle = C.navy; g.lineWidth = 2; g.strokeRect(L, y, W, rowsN * ih);
  st.info.forEach(([lab, val], i) => {
    const x = L + (i % 2) * (W / 2), ry = y + Math.floor(i / 2) * ih;
    if (i % 2) { g.fillStyle = C.rule; g.fillRect(x, ry, 1.5, ih); }
    if (i >= 2 && i % 2 === 0) { g.fillStyle = C.rule; g.fillRect(L, ry, W, 1.5); }
    slipLabel(g, lab, x + 20, ry + 28);
    g.fillStyle = C.ink; g.font = `700 26px ${SANS}`; g.fillText(fitText(g, val, W / 2 - 40), x + 20, ry + 58);
  });

  // tables: a header band, rows with a light stripe, a total line; they carry on to the next page when full

  for (const sec of st.sections) {
    const xs = colX(sec.cols);
    const headRow = () => {
      g.fillStyle = C.tint; g.fillRect(L, y, W, 44); g.fillStyle = C.navy; g.fillRect(L, y + 43, W, 1.5);
      sec.cols.forEach((c, i) => { g.fillStyle = C.label; g.font = `700 17px ${SANS}`; spaced(g, c.h.toUpperCase(), c.right ? xs[i] + c.w - 14 : xs[i] + 14, y + 28, 1.2, c.right ? 'right' : 'left'); });
      y += 44;
    };
    if (y + 170 > limit) page();
    g.fillStyle = C.navy; g.font = `700 24px ${SANS}`; g.fillText(sec.title, L, y + 24); y += 40;
    headRow();
    if (!sec.rows.length) { g.fillStyle = C.label; g.font = `italic 22px ${SANS}`; g.fillText('Nothing yet.', L + 14, y + 30); y += 44; }
    sec.rows.forEach((row, ri) => {
      if (y + 40 > limit - 60) { page(); headRow(); }
      if (ri % 2) { g.fillStyle = C.stripe; g.fillRect(L, y, W, 40); }
      row.forEach((cell, i) => {
        const c = sec.cols[i];
        g.fillStyle = C.ink; g.font = `${c.right ? 600 : 500} 22px ${SANS}`;
        const t = fitText(g, cell, c.w - 28);
        if (c.right) { g.textAlign = 'right'; g.fillText(t, xs[i] + c.w - 14, y + 27); g.textAlign = 'left'; } else g.fillText(t, xs[i] + 14, y + 27);

  const sx = L + W / 2 - 20, sw = R - sx;
  st.summary.forEach(([lab, val, strong], i) => {
    const ry = y + i * 44;
    if (strong) { g.fillStyle = C.navy; g.fillRect(sx, ry, sw, 1.5); }
    g.fillStyle = strong ? C.ink : C.label; g.font = `${strong ? 700 : 500} ${strong ? 26 : 24}px ${SANS}`; g.fillText(lab, sx + 10, ry + 33);
    g.fillStyle = C.ink; g.textAlign = 'right'; g.fillText(val, R - 10, ry + 33); g.textAlign = 'left';
  });
  y += st.summary.length * 44 + 20;
  if (st.verdict) {
    const tone = st.verdict.good ? '#0E7C57' : C.accent;
    boxPath(g, L, y, W, 76); g.fillStyle = st.verdict.good ? 'rgba(14,124,87,.08)' : 'rgba(200,80,30,.08)'; g.fill(); g.strokeStyle = tone; g.lineWidth = 3; g.stroke();
    g.fillStyle = tone; g.font = `700 30px ${SANS}`; spaced(g, st.verdict.text, L + W / 2, y + 49, 2, 'center');
    y += 100;
  }
  if (st.sign && y + 200 + 120 + 40 > limit) page();
  if (st.sign) {
    const s = st.sign, h = 200, split = s.photo ? L + 660 : R;
    g.strokeStyle = C.navy; g.lineWidth = 2.5; g.strokeRect(L, y, W, h);
    if (s.photo) { g.fillStyle = C.navy; g.fillRect(split, y, 1.5, h); photoInto(g, s.photo, split + 14, y + 14, R - split - 28, h - 28); }
    const lineY = y + h - 50, lineW = Math.min(520, split - L - 48);

    g.fillStyle = C.ink; g.fillRect(L + 24, lineY, lineW, 1.5);
    g.fillStyle = C.ink; g.font = `600 24px ${SANS}`; g.fillText(s.name, L + 24, lineY + 30);
    g.fillStyle = C.label; g.font = `400 18px ${SANS}`; g.textAlign = 'right'; g.fillText('Signature', L + 24 + lineW, lineY + 30); g.textAlign = 'left';
    y += h + 120;
    const colW = W / 3;
    if (stampImg) drawStamp(g, stampImg, R - 104, y - 45, 180, st.stampDate, stampImg.place); // clear of the page number below
    [['Prepared by', st.preparedBy || ''], ['Checked by', ''], ['Approved by', st.approval ? st.approval.name : '']].forEach(([lab, name], i) => {
      const x = L + i * colW;
      if (i === 2) drawApproved(g, x, y, colW - 40, st.approval);
      g.fillStyle = C.ink; g.font = `600 24px ${SANS}`; if (name) g.fillText(name, x, y - 14);
      g.fillRect(x, y, colW - 40, 1.5);

    });

  }

  pages.forEach((c, i) => {
    const p = c.getContext('2d'); p.fillStyle = C.label; p.font = `500 18px ${SANS}`;
    p.fillText(made, L, limit + 20); p.textAlign = 'right'; p.fillText(`Page ${i + 1} of ${pages.length}`, R, limit + 20);

  return new Blob([pdfPages(jpegs)], { type: 'application/pdf' });
}
// the voucher or receipt number made for an entry, if any
const docNo = id => (filesFor(id).filter(f => f.no && !f.cancelled).pop() || {}).no || '';
const sumByCur = items => CURS.filter(c => items.some(x => x.cur === c)).map(c => slipMoney(total(items.filter(x => x.cur === c)), c));
// a statement that isn't kept: made, then offered for sending (it can be made again any time)
async function shareStatement(st, fileName) {

const statementNo = () => { const [[no], seq] = nextIds('ST', 1, S.seq); update({ seq }); return no; };

// the day's rate for an SSP entry, and what it was worth in dollars
const usdOf = r => (r.cur === 'SSP' && r.rate > 0 ? Math.round(r.amount / r.rate * 100) / 100 : null);
const rateRow = r => (usdOf(r) === null ? [] : [['Rate', `1 USD = ${plain(r.rate)} SSP · ≈ ${money(usdOf(r), 'USD')}`]]);
const slipDay = r => { const [y, m, d] = r.at.slice(0, 10).split('-').map(Number); return `${DAYS[new Date(y, m - 1, d).getDay()]}, ${fmtDate(r.at.slice(0, 10))}`; };
const stampDate = r => r.at.slice(0, 10).split('-').reverse().join('-'); // 09-10-2026, as written on the paper vouchers
function voucherSpec(r) {
  return { title: SLIP_TITLE.voucher, party: ['Paid to', r.paidTo], when: ['Date', slipDay(r)], forLabel: 'Being payment for',
    lines: [{ t: r.reason, v: slipMoney(r.amount, r.cur) }, r.project && { t: `Project: ${projName(r.project)}`, muted: true }, r.location && { t: `Location: ${r.location}`, muted: true }].filter(Boolean),
    extra: [['Paid from', accountOf(r.mode)], ...rateRow(r)], signLabel: 'Received by', signName: r.paidTo };

    lines: [{ t: projName(r.project), v: slipMoney(r.amount, r.cur) }, r.note && { t: r.note, muted: true }].filter(Boolean),
    extra: [['Received into', accountOf(r.mode)], ...rateRow(r)], signLabel: 'Received by (for the company)', signName: myName() || r.by };

async function saveSlip(f) {
  const k = f.dataset.kind, r = S[COLL[k]].find(x => x.id === f.dataset.id), cv = $('canvas.sig', f);
  if (!cv.dataset.ink) return formErr(f, null, 'Please sign in the box first.');
  const btn = $('button.btn', f);
  btn.disabled = true; $('.err', f).textContent = 'Making the PDF…';
  try {
    const photo = framedPhoto(f);
    const type = k === 'R' ? 'receipt' : r.pay ? 'slip' : 'voucher';
    const [[no], seq] = nextIds(k === 'R' ? 'RC' : 'PV', 1, S.seq);
    update({ seq });
    // a final settlement payment: its slip is the whole statement (every wage and payment), signed as fully settled
    const w = r.pay === 'settlement' && workerOf(r.worker);
    const spec = w ? workerStatementSpec(w, { final: true, no, sig: cv, photo, date: r.at.slice(0, 10), docs: { [r.id]: no } })
      : k === 'R' ? receiptSpec(r, clean(f.elements.party.value)) : r.pay ? payslipSpec(r) : voucherSpec(r);
    if (w) spec.signName = w.name;

    if (w) spec.approval = approval;
    const blob = w ? await renderStatement(spec) : await renderSlip({ ...spec, no, stampDate: stampDate(r), amount: r.amount, cur: r.cur, sig: cv, photo, preparedBy: r.by, ref: r.id, approval });
    const name = `${no} ${fileSafe(spec.signName || '')}.pdf`;
    await keepFile({ for: r.id, type, no, name, mime: 'application/pdf' }, await blob.arrayBuffer());

}
function readySheet(title, no, blob, name) {

/* ---------- logins ---------- */
// Each person signs in with their own username and password. The Google Sheet checks it and decides
// what they receive and may change; the app only hides what they can't use. Until the sheet has
// logins (or for a phone that hasn't signed in yet) everything works as before, with the company password.
// The sign-in lives in its own storage slot, so it never ends up in a backup file.
const SESSION_KEY = KEY + '-login';
const ROLES = { admin: 'Admin', manager: 'Office manager', store: 'Store keeper' };
const ROLE_HELP = { admin: 'Everything, including giving logins', manager: 'Sees everything · adds entries · edits wait for an admin', store: 'Adds expenses · sees only their own, no company money' };
const RIGHTS = {
  admin: ['add', 'edit', 'delete', 'date', 'money', 'projects', 'settings', 'import', 'backup', 'restore', 'logins', 'phones', 'staff'],
  manager: ['add', 'suggest', 'date', 'backup', 'staff'], // suggest = edits and deletes wait for an admin's approval; no money (balances)
  store: ['add'],
};
const NOTHING_SEEN = { expenses: [], credits: [], transfers: [], projects: [], log: [], changes: [], workers: [], absences: [], files: [] };

// { token, user: { id, name, username, role }, check: { salt, hash } } — or { out: true, why } once signed out
let session = loadSession();
let usersCache = [];
function loadSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; } }
function saveSession(s) {
  session = s;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) { alert('⚠️ Could not save the sign-in: ' + e.message); }
}
const signedIn = () => !!(session && session.token);
const myName = () => (signedIn() ? session.user.name : '');
const can = what => !signedIn() || RIGHTS[session.user.role].includes(what);
const mustSignIn = () => !!(S && S.link && session && session.out);
const signInBanner = () => (S.link?.logins && !signedIn() ? `<div class="banner new"><span>👤 Everyone can now have their own login. Sign in with yours.</span><button class="btn small" data-act="signIn">Sign in</button></div>` : '');

// The phone's own check of a login password (for "unlock" without internet): PBKDF2 with many rounds,
// so a copy taken from the phone is slow to crack.
async function slowHash(pw, salt) {
  const enc = new TextEncoder(), key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: 200000 }, key, 256);
  return [...new Uint8Array(bits)].map(x => x.toString(16).padStart(2, '0')).join('');
}
// only the entries this phone hasn't sent yet (they must never be lost)
const onlyUnsent = () => { const d = new Set(S.dirty); return Object.fromEntries(Object.keys(SYNC_KEYS).map(key => [key, S[key].filter(r => d.has(recId(key, r)))])); };

// Signed in: remember who, and a check of the password so "unlock" works offline.
// The company code is removed from this phone, so a closed login can't fall back to it.
async function signedInAs(res, password) {
  const salt = randHex();
  saveSession({ token: res.token, user: res.me, check: { salt, hash: await slowHash(password, salt) } });
  // reload the company settings as this person may see them (only admins get the company password);
  // a store keeper sees only their own entries: drop everything else this phone held (it's all on the sheet)
  const clear = { settingsU: 0, ...(res.me.role === 'admin' ? {} : { pass: null }), ...(res.me.role === 'store' ? onlyUnsent() : {}) };
  if (res.me.role === 'store') dropFileCopies();
  S = { ...S, ...clear, link: { ...S.link, k: '', since: 0, logins: true }, lastBy: res.me.name };
  save();
}
// The sheet ended this sign-in (password reset, login disabled, or logins now required).
function signedOutByServer(why) {
  saveSession({ out: true, why });
  // nothing stays on a phone that lost access — except changes it hasn't sent yet
  S = { ...S, ...onlyUnsent(), pass: null, link: { ...S.link, since: 0 } }; // signing in again brings back what this login may see
  dropFileCopies();
  save(); closeAll(); render();
}
async function signOut() {
  const n = S.dirty.length + outbox.length;
  if (n) return alert(`This phone has ${n} change${n === 1 ? '' : 's'} or file${n === 1 ? '' : 's'} not sent to the Google Sheet yet.\n\nConnect to the internet and wait until it says "Up to date", then sign out.`);
  if (!confirm('Sign out of this phone?\n\nThe company records leave this phone. They come back when someone signs in.')) return;
  const token = session.token;
  saveSession({ out: true }); // the sign-in screen shows at once, so nothing new can be added meanwhile
  closeAll(); render(); dropFileCopies();
  try { await callServer(S.link, { op: 'logout', token }); } catch { /* already signed out on the sheet: fine */ }
  if (!S.dirty.length) { S = { ...S, ...NOTHING_SEEN, link: { ...S.link, since: 0 } }; save(); } // never drop anything unsent
  render();
}

/* ---------- edits waiting for approval ---------- */
// An office manager's edit doesn't change the entry: it becomes a change request (kind C) that an admin
// approves or rejects. Until then the entry and every total keep the old values.
const canChange = () => can('edit') || can('suggest');
const saveLabel = () => (can('edit') ? 'Save changes' : 'Send for approval');
const approvalNote = old => (old && !can('edit') ? '<p class="note">An admin approves this change first. Until then the entry and the totals stay as they are.</p>' : '');
const waiting = () => (S.changes || []).filter(c => c.status === 'waiting');
const waitingFor = id => waiting().filter(c => c.target === id);
const recordsOf = kind => S[KIND_KEY[kind]] || [];
const targetOf = c => recordsOf(c.kind).find(x => x.id === c.target);
// the fields an edit may change, per kind (the Google Sheet checks the same list)
const EDITABLE = {
  E: ['cur', 'amount', 'paidTo', 'reason', 'location', 'project', 'mode', 'at', 'manualDate', 'rate'],
  R: ['cur', 'amount', 'project', 'mode', 'note', 'at', 'manualDate', 'rate'],
  T: ['cur', 'amount', 'from', 'to', 'note', 'at', 'manualDate'],
  P: ['name', 'value', 'valueCur'],
  W: ['name', 'phone', 'job', 'site', 'wage', 'cur', 'start', 'idNo', 'status', 'left', 'openingAmount', 'openingNote', 'clearedTo'],
  A: ['date', 'note'],
};
const editPart = c => (c.action ? {} : Object.fromEntries(Object.entries(c.after || {}).filter(([f]) => (EDITABLE[c.kind] || []).includes(f))));
const whatIs = (kind, r) => (kind === 'P' ? `Project "${r.name}"` : kind === 'W' ? `Employee ${r.name}`
  : kind === 'A' ? `Day not worked: ${(workerOf(r.worker) || {}).name || r.worker}, ${fmtDate(r.date)}${r.note ? ` (${r.note})` : ''}` : describe(kind, r));
// what approving would really change, worked out from the entry itself — never from the text sent with the request
function changeLines(c, r) {
  if (!r) return [];
  if (c.action === 'delete') return [`Delete it: ${whatIs(c.kind, r)}`];
  if (c.action === 'advance') return [`Give an advance of ${money(+c.after.amount, c.after.cur)} — more than the $${ADVANCE_LIMIT_USD} a month limit`];
  const next = { ...r, ...editPart(c) };
  if (c.kind !== 'P') return diff(r, next);
  const vc = x => x.valueCur || 'USD';
  return [r.name !== next.name && `Name: ${r.name} → ${next.name}`,
    (Number(r.value || 0) !== Number(next.value || 0) || vc(r) !== vc(next)) && `Project value: ${money(+r.value || 0, vc(r))} → ${money(+next.value || 0, vc(next))}`].filter(Boolean);
}
const waitingNote = id => waitingFor(id).map(c => `<p class="note">✏️ <b>Change waiting for approval</b> — ${esc(changeLines(c, targetOf(c)).join(' ; ') || 'no real change')} · asked by ${esc(c.by)}, ${esc(fmtAbs(c.at))}</p>`).join('');

function requestChange(kind, old, rec, changes, by) {
  const [[id], seq] = nextIds('C', 1, S.seq);
  const before = Object.fromEntries(Object.keys(rec).map(f => [f, old[f] ?? '']));
  update({
    changes: [...S.changes, { id, kind, target: old.id, before, after: rec, text: changes.join(' ; '), by, at: stamp(), createdAt: stampSec(), status: 'waiting' }], seq,
    log: logWith([['Change asked', old.id, `${changes.join(' ; ')} — waiting for an admin`]], by), lastBy: by,
  });

}
function approvalsBanner() {
  const n = waiting().length;

  if (can('edit')) return `<div class="banner"><span>✏️ ${n} change${n === 1 ? '' : 's'} waiting for your approval.</span><button class="btn small" data-act="approvals">Review</button></div>`;
  const mine = waiting().filter(c => c.by === myName()).length;
  return mine ? `<div class="banner new"><span>✏️ ${mine} of your changes ${mine === 1 ? 'is' : 'are'} waiting for an admin to approve.</span></div>` : '';
}
function approvalsSheet() {
  const list = waiting().sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  openSheet(`${head('Changes to approve', '', `${list.length} waiting`)}
    ${list.length ? list.map(changeCard).join('') : '<p class="muted">Nothing is waiting. ✓</p>'}`);
}
function changeCard(c) {
  const r = targetOf(c);
  const gone = !r || r.deleted, lines = changeLines(c, r);
  // the entry was changed by someone else after this request: show it so the admin looks first
  const moved = r && Object.keys(c.before || {}).some(f => String(r[f] ?? '') !== String(c.before[f] ?? ''));
  return `<section class="card pad" style="margin-bottom:12px">
    <p style="margin:0 0 6px"><b>${esc(r ? whatIs(c.kind, r) : c.target)}</b></p>
    <ul style="margin:0 0 8px;padding-left:20px">${(lines.length ? lines : ['No real change — reject it']).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
    <p class="muted" style="margin:0 0 10px">Asked by ${esc(c.by)} · ${esc(fmtAbs(c.at))}</p>
    ${gone ? '<p class="note">This entry was deleted — the change can only be rejected.</p>' : moved ? '<p class="note">⚠️ This entry was changed after the request. Check it before approving.</p>' : ''}
    <div class="two"><button class="btn danger" data-act="decide" data-id="${esc(c.id)}" data-ok="">Reject</button><button class="btn in" data-act="decide" data-id="${esc(c.id)}" data-ok="1" ${gone ? 'disabled' : ''}>Approve</button></div>
  </section>`;
}
async function decide(id, ok) {
  if (!await unlock('Enter the password to approve or reject changes.')) return;
  const c = S.changes.find(x => x.id === id);
  if (!c || c.status !== 'waiting') return approvalsSheet();
  const me = myName() || S.lastBy || 'Admin', key = KIND_KEY[c.kind];
  const r = targetOf(c), next = r && { ...r, ...editPart(c) };
  if (ok && (!r || r.deleted || !VALID[c.kind](next))) return alert("This change can't be applied: the entry is gone or the new values aren't valid. Reject it instead.");
  if (ok && c.action === 'delete' && c.kind === 'P' && [...live(S.expenses), ...live(S.credits)].some(x => x.project === c.target)) return alert('This project still has entries. Move or delete them first, or reject this.');
  const what = changeLines(c, r).join(' ; ') || 'no real change';
  const patch = {
    changes: S.changes.map(x => (x.id === id ? { ...x, status: ok ? 'approved' : 'rejected', decidedBy: me, decidedAt: stampSec() } : x)),
    log: logWith([[ok ? 'Approved' : 'Rejected', c.target, `${what} — asked by ${c.by}`]], me),
  };
  // an approved advance changes nothing yet: whoever hands over the money then records it against this approval
  if (ok && c.action === 'delete') patch[key] = S[key].map(x => (x.id === c.target ? { ...x, deleted: stampSec(), deletedBy: `${c.by} (approved by ${me})` } : x));
  if (ok && !c.action) patch[key] = S[key].map(x => (x.id === c.target ? { ...next, editedAt: stampSec(), editedBy: `${c.by} (approved by ${me})` } : x));
  update(patch);
  render(); approvalsSheet(); toast(!ok ? 'Rejected — the entry stays as it was' : c.action === 'delete' ? 'Approved ✓ The entry is deleted' : c.action === 'advance' ? 'Approved ✓ The advance can be given now' : 'Approved ✓ The entry is changed');
}
// An office manager's delete waits for an admin, like her edits.
async function askDelete(k, id) {

  const r = S[KIND_KEY[k]].find(x => x.id === id);
  if (!confirm(`Ask an admin to delete this?\n\n${whatIs(k, r)}\n\nIt stays as it is until an admin approves.`)) return;
  const by = myName() || S.lastBy || '';
