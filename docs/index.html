<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3EFE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Accounts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Company Accounts</title>
<style>
:root {
  --paper: #F3EFE7; --card: #FFFFFF; --field: #FBFAF7;
  --ink: #1B2232; --muted: #6A6458; --line: #E7E1D4;
  --in: #0E7C57; --in-soft: #E2F3EA;
  --out: #CF4527; --out-soft: #FCE9E3;
  --warn: #8A5A00; --warn-soft: #FFF3D6;
  --r-lg: 28px; --r-md: 20px; --r-sm: 14px;
  --shadow: 0 1px 0 rgba(27,34,50,.04), 0 10px 28px -16px rgba(27,34,50,.28);
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid #3B5BDB; outline-offset: 2px; }
.app { max-width: 720px; margin: 0 auto; padding: 12px 16px 120px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px 16px; }
.co { font-weight: 800; font-size: 21px; letter-spacing: -.01em; }
.today-date { color: var(--muted); font-size: 14px; }
.top-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.chip { border: 0; cursor: pointer; font-size: 13px; font-weight: 800; color: var(--in); background: var(--in-soft); padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
.chip.wait { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--out); background: var(--out-soft); }
.lockpill { border: 0; background: var(--warn-soft); color: var(--warn); font-weight: 800; font-size: 14px; padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }

/* balance */
.balance { position: relative; overflow: hidden; background: var(--ink); color: #fff; border-radius: var(--r-lg); padding: 22px 22px 18px; box-shadow: 0 24px 50px -28px rgba(27,34,50,.8);
  background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.045) 31px 32px); }
.balance::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(46,204,140,.28), transparent 70%); }
.balance.neg::after { background: radial-gradient(circle, rgba(255,110,80,.35), transparent 70%); }
.balance .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; opacity: .7; font-weight: 700; }
.balance .big { font-size: clamp(24px, 7vw, 48px); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: break-word; min-width: 0; }
.bal { display: flex; align-items: center; gap: 12px; margin-top: 8px; position: relative; z-index: 1; }
.cur-tag { font-size: 12px; font-weight: 800; letter-spacing: .08em; background: rgba(255,255,255,.14); padding: 4px 8px; border-radius: 8px; flex: none; }
.bal.neg .big { color: #FFB4A2; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.split div { background: rgba(255,255,255,.08); border-radius: var(--r-sm); padding: 10px 14px; }
.split small { display: block; font-size: 13px; opacity: .72; }
.split b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 480px) { .split { grid-template-columns: 1fr; } .split b { display: inline-block; margin-right: 16px; } }
.split .i b { color: #8BE3BE; } .split .o b { color: #FFB4A2; }

/* big action tiles */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 12px; }
.tile { border: 0; cursor: pointer; text-align: left; border-radius: var(--r-md); padding: 18px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; transition: transform .2s var(--ease), box-shadow .2s var(--ease); box-shadow: var(--shadow); }
.tile:hover { transform: translateY(-2px); }
.tile:active { transform: scale(.97); }
.tile.out { background: var(--out); } .tile.in { background: var(--in); }
.tile .ic { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-size: 30px; font-weight: 800; line-height: 1; }
.tile b { display: block; font-size: 20px; margin-top: 12px; }
.tile small { opacity: .88; font-size: 14px; }
.tile.bulk { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; background: var(--card); color: var(--ink); border: 2px dashed #D6CEBD; box-shadow: none; padding: 14px 18px; }
.tile.bulk .ic { background: var(--out-soft); color: var(--out); font-size: 22px; }
.tile.bulk b { margin: 0; font-size: 18px; }
.tile.bulk small { display: block; color: var(--muted); opacity: 1; }

.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { background: var(--card); border-radius: var(--r-sm); padding: 12px 16px; box-shadow: var(--shadow); }
.mini small { display: block; color: var(--muted); font-size: 13px; font-weight: 700; }
.mini b { display: block; font-size: clamp(15px, 4.4vw, 19px); color: var(--out); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { min-width: 0; overflow-x: auto; }

.sec { font-size: 15px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 26px 4px 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 12px; }
.sec-head .sec { margin: 0 4px; }

/* lists */
.card { background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow); }
.pad { padding: 20px; }
.list { overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; transition: background .15s; }
.row:first-child { border-top: 0; }
.row:hover { background: #FAF8F3; }
.dot { width: 40px; height: 40px; flex: none; border-radius: 13px; display: grid; place-items: center; font-weight: 800; font-size: 22px; }
.row.out .dot { background: var(--out-soft); color: var(--out); }
.row.in .dot { background: var(--in-soft); color: var(--in); }
.main { flex: 1; min-width: 0; }
.t { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s { display: block; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.out .amt { color: var(--out); } .row.in .amt { color: var(--in); }
.tag { font-style: normal; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: var(--paper); color: var(--muted); flex: none; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.day { display: flex; justify-content: space-between; padding: 18px 6px 8px; color: var(--muted); font-weight: 800; font-size: 14px; }
.empty { text-align: center; padding: 36px 20px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

/* history filters */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: #E8E2D5; border-radius: 16px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { border: 0; background: none; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.filters { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.filters input, .filters select { font: inherit; font-size: 16px; padding: 12px 14px; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--card); min-width: 0; }
.sumline { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 6px 0; font-weight: 700; color: var(--muted); }
.sumline b { font-size: 22px; } .out-c { color: var(--out); } .in-c { color: var(--in); }

/* projects */
.proj { display: block; width: 100%; border: 0; text-align: left; cursor: pointer; padding: 18px; margin-bottom: 12px; transition: transform .2s var(--ease); }
.proj:hover { transform: translateY(-2px); }
.ph { display: flex; justify-content: space-between; align-items: center; font-size: 19px; margin-bottom: 12px; }
.ph b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { color: var(--muted); font-size: 26px; line-height: 1; }
.bar { height: 10px; border-radius: 99px; background: var(--paper); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--in); border-radius: inherit; }
.pv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin: 6px 0 14px; font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--paper); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.stats small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
.stats b { display: block; font-variant-numeric: tabular-nums; font-size: 15px; overflow-wrap: anywhere; }
.stats .in b { color: var(--in); } .stats .out b { color: var(--out); }
b.in { color: var(--in); } b.out { color: var(--out); }

/* sheet page */
.card h3 { margin: 0 0 6px; }
a.btn { display: block; text-align: center; text-decoration: none; }
.sub { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.fld textarea { width: 100%; min-height: 170px; font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 12px; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--field); color: var(--ink); resize: vertical; }
.fld textarea:focus { outline: none; border-color: var(--ink); background: #fff; }
.note.cols { font-size: 13px; font-weight: 800; word-spacing: 2px; }
.ok-line { color: var(--in); margin: 0 0 6px; }
.err-list { color: var(--out); background: var(--out-soft); border-radius: var(--r-sm); padding: 10px 14px; font-size: 14px; margin: 6px 0; }
.err-list ul { margin: 6px 0 0; padding-left: 18px; }
.steps { margin: 0 0 16px; padding-left: 22px; display: grid; gap: 8px; }
.muted { color: var(--muted); font-size: 15px; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.stack { display: grid; gap: 14px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 700; padding: 12px 14px; border-radius: var(--r-sm); margin-bottom: 14px; font-size: 15px; }
.banner .btn { background: var(--warn); color: #fff; }

/* buttons */
.btn { border: 0; cursor: pointer; width: 100%; font-weight: 800; font-size: 18px; padding: 16px 20px; border-radius: 16px; transition: transform .15s var(--ease), filter .15s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: #fff; }
.btn.out { background: var(--out); color: #fff; }
.btn.in { background: var(--in); color: #fff; }
.btn.ghost { background: transparent; border: 2px solid var(--line); }
.btn.danger { background: var(--out-soft); color: var(--out); }
.btn.small { width: auto; font-size: 15px; padding: 10px 14px; border-radius: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { border: 0; background: none; color: var(--ink); text-decoration: underline; cursor: pointer; font-weight: 700; padding: 8px; }

/* bottom tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.93); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 5; }
nav.tabs .wrap { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs button { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 14px; color: var(--muted); font-size: 13px; font-weight: 800; }
nav.tabs button.on { color: var(--ink); background: var(--paper); }
nav.tabs svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* sheets (dialogs) */
dialog.sheet { border: 0; padding: 0; width: min(640px, calc(100% - 32px)); max-height: 92vh; overflow: auto; border-radius: 26px; background: var(--card); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(27,34,50,.5); backdrop-filter: blur(3px); }
.sin { padding: 20px 20px 24px; }
.sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.sh-head h2 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; }
.sh-head h2::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--tone, var(--ink)); flex: none; }
.sh-head small { color: var(--muted); font-weight: 700; }
.close { border: 0; background: var(--paper); width: 42px; height: 42px; border-radius: 50%; font-size: 26px; line-height: 1; cursor: pointer; flex: none; }
.tone-out { --tone: var(--out); } .tone-in { --tone: var(--in); }
@media (max-width: 640px) {
  dialog.sheet:not(.pwbox) { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 26px 26px 0 0; max-height: 94vh; }
}
@media (prefers-reduced-motion: no-preference) {
  dialog[open] { animation: up .35s var(--ease); }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
}

/* form fields */
.fld { display: block; margin: 0 0 14px; border: 0; padding: 0; }
.fld > span { display: block; font-weight: 800; font-size: 15px; margin: 0 0 6px; }
.fld em { font-style: normal; color: var(--muted); font-weight: 600; }
.fld input, .fld select, #pwIn { width: 100%; font: inherit; font-size: 18px; padding: 14px 16px; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--field); color: var(--ink); }
.fld input:focus, .fld select:focus, #pwIn:focus, .brow input:focus { outline: none; border-color: var(--ink); background: #fff; }
.amt-in { display: flex; align-items: center; gap: 6px; border: 2px solid var(--line); border-radius: 18px; padding: 4px 16px; background: var(--field); }
.amt-in:focus-within { border-color: var(--ink); background: #fff; }
.amt-in b { font-size: 30px; color: var(--muted); }
.fld .amt-in input { border: 0; background: transparent; font-size: 38px; font-weight: 800; padding: 8px 0; font-variant-numeric: tabular-nums; }
.amt-preview { display: block; color: var(--muted); font-weight: 700; font-size: 14px; min-height: 1.3em; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chips span { display: inline-block; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--line); font-weight: 800; font-size: 16px; }
.chips input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
.chips input:focus-visible + span { outline: 3px solid #3B5BDB; outline-offset: 2px; }
.curseg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.curseg label { position: relative; }
.curseg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.curseg span { display: block; border: 2px solid var(--line); border-radius: var(--r-sm); padding: 10px 14px; }
.curseg b { display: block; font-size: 20px; }
.curseg small { color: var(--muted); font-weight: 700; font-size: 13px; }
.curseg input:checked + span { background: var(--ink); border-color: var(--ink); color: #fff; }
.curseg input:checked + span small { color: rgba(255,255,255,.75); }
.curseg input:focus-visible + span { outline: 3px solid #3B5BDB; outline-offset: 2px; }
.when { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--paper); border-radius: var(--r-sm); padding: 12px 14px; }
.when small { display: block; color: var(--muted); font-size: 13px; font-weight: 700; }
.err { color: var(--out); font-weight: 800; min-height: 1.2em; margin: 4px 0 10px; }
.bad { border-color: var(--out) !important; background: var(--out-soft) !important; }
.hint { color: var(--muted); margin: -8px 0 14px; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: var(--r-sm); padding: 12px 14px; font-size: 15px; }

/* bulk */
.brows { counter-reset: r; display: grid; gap: 8px; margin-bottom: 10px; }
.brow { display: grid; grid-template-columns: 26px 130px 1fr 1fr 40px; gap: 8px; align-items: center; }
.brow .n::before { counter-increment: r; content: counter(r); font-weight: 800; color: var(--muted); }
.brow input { width: 100%; min-width: 0; font: inherit; font-size: 16px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--field); }
.brow input[name=amount] { font-weight: 800; }
.brow .x { border: 0; background: var(--paper); border-radius: 10px; height: 44px; font-size: 22px; cursor: pointer; color: var(--muted); }
.shared { background: var(--paper); border-radius: var(--r-md); padding: 16px 16px 4px; margin: 16px 0 0; }
.shared h3 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.shared .fld input, .shared .fld select { background: #fff; }
.shared .when { background: #fff; }
.foot { position: sticky; bottom: 0; background: var(--card); padding: 12px 0 4px; margin-top: 8px; border-top: 1px solid var(--line); }
.btotal { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; margin-bottom: 4px; }
.btotal b { font-size: 26px; color: var(--out); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .brow { grid-template-columns: 22px 1fr 44px; grid-template-areas: "n a x" "n p p" "n r r"; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .brow .n { grid-area: n; align-self: start; padding-top: 12px; }
  .brow [name=amount] { grid-area: a; } .brow [name=paidTo] { grid-area: p; } .brow [name=reason] { grid-area: r; } .brow .x { grid-area: x; }
}

/* detail */
.dbig { font-size: 44px; font-weight: 800; letter-spacing: -.02em; margin: -4px 0 14px; font-variant-numeric: tabular-nums; }
.dbig.out { color: var(--out); } .dbig.in { color: var(--in); }
.facts { margin: 0 0 18px; background: var(--paper); border-radius: var(--r-md); padding: 4px 16px; }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
.facts div:first-child { border-top: 0; }
.facts dt { color: var(--muted); font-weight: 700; }
.facts dd { margin: 0; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
.subh { margin: 20px 0 8px; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.list.inset { background: var(--paper); box-shadow: none; }

/* password + setup */
dialog.pwbox { width: min(400px, calc(100% - 32px)); text-align: center; }
.lockic { font-size: 40px; }
.pwbox h2 { margin: 6px 0; }
.pwbox p { color: var(--muted); margin: 0 0 14px; }
#pwIn { text-align: center; font-size: 22px; letter-spacing: .1em; }
.setup { max-width: 480px; margin: 6vh auto 0; }
.setup h1 { margin: 10px 0 4px; font-size: 32px; letter-spacing: -.02em; }
.setup > p { color: var(--muted); margin: 0 0 22px; }
.logo { width: 64px; height: 64px; border-radius: 20px; background: var(--ink); display: grid; place-items: center; }
.center { text-align: center; }

.toast { position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; font-weight: 800; padding: 14px 20px; border-radius: 16px; opacity: 0; pointer-events: none; transition: .3s var(--ease); z-index: 10; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="hdr" hidden>
    <div><div class="co" id="coName"></div><div class="today-date" id="todayDate"></div></div>
    <div class="top-r"><button class="chip" id="syncChip" data-act="tab" data-tab="sheet" hidden></button><button class="lockpill" id="lockPill" data-act="lock" hidden>🔓 Unlocked · Lock</button></div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" id="tabs" hidden aria-label="Main">
  <div class="wrap">
    <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-act="tab" data-tab="hist"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>History</button>
    <button data-act="tab" data-tab="proj"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>Projects</button>
    <button data-act="tab" data-tab="sheet"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>Sheet</button>
  </div>
</nav>

<dialog id="sheet" class="sheet"><div class="sin" id="sheetIn"></div></dialog>

<dialog id="pw" class="sheet pwbox">
  <form id="pwForm" class="sin">
    <div class="lockic">🔒</div>
    <h2>Password needed</h2>
    <p id="pwWhy"></p>
    <input type="password" id="pwIn" autocomplete="current-password" placeholder="Password" required>
    <p class="err" id="pwErr"></p>
    <div class="two"><button type="button" class="btn ghost" id="pwCancel">Cancel</button><button class="btn primary">Unlock</button></div>
    <p class="muted" style="margin:14px 0 0">Stays unlocked for 5 minutes.</p>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const KEY = 'company-accounts-v1';
const UNLOCK_MS = 5 * 60 * 1000;
const BACKUP_NAG_DAYS = 7;
const MODES = ['Cash', 'Mobile money', 'Bank', 'Card', 'Cheque'];
// Two separate money accounts. They are never added together: the rate moves too much.
const CURS = ['USD', 'SSP'];
const CUR_NAME = { USD: 'US Dollar', SSP: 'S. Sudan Pound' };
const SYM = { USD: '$', SSP: 'SSP ' };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const AT_RE = /^\d{4}-\d\d-\d\dT\d\d:\d\d$/;

let S = load();
let tab = 'home', histKind = 'E', histQuery = '', histMonth = '';
let unlockedUntil = 0;

/* ---------- storage ---------- */
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert('⚠️ Could not save!\nYour browser storage may be full or blocked.\nOpen the Sheet tab and save a backup now.\n\n' + e.message); }
}
// Every change goes through here. Changed records get a fresh time stamp (u); when this device
// is connected to the Google Sheet they are also queued (dirty) for the next sync.
const SYNC_KEYS = { expenses: 'E', credits: 'R', projects: 'P', log: 'L' };
const recId = (key, r) => key === 'log' ? r.lid : r.id;
function update(patch) {
  const now = Date.now(), dirty = new Set(S.dirty || []), stamped = {};
  for (const key of Object.keys(SYNC_KEYS)) {
    if (!patch[key]) continue;
    const before = new Set(S[key]);
    stamped[key] = patch[key].map(r => { if (before.has(r)) return r; dirty.add(recId(key, r)); return { ...r, u: now }; });
  }
  if ('company' in patch || 'pass' in patch) { dirty.add('settings'); stamped.settingsU = now; }
  S = { ...S, ...patch, ...stamped, dirty: S.link ? [...dirty] : [] };
  save(); scheduleSync();
}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const stamp = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
// seconds keep same-minute entries in the order they were made
const stampSec = (d = new Date()) => `${stamp(d)}:${pad(d.getSeconds())}`;
const clean = v => String(v ?? '').trim().replace(/\s+/g, ' ');
const live = a => a.filter(x => !x.deleted);
// money is summed in whole cents so 0.1 + 0.2 never drifts
const cents = n => Math.round(Number(n || 0) * 100);
const total = a => a.reduce((t, x) => t + cents(x.amount), 0) / 100;
const minus = (a, b) => (cents(a) - cents(b)) / 100;
const byCur = items => Object.fromEntries(CURS.map(c => [c, total(items.filter(x => x.cur === c))]));
const byAt = (a, b) => a.at.localeCompare(b.at) || (a.createdAt || '').localeCompare(b.createdAt || '') || a.id.localeCompare(b.id);
const projName = id => id ? (S.projects.find(p => p.id === id)?.name || 'Unknown project') : 'General (no project)';
const fileSafe = s => s.replace(/[\\/:*?"<>|]+/g, '').trim() || 'Company';
const randHex = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
const defCur = () => S.lastCur || 'USD';

function money(n, cur) {
  const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return (n < 0 ? '−' : '') + SYM[cur] + s;
}
// "$1,200 · SSP 50,000" — only the currencies that have money in them
function sumText(items) {
  const parts = Object.entries(byCur(items)).filter(([, v]) => v).map(([c, v]) => money(v, c));
  return parts.length ? parts.join(' · ') : money(0, defCur());
}
function parseAmount(v) {
  const n = Number(String(v ?? '').replace(/[,\s$]/g, '').replace(/^SSP/i, ''));
  return Number.isFinite(n) && n > 0 && n < 1e12 ? Math.round(n * 100) / 100 : null;
}
function fmtTime(at) { const [h, m] = at.slice(11, 16).split(':').map(Number); return `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; }
function fmtDate(date) { const [y, m, d] = date.split('-').map(Number); return `${d} ${MON[m - 1]} ${y}`; }
function fmtDay(date) {
  if (date === stamp().slice(0, 10)) return 'Today';
  if (date === stamp(new Date(Date.now() - 864e5)).slice(0, 10)) return 'Yesterday';
  const [y, m, d] = date.split('-').map(Number);
  return `${DAYS[new Date(y, m - 1, d).getDay()]}, ${fmtDate(date)}`;
}
const fmtWhen = at => `${fmtDay(at.slice(0, 10))}, ${fmtTime(at)}`;
const fmtAbs = at => `${fmtDate(at.slice(0, 10))}, ${fmtTime(at)}`;
const monthName = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;

function nextIds(prefix, n, seq) {
  const start = seq[prefix] || 0;
  // the device code keeps ids unique when several phones add entries offline
  const list = Array.from({ length: n }, (_, i) => `${prefix}-${S.dev}-${String(start + i + 1).padStart(4, '0')}`);
  return [list, { ...seq, [prefix]: start + n }];
}
const logWith = (entries, by = S.lastBy || '') => [...S.log, ...entries.map(([action, id, text], i) => ({ lid: `L-${S.dev}-${Date.now().toString(36)}${i}`, at: stampSec(), action, id, text, by }))];

const LABELS = { cur: 'Money type', amount: 'Amount', paidTo: 'Paid to', reason: 'Reason', location: 'Location', project: 'Project', mode: 'Paid by', note: 'Note', at: 'Date' };
function showVal(k, r) { const v = r[k]; return k === 'amount' ? money(+v, r.cur) : k === 'project' ? projName(v) : k === 'at' ? fmtAbs(v) : (v || '(empty)'); }
function diff(a, b) { return Object.keys(LABELS).filter(k => k in b && String(a[k] ?? '') !== String(b[k] ?? '')).map(k => `${LABELS[k]}: ${showVal(k, a)} → ${showVal(k, b)}`); }
function describe(k, r) {
  return k === 'E'
    ? `${money(r.amount, r.cur)} paid to ${r.paidTo} for ${r.reason}${r.location ? ' at ' + r.location : ''} · ${r.mode} · ${projName(r.project)} · dated ${fmtAbs(r.at)}`
    : `${money(r.amount, r.cur)} received for ${projName(r.project)} · ${r.mode}${r.note ? ' · ' + r.note : ''} · dated ${fmtAbs(r.at)}`;
}
function projStats(id) {
  const p = S.projects.find(x => x.id === id) || {};
  const recv = byCur(live(S.credits).filter(c => c.project === id));
  const spent = byCur(live(S.expenses).filter(e => e.project === id));
  const bal = Object.fromEntries(CURS.map(c => [c, minus(recv[c], spent[c])]));
  const value = p.value || 0, vc = p.valueCur || 'USD';
  const curs = CURS.filter(c => recv[c] || spent[c] || (value && c === vc));
  return { recv, spent, bal, value, vc, curs: curs.length ? curs : [vc], pending: value ? Math.max(0, minus(value, recv[vc])) : 0, pct: value ? Math.min(100, recv[vc] / value * 100) : 0 };
}

/* ---------- password ---------- */
async function hashPw(pw, salt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + '|' + pw));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const isUnlocked = () => Date.now() < unlockedUntil;
function unlock(why) {
  if (isUnlocked()) return Promise.resolve(true);
  return new Promise(resolve => {
    const d = $('#pw');
    $('#pwWhy').textContent = why; $('#pwIn').value = ''; $('#pwErr').textContent = '';
    d.returnValue = '';
    d.showModal(); $('#pwIn').focus();
    $('#pwCancel').onclick = () => d.close();
    $('#pwForm').onsubmit = async e => {
      e.preventDefault();
      if (await hashPw($('#pwIn').value, S.pass.salt) === S.pass.hash) {
        unlockedUntil = Date.now() + UNLOCK_MS; d.close('ok'); renderLock(); resolve(true);
      } else {
        $('#pwErr').textContent = 'Wrong password. Try again.';
        $('#pwIn').select(); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
      }
    };
    d.onclose = () => { if (d.returnValue !== 'ok') resolve(false); };
  });
}
function renderLock() { const p = $('#lockPill'); if (p) p.hidden = !isUnlocked(); }

/* ---------- ui bits ---------- */
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600); }
function openSheet(html) {
  const d = $('#sheet'); $('#sheetIn').innerHTML = html;
  if (!d.open) d.showModal();
  d.scrollTop = 0;
  ($('[autofocus]', d) || $('.close', d))?.focus();
}
const closeSheet = () => $('#sheet').close();
const head = (title, tone = '', sub = '') => `<div class="sh-head ${tone ? 'tone-' + tone : ''}"><div><h2>${esc(title)}</h2>${sub ? `<small>${esc(sub)}</small>` : ''}</div><button type="button" class="close" data-act="close" aria-label="Close">×</button></div>`;
const empty = (title, text) => `<div class="card empty"><strong>${title}</strong>${text}</div>`;
const curLines = (vals, curs = CURS) => curs.map(c => `<b>${money(vals[c], c)}</b>`).join('');
function formErr(f, name, msg) {
  const el = name && f.elements[name];
  if (el && el.classList) { el.classList.add('bad'); el.focus(); }
  $('.err', f).textContent = msg;
}
const formCur = f => (f && f.elements.cur && f.elements.cur.value) || defCur();

function suggestions(field) {
  const seen = new Set(), out = [];
  for (const e of [...S.credits, ...S.expenses].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''))) {
    const v = clean(e[field]);
    if (v && !seen.has(v.toLowerCase())) { seen.add(v.toLowerCase()); out.push(v); }
    if (out.length >= 80) break;
  }
  return out;
}
const datalists = () => ['paidTo', 'reason', 'location', 'by'].map(f => `<datalist id="dl-${f}">${suggestions(f).map(v => `<option value="${esc(v)}">`).join('')}</datalist>`).join('');
const textField = (name, label, ph, val, req = true) => `<label class="fld"><span>${label}${req ? '' : ' <em>(optional)</em>'}</span><input name="${name}" placeholder="${ph}" value="${esc(val)}" ${['paidTo', 'reason', 'location'].includes(name) ? `list="dl-${name}"` : ''} autocomplete="off" maxlength="160" ${req ? 'required' : ''}></label>`;
const curChips = (cur, label = 'Money type') => `<div class="fld"><span>${label}</span><div class="curseg">${CURS.map(c => `<label><input type="radio" name="cur" value="${c}" ${c === cur ? 'checked' : ''}><span><b>${c}</b><small>${CUR_NAME[c]}</small></span></label>`).join('')}</div></div>`;
const amountField = (val, cur, name = 'amount', label = 'Amount', req = true) => `<label class="fld"><span>${label}${req ? '' : ' <em>(optional)</em>'}</span><div class="amt-in"><b class="cur-sym">${SYM[cur].trim()}</b><input name="${name}" inputmode="decimal" placeholder="0" value="${val || ''}" autocomplete="off" ${req ? 'required autofocus' : ''}></div><small class="amt-preview">${val ? money(+val, cur) : ''}</small></label>`;
const byField = () => `<label class="fld"><span>Your name <em>(who is entering this)</em></span><input name="by" placeholder="Type your name" value="${esc(S.lastBy || '')}" list="dl-by" autocomplete="off" maxlength="60" required></label>`;
const modeChips = (cur, label) => `<div class="fld"><span>${label}</span><div class="chips">${MODES.map(m => `<label><input type="radio" name="mode" value="${m}" ${m === cur ? 'checked' : ''}><span>${m}</span></label>`).join('')}</div></div>`;
function projectSelect(cur, optional) {
  const ps = S.projects.filter(p => !p.deleted);
  const isNew = !optional && (!ps.length || cur === '__new');
  return `<label class="fld"><span>Project${optional ? ' <em>(optional)</em>' : ''}</span><select name="project">
    ${optional ? `<option value="">No project — general</option>` : ''}
    ${ps.map(p => `<option value="${p.id}" ${p.id === cur ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
    ${optional ? '' : `<option value="__new" ${isNew ? 'selected' : ''}>＋ New project…</option>`}
  </select></label>
  ${optional ? '' : `<label class="fld newp" ${isNew ? '' : 'hidden'}><span>New project name</span><input name="newProject" placeholder="e.g. Warehouse — Juba" maxlength="80"></label>`}`;
}
function whenField(at, editable) {
  if (editable) return `<label class="fld"><span>Date &amp; time</span><input type="datetime-local" name="at" value="${at}" required></label>`;
  return `<div class="fld"><span>Date &amp; time</span><div class="when"><div><b>${fmtWhen(stamp())}</b><small>Set automatically</small></div><button type="button" class="btn small ghost" data-act="unlockDate">🔒 Change</button></div></div>`;
}

/* ---------- views ---------- */
function render() {
  const main = $('#main');
  const ready = !!S;
  $('#hdr').hidden = $('#tabs').hidden = !ready;
  if (!ready) { main.innerHTML = viewSetup(); $('[autofocus]', main)?.focus(); return; }
  $('#coName').textContent = S.company;
  $('#todayDate').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $$('#tabs [data-tab]').forEach(b => { b.classList.toggle('on', b.dataset.tab === tab); b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'); });
  main.innerHTML = { home: viewHome, hist: viewHistory, proj: viewProjects, sheet: viewSheet }[tab]();
  renderLock(); paintSync();
}

let setupMode = ''; // '' = decide when drawn: an invite link in the address opens 'join'
const isPhone = () => matchMedia('(pointer: coarse)').matches;
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function viewSetup() {
  const mode = setupMode || (inviteFromHash() ? 'join' : 'choose');
  const logo = `<div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></div>`;
  const tip = isPhone() && !isInstalled() ? `<p class="note">📲 <b>First install the app:</b> iPhone — in Safari tap <b>Share → Add to Home Screen</b>. Android — in Chrome tap <b>⋮ → Add to Home screen</b>. Then open <b>Accounts</b> from your home screen.</p>` : '';
  const back = `<p class="center"><button class="link" data-act="setupMode" data-mode="choose">← Back</button></p>`;
  if (mode === 'join') return `<section class="setup card pad">${logo}
    <h1>Join my company</h1>
    <p>Paste the invite link you were sent. Joining needs internet once — after that the app works offline.</p>${tip}
    <form data-form="join">
      <label class="fld"><span>Invite link</span><input name="invite" required autocomplete="off" placeholder="Paste the link here" value="${esc(inviteFromHash() ? location.href : '')}" autofocus></label>
      <p class="err"></p>
      <button class="btn in">Join</button>
    </form>${back}</section>`;
  if (mode === 'new') return `<section class="setup card pad">${logo}
    <h1>New company</h1>
    <p>Set up your company accounts. It takes 30 seconds.</p>
    <form data-form="setup">
      <label class="fld"><span>Company name</span><input name="company" required maxlength="80" placeholder="e.g. ABC Constructions" autofocus></label>
      <label class="fld"><span>Create a password</span><input type="password" name="pw" required minlength="4" autocomplete="new-password" placeholder="At least 4 letters or numbers"></label>
      <label class="fld"><span>Type the password again</span><input type="password" name="pw2" required minlength="4" autocomplete="new-password"></label>
      <p class="note">🔑 The password is needed to <b>edit</b> or <b>delete</b> entries, and to add entries with an <b>old date</b>. Anyone can add new entries. <b>Write it down — it can't be recovered.</b></p>
      <p class="err"></p>
      <button class="btn primary">Start</button>
    </form>${back}</section>`;
  return `<section class="setup card pad">${logo}
    <h1>Welcome!</h1>
    <p>Company accounts in USD and SSP. Works without internet.</p>${tip}
    <div class="stack">
      <button class="btn primary" data-act="setupMode" data-mode="new">Start a new company</button>
      <button class="btn ghost" data-act="setupMode" data-mode="join">Join my company<small class="sub">I have an invite link</small></button>
    </div>
    <p class="center"><button class="link" data-act="restore">Have a backup file? Restore it</button></p>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  </section>`;
}

function viewHome() {
  const E = live(S.expenses), R = live(S.credits);
  const spent = byCur(E), recv = byCur(R);
  const bal = Object.fromEntries(CURS.map(c => [c, minus(recv[c], spent[c])]));
  const today = stamp().slice(0, 10), month = today.slice(0, 7);
  const recent = [...E.map(x => [x, 'E']), ...R.map(x => [x, 'R'])].sort((a, b) => byAt(b[0], a[0])).slice(0, 8);
  return `${backupBanner()}
  <section class="balance ${CURS.some(c => bal[c] < 0) ? 'neg' : ''}" aria-label="Account balance">
    <div class="lbl">Account balance</div>
    ${CURS.map(c => `<div class="bal ${bal[c] < 0 ? 'neg' : ''}"><span class="cur-tag">${c}</span><span class="big">${money(bal[c], c)}</span></div>`).join('')}
    <div class="split"><div class="i"><small>Money received</small>${curLines(recv)}</div><div class="o"><small>Money spent</small>${curLines(spent)}</div></div>
  </section>
  <div class="actions">
    <button class="tile out" data-act="addExpense"><span class="ic">−</span><span><b>Add expense</b><small>Money paid out</small></span></button>
    <button class="tile in" data-act="addCredit"><span class="ic">+</span><span><b>Money received</b><small>From a project</small></span></button>
    <button class="tile bulk" data-act="addBulk"><span class="ic">☰</span><span><b>Add many at once</b><small>Several payments together, with a total</small></span></button>
  </div>
  <div class="minis">
    <div class="mini"><small>Spent today</small>${curLines(byCur(E.filter(e => e.at.startsWith(today))))}</div>
    <div class="mini"><small>Spent this month</small>${curLines(byCur(E.filter(e => e.at.startsWith(month))))}</div>
  </div>
  <div class="sec-head" style="margin-top:22px"><h2 class="sec">Recent</h2><button class="btn small ghost" data-act="tab" data-tab="hist">See all →</button></div>
  ${recent.length ? `<div class="card list">${recent.map(([x, k]) => itemRow(x, k, true)).join('')}</div>` : empty('Nothing here yet', 'Tap <b>Add expense</b> or <b>Money received</b> to start.')}`;
}

function backupBanner() {
  if (S.link || (!S.expenses.length && !S.credits.length)) return '';
  const days = S.lastBackup ? Math.floor((Date.now() - new Date(S.lastBackup).getTime()) / 864e5) : null;
  if (days !== null && days < BACKUP_NAG_DAYS) return '';
  return `<div class="banner"><span>💾 ${days === null ? 'No backup saved yet.' : `Last backup was ${days} days ago.`}</span><button class="btn small" data-act="backup">Save backup</button></div>`;
}

function itemRow(x, k, showDate) {
  const isE = k === 'E';
  const title = isE ? x.reason : `From ${projName(x.project)}`;
  const sub = [isE ? x.paidTo : x.note, isE ? x.location : x.mode, showDate ? fmtDay(x.at.slice(0, 10)) : '', fmtTime(x.at), x.by && 'by ' + x.by].filter(Boolean).map(esc).join(' · ');
  const tags = (x.batch ? '<i class="tag">Bulk</i>' : '') + (x.editedAt ? '<i class="tag">Edited</i>' : '') + (x.manualDate ? '<i class="tag warn">Date set</i>' : '');
  return `<button class="row ${isE ? 'out' : 'in'}" data-act="open" data-kind="${k}" data-id="${x.id}">
    <span class="dot">${isE ? '−' : '+'}</span>
    <span class="main"><span class="t"><span class="tt">${esc(title)}</span>${tags}</span><span class="s">${sub}</span></span>
    <span class="amt">${isE ? '−' : '+'}${money(x.amount, x.cur)}</span></button>`;
}

function viewHistory() {
  const all = live(histKind === 'E' ? S.expenses : S.credits);
  const months = [...new Set(all.map(x => x.at.slice(0, 7)))].sort().reverse();
  return `<div class="seg" role="tablist">
      <button data-act="hist" data-k="E" class="${histKind === 'E' ? 'on' : ''}" role="tab" aria-selected="${histKind === 'E'}">− Money out</button>
      <button data-act="hist" data-k="R" class="${histKind === 'R' ? 'on' : ''}" role="tab" aria-selected="${histKind === 'R'}">+ Money in</button>
    </div>
    <div class="filters">
      <input type="search" id="q" placeholder="Search name, reason, place, USD/SSP…" value="${esc(histQuery)}" aria-label="Search">
      <select id="month" aria-label="Month"><option value="">All time</option>${months.map(m => `<option value="${m}" ${m === histMonth ? 'selected' : ''}>${monthName(m)}</option>`).join('')}</select>
    </div>

/* ---------- saving ---------- */
function dateFrom(v, old) {
  const at = v.at && AT_RE.test(v.at) ? v.at : (old ? old.at : stamp());
  const manualDate = old ? (old.manualDate || at !== old.at) : !!v.at && at.slice(0, 10) !== stamp().slice(0, 10);
  return { at, manualDate };
}
function saveExpense(f) {
  const v = Object.fromEntries(new FormData(f));
  const old = S.expenses.find(x => x.id === f.dataset.id);
  const amount = parseAmount(v.amount);
  if (amount === null) return formErr(f, 'amount', 'Type a correct amount, like 500');
  const rec = { cur: formCur(f), amount, paidTo: clean(v.paidTo), reason: clean(v.reason), location: clean(v.location), project: v.project || '', mode: v.mode || 'Cash', ...dateFrom(v, old) };
  if (!rec.paidTo) return formErr(f, 'paidTo', 'Who did you pay?');
  if (!rec.reason) return formErr(f, 'reason', 'What was it for?');
  const by = clean(v.by);
  if (!by) return formErr(f, 'by', 'Type your name');
  if (old) {
    const changes = diff(old, rec);
    if (!changes.length) { closeSheet(); return toast('Nothing changed'); }
    update({ expenses: S.expenses.map(x => x.id === old.id ? { ...x, ...rec, editedAt: stampSec(), editedBy: by } : x), log: logWith([['Edited', old.id, changes.join(' ; ')]], by), lastBy: by });
    toast('Changes saved ✓');
  } else {
    const [[id], seq] = nextIds('E', 1, S.seq);
    update({
      expenses: [...S.expenses, { id, ...rec, by, createdAt: stampSec(), batch: null }], seq,
      log: rec.manualDate ? logWith([['Old date', id, `Added with date ${fmtAbs(rec.at)} (password used) — ${describe('E', rec)}`]], by) : S.log,
      lastLoc: rec.location, lastMode: rec.mode, lastExpProject: rec.project, lastBy: by, lastCur: rec.cur,
    });
    toast(`Saved ✓ ${money(amount, rec.cur)} to ${rec.paidTo}`);
  }
  closeSheet(); render();
}
function projectFromForm(v) {

  const same = S.projects.find(p => !p.deleted && p.name.toLowerCase() === name.toLowerCase());
  if (same) return [same.id, S.projects, S.seq];
  const [[id], seq] = nextIds('P', 1, S.seq);
  return [id, [...S.projects, { id, name, value: 0, valueCur: v.cur || 'USD', by: clean(v.by), createdAt: stampSec() }], seq];
}

function saveBulk(f) {

    lastLoc: v.location, lastMode: v.mode, lastExpProject: v.project, lastBy: by, lastCur: v.cur,

  toast(`Saved ✓ ${recs.length} payments · ${money(total(recs), v.cur)}`);
}

/* ---------- backup ---------- */
// Phones get the share sheet (Save to Files, WhatsApp, email…); computers get a normal download.
async function download(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (isPhone() && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function doBackup() {
  update({ lastBackup: stamp() });
  download(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), `${fileSafe(S.company)} backup ${stamp().slice(0, 10)}.json`);
  render(); toast('Backup file ready ✓');
}
function validBackup(d) {

  return !!d && d.v === 2 && typeof d.company === 'string' && !!d.pass?.hash && !!d.pass?.salt &&

// The company Google Sheet (running apps-script/Code.gs) is the shared record book.
// Every device saves locally first, then sends its waiting changes and receives everyone

const SYNC_DELAY_MS = 2000;

const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

const appUrl = () => /^https?:$/.test(location.protocol) ? location.origin + location.pathname : APP_URL;

async function callServer(link, body) {

  catch { throw Object.assign(new Error('No internet'), { offline: true }); }

  if (!j.ok) throw new SyncError(j.error || 'Sync failed');

// When a connection fails, find out why, so the message says what to fix.
const BLOCKED_MSG = 'The Google Sheet is blocking the app. In Apps Script click Deploy → Manage deployments → ✏️ (edit), set "Execute as: Me" and "Who has access: Anyone" (exactly "Anyone" — not "Anyone with Google account"), then click Deploy. If plain "Anyone" is not in the list, your company\'s Google admin has switched it off.';

async function answers(url) {

}

async function whyUnreachable(link) {

  if (await answers(link.u)) return { msg: 'The Google Sheet answered but could not save. In Apps Script paste the newest Code.gs, click Save, then Deploy → Manage deployments → ✏️ → Version: New version → Deploy.' };

// First contact with a sheet: on failure explain why; company (Workspace) links get retried in their plain form.

function pendingRecords() {

function stampsNow() {

// Merge records from the Google Sheet into this device. Returns true if anything changed.
function applyPull(pull) {

    const recs = pull.filter(p => p.k === k && p.d && VALID[k](p.d) && p.id === recId(key, p.d));
    if (!recs.length) continue;
    const list = [...S[key]], at = new Map(list.map((r, i) => [recId(key, r), i]));

/* ---------- import old expenses (paste rows from a list or sheet) ---------- */
// One expense per line: Date | Currency | Amount | Paid to | Reason | Location | Project | Paid by | Entered by
// Columns may be separated by tabs (copied from a spreadsheet) or by "|". A header line is skipped.
const IMPORT_COLS = ['Date', 'Currency', 'Amount', 'Paid to', 'Reason', 'Location', 'Project', 'Paid by', 'Entered by'];
const IMPORT_TIME = '12:00'; // old lists have no time of day
const MAX_SHOWN_ERRORS = 8;

function parseDay(text) {
  const t = clean(text);
  let y, m, d, hit;
  if ((hit = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, m, d] = hit.map(Number);
  else if ((hit = t.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2}|\d{4})$/))) { [, d, m, y] = hit.map(Number); if (y < 100) y += 2000; }
  else return null;
  const dt = new Date(y, m - 1, d); // rejects 31/02 and month 13
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d ? `${y}-${pad(m)}-${pad(d)}` : null;
}
function parseImport(text) {
  const rows = [], errors = [];
  String(text || '').split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim().replace(/^\||\|$/g, '');
    if (!line.trim() || /^[\s|:-]+$/.test(line)) return; // blank or a "|---|" divider
    const cells = (line.includes('\t') ? line.split('\t') : line.split('|')).map(clean);
    if (/^date$/i.test(cells[0])) return; // header
    const [date, cur = '', amount = '', paidTo = '', reason = '', location = '', project = '', mode = '', by = ''] = cells;
    const day = parseDay(date);
    const c = /^(usd|\$|us\$)$/i.test(cur) ? 'USD' : /^ssp$/i.test(cur) ? 'SSP' : null;
    const a = parseAmount(amount);
    const problem = !day ? `date "${date}" not understood (use day/month/year)`
      : !c ? `currency "${cur}" must be USD or SSP`
      : a === null ? `amount "${amount}" not understood`
      : !paidTo ? '"Paid to" is empty' : !reason ? '"Reason" is empty' : '';
    if (problem) { errors.push(`Line ${i + 1}: ${problem}`); return; }
    rows.push({ at: `${day}T${IMPORT_TIME}`, cur: c, amount: a, paidTo, reason, location, project, mode: MODES.find(x => x.toLowerCase() === mode.toLowerCase()) || mode || 'Cash', by });
  });
  return { rows, errors };
}
// the same day, money and reason already in the app = already imported; skip it
const importKey = x => [x.at.slice(0, 10), x.cur, cents(x.amount), clean(x.reason).toLowerCase()].join('|');
function importPlan(text) {
  const { rows, errors } = parseImport(text);
  const have = new Set(live(S.expenses).map(importKey));
  const fresh = rows.filter(r => !have.has(importKey(r)));
  return { fresh, errors, skipped: rows.length - fresh.length };
}

  },
  del: b => deleteRecord(b.dataset.kind, b.dataset.id),
  editProject: async b => { if (await unlock('Enter the password to edit this project.')) projectForm(S.projects.find(p => p.id === b.dataset.id)); },
  delProject: b => deleteProject(b.dataset.id),
  unlockDate: async b => {
    if (!await unlock('Enter the password to use a different date.')) return;
    b.closest('.fld').outerHTML = whenField(stamp(), true);
  },
  addRow: () => { const rows = $('.brows'); rows.insertAdjacentHTML('beforeend', bulkRow()); $('.brow:last-child input', rows).focus(); },
  delRow: b => { const rows = $('.brows'); if (rows.children.length > 1) b.closest('.brow').remove(); else $$('input', b.closest('.brow')).forEach(i => (i.value = '')); updateBulk(rows.closest('form')); },
  hist: b => { histKind = b.dataset.k; histMonth = ''; render(); },
  backup: () => doBackup(),
  restore: () => $('#restoreFile').click(),
  settings: async () => { if (await unlock('Enter the password to change settings.')) settingsForm(); },
  lock: () => { unlockedUntil = 0; renderLock(); toast('Locked 🔒'); },
  connect: async () => { if (await unlock('Enter the password to connect this device to the Google Sheet.')) connectForm(); },
  syncNow: () => syncNow(),
  invite: () => inviteSheet(),
  copyInvite: () => navigator.clipboard.writeText($('#inviteLink').value).then(() => toast('Link copied ✓'), () => { $('#inviteLink').select(); toast('Select the link and copy it'); }),
  shareInvite: () => navigator.share({ title: `Join ${S.company}`, text: `Join ${S.company} accounts:`, url: $('#inviteLink').value }).catch(() => {}),
  disconnect: () => disconnect(),
  importOld: () => importSheet(),
};
const FORMS = { expense: saveExpense, credit: saveCredit, bulk: saveBulk, project: saveProject, settings: saveSettings, setup: doSetup, join: doJoin, connect: doConnect, import: doImport };

function refreshAmount(input) {
  const n = parseAmount(input.value);
  input.closest('.fld').querySelector('.amt-preview').textContent = n === null ? '' : money(n, formCur(input.form));
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && ACTIONS[b.dataset.act]) ACTIONS[b.dataset.act](b);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form](f);
});
document.addEventListener('input', e => {
  const t = e.target;
  t.classList.remove('bad');
  if (t.closest('.brows')) updateBulk(t.form);
  if (t.closest('.amt-in')) refreshAmount(t);
  if (t.name === 'rows' && t.form && t.form.dataset.form === 'import') previewImport(t.form);
  if (t.id === 'q') { histQuery = t.value; $('#histRes').innerHTML = histResults(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'cur' && t.form) {
    $$('.cur-sym', t.form).forEach(s => (s.textContent = SYM[t.value].trim()));
    $$('.amt-in input', t.form).forEach(refreshAmount);
    if ($('.brows', t.form)) updateBulk(t.form);
  }
  if (t.name === 'project' && t.form) { const np = $('.newp', t.form); if (np) { np.hidden = t.value !== '__new'; if (!np.hidden) $('input', np).focus(); } }
  if (t.id === 'month') { histMonth = t.value; $('#histRes').innerHTML = histResults(); }
  if (t.id === 'restoreFile') { doRestore(t.files[0]); t.value = ''; }
});
// another tab of this app saved something: pick it up so neither tab overwrites the other
addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });
// sync as soon as the internet comes back, when the app is reopened, and every few minutes
addEventListener('online', () => scheduleSync(0));
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(0); });
setInterval(() => { if (!document.hidden) syncNow(); }, SYNC_EVERY_MS);
setInterval(renderLock, 10000);

if (S) { S = migrate(S); save(); }
if (S && location.hash) history.replaceState(null, '', location.pathname);
render();
scheduleSync(0);
// offline support: the service worker keeps a copy of the app on the device
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Offline copy not installed:', e.message));
}
</script>
</body>
</html>
